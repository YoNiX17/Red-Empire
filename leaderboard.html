<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Empire | Classement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Teko:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        empire: { 500: '#ff3333', 600: '#e60000', 700: '#cc0000', 800: '#990000', 900: '#4d0000', black: '#030303' },
                        gold: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' },
                        silver: { 400: '#e5e7eb', 500: '#9ca3af', 600: '#4b5563' },
                        bronze: { 400: '#fdba74', 500: '#f97316', 600: '#c2410c' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Rajdhani', 'sans-serif'],
                        teko: ['Teko', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow-gold': '0 0 20px rgba(234, 179, 8, 0.3)',
                        'glow-silver': '0 0 20px rgba(156, 163, 175, 0.3)',
                        'glow-bronze': '0 0 20px rgba(249, 115, 22, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #030303; color: #e5e5e5; overflow-x: hidden; }
        
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }

        .glass-panel { 
            background: rgba(20, 20, 20, 0.6); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        /* --- PODIUM CARD STYLES (TOTEM) --- */
        .podium-card {
            background: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
            border-radius: 1rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .podium-card:hover { transform: translateY(-5px); }

        /* Rank Colors & Glows */
        .rank-1-card { border-top: 4px solid #eab308; box-shadow: 0 -10px 40px -10px rgba(234, 179, 8, 0.3); }
        .rank-2-card { border-top: 4px solid #e5e7eb; box-shadow: 0 -10px 40px -10px rgba(229, 231, 235, 0.2); }
        .rank-3-card { border-top: 4px solid #f97316; box-shadow: 0 -10px 40px -10px rgba(249, 115, 22, 0.2); }

        /* Avatar Rings */
        .avatar-ring { 
            border-width: 3px; 
            border-style: solid; 
            padding: 3px; 
            background-clip: content-box; 
        }
        .ring-gold { border-color: #eab308; box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
        .ring-silver { border-color: #e5e7eb; box-shadow: 0 0 15px rgba(229, 231, 235, 0.3); }
        .ring-bronze { border-color: #f97316; box-shadow: 0 0 15px rgba(249, 115, 22, 0.3); }

        /* Rank Badge (#1, #2) */
        .rank-badge-pill {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            padding: 2px 12px;
            border-radius: 4px;
            border: 1px solid #333;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Crown Animation */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .crown-anim { animation: float 3s ease-in-out infinite; }

        /* LISTE */
        .rank-row { 
            transition: all 0.2s ease-out; 
            border-left: 2px solid transparent;
        }
        .rank-row:hover { 
            background: rgba(255,255,255,0.05); 
            border-left-color: #ff3333;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030303; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body class="antialiased selection:bg-gold-500 selection:text-black flex flex-col min-h-screen bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">

    <div class="fixed inset-0 bg-[radial-gradient(circle_at_top,rgba(255,51,51,0.05),#030303_60%)] pointer-events-none z-[-1]"></div>

    <!-- NAVIGATION -->
    <nav class="fixed w-full z-50 border-b border-white/10 bg-black/95 backdrop-blur-md py-4">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-trophy text-gold-500 text-xl"></i>
                <span class="font-display font-bold text-lg tracking-widest text-white">CLASSEMENT <span class="text-empire-500">MONDIAL</span></span>
            </div>
            <a href="blindtest_ranked.html" class="text-sm font-mono font-bold text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> RETOUR AU HUB
            </a>
        </div>
    </nav>

    <!-- HEADER -->
    <section class="pt-32 pb-16 text-center px-4">
        <h1 class="font-teko text-7xl md:text-9xl text-white leading-none mb-2 tracking-tighter uppercase" data-aos="zoom-in">
            Légendes de l'Arène
        </h1>
        <div class="h-1 w-24 bg-empire-600 mx-auto rounded-full"></div>
    </section>

    <!-- PODIUM (TOP 3) -->
    <section class="max-w-5xl mx-auto px-4 mb-24">
        <div id="podium-container" class="flex flex-col md:flex-row justify-center items-end gap-6 md:gap-8 min-h-[480px]">
            <div id="loading-msg" class="text-empire-500 font-mono animate-pulse w-full text-center text-xl">
                <i class="fa-solid fa-satellite-dish fa-spin mr-3"></i>CONNEXION AUX SERVEURS...
            </div>
        </div>
    </section>

    <!-- LISTE (TOP 4+) -->
    <section class="max-w-4xl mx-auto px-4 pb-32">
        <div class="glass-panel rounded-xl overflow-hidden border-t-2 border-t-white/10" data-aos="fade-up">
            
            <div class="grid grid-cols-12 gap-4 p-4 border-b border-white/10 text-xs font-mono text-gray-500 uppercase tracking-widest bg-black/40">
                <div class="col-span-2 text-center">#</div>
                <div class="col-span-5">Joueur</div>
                <div class="col-span-3 text-center">Rang</div>
                <div class="col-span-2 text-right">Points</div>
            </div>

            <div id="leaderboard-list" class="divide-y divide-white/5">
                <!-- INJECTÉ PAR JS -->
            </div>

        </div>
    </section>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script> AOS.init(); </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, query, orderByChild, limitToLast, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { eloEngine } from "./elo_engine.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                initLeaderboard();
            } else {
                document.getElementById('loading-msg').innerHTML = `
                    <div class="flex flex-col items-center gap-4">
                        <i class="fa-solid fa-lock text-3xl text-gray-500"></i>
                        <span class="text-gray-500 font-bold font-mono">ACCÈS RESTREINT</span>
                        <a href="index.html" class="text-white underline text-sm">Se connecter</a>
                    </div>
                `;
            }
        });

        function initLeaderboard() {
            const usersRef = ref(db, 'users');
            const q = query(usersRef, orderByChild('elo'), limitToLast(50));
            
            onValue(q, (snapshot) => {
                const users = [];
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    if(data.username || data.name) {
                        const safeElo = (data.elo === undefined || data.elo === null) ? 500 : data.elo;
                        users.push({
                            name: data.username || data.name || "Inconnu",
                            avatar: data.avatar || `https://ui-avatars.com/api/?name=${data.username || "U"}`,
                            elo: safeElo,
                            uid: childSnapshot.key
                        });
                    }
                });

                users.sort((a, b) => b.elo - a.elo);

                if (users.length === 0) {
                    document.getElementById('loading-msg').innerText = "Aucun joueur trouvé.";
                    return;
                }

                renderPodium(users.slice(0, 3));
                renderList(users.slice(3));
            }, (error) => {
                console.error("Erreur:", error);
            });
        }

        function renderPodium(top3) {
            const container = document.getElementById('podium-container');
            container.innerHTML = '';

            const visualOrder = [1, 0, 2]; // Ordre d'affichage: #2, #1, #3
            
            visualOrder.forEach(idx => {
                const player = top3[idx];
                if (!player) return;

                const rank = idx + 1;
                const rankInfo = eloEngine.getRankInfo(player.elo);
                
                let cardStyle = "";
                let heightClass = "";
                let ringColor = "";
                let crownHTML = "";
                let rankColorClass = "";
                let orderClass = "";

                if(rank === 1) {
                    cardStyle = "rank-1-card";
                    heightClass = "h-[480px] w-full md:w-[320px]";
                    ringColor = "ring-gold";
                    rankColorClass = "text-gold-400";
                    orderClass = "order-1 md:order-2 z-10"; // #1 au milieu et devant
                    crownHTML = `<div class="absolute -top-16 crown-anim"><i class="fa-solid fa-crown text-gold-400 text-6xl drop-shadow-[0_0_15px_rgba(234,179,8,0.6)]"></i></div>`;
                } else if(rank === 2) {
                    cardStyle = "rank-2-card";
                    heightClass = "h-[400px] w-full md:w-[280px]";
                    ringColor = "ring-silver";
                    rankColorClass = "text-gray-300";
                    orderClass = "order-2 md:order-1 mt-8"; // #2 à gauche, un peu plus bas
                } else {
                    cardStyle = "rank-3-card";
                    heightClass = "h-[380px] w-full md:w-[280px]";
                    ringColor = "ring-bronze";
                    rankColorClass = "text-orange-400";
                    orderClass = "order-3 md:order-3 mt-12"; // #3 à droite, encore plus bas
                }

                const html = `
                    <div class="podium-card ${cardStyle} ${heightClass} ${orderClass}" data-aos="fade-up" data-aos-delay="${rank*150}">
                        ${crownHTML}
                        
                        <!-- Avatar Section -->
                        <div class="relative mb-6">
                            <div class="w-24 h-24 md:w-32 md:h-32 rounded-full avatar-ring ${ringColor} bg-black relative z-10">
                                <img src="${player.avatar}" class="w-full h-full rounded-full object-cover">
                            </div>
                            <div class="rank-badge-pill">#${rank}</div>
                        </div>

                        <!-- Username -->
                        <div class="font-display font-bold text-white text-2xl md:text-3xl tracking-wide mb-2 truncate max-w-full px-2">${player.name}</div>

                        <!-- Rank Emblem (Image) -->
                        <div class="mb-2">
                            <img src="${rankInfo.img}" class="w-16 h-16 md:w-20 md:h-20 object-contain filter drop-shadow-lg">
                        </div>

                        <!-- Rank Name -->
                        <div class="font-teko font-bold text-xl tracking-[0.2em] uppercase mb-auto ${rankColorClass}">${rankInfo.name}</div>

                        <!-- Score Box -->
                        <div class="mt-4 w-full bg-black/50 border border-white/5 rounded-lg py-3 px-4 text-center">
                            <div class="font-mono text-3xl md:text-4xl font-black text-white leading-none">${player.elo}</div>
                            <div class="text-[9px] text-gray-500 font-bold uppercase tracking-[0.2em] mt-1">League Points</div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function renderList(others) {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';

            others.forEach((player, index) => {
                const realRank = index + 4;
                const rankInfo = eloEngine.getRankInfo(player.elo);

                const html = `
                    <div class="rank-row grid grid-cols-12 gap-4 p-4 items-center group cursor-default">
                        <div class="col-span-2 text-center font-mono font-bold text-gray-500 text-lg group-hover:text-white">#${realRank}</div>
                        
                        <div class="col-span-5 flex items-center gap-4">
                            <img src="${player.avatar}" class="w-10 h-10 rounded-full border border-gray-800 object-cover bg-black group-hover:border-white transition-colors">
                            <span class="font-bold text-gray-300 text-sm truncate group-hover:text-white font-display tracking-wide">${player.name}</span>
                        </div>

                        <div class="col-span-3 text-center flex justify-center items-center gap-2">
                            <img src="${rankInfo.img}" class="w-6 h-6 object-contain hidden md:block">
                            <span class="text-[10px] font-bold uppercase tracking-wider" style="color:${rankInfo.color}">${rankInfo.name}</span>
                        </div>
                        
                        <div class="col-span-2 text-right">
                            <span class="font-mono font-bold text-lg text-white group-hover:text-empire-500 transition-colors">${player.elo}</span>
                        </div>
                    </div>
                `;
                list.innerHTML += html;
            });
        }
    </script>
</body>
</html>
