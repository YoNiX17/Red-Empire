<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Empire | Classement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Teko:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        empire: { 500: '#ff3333', 600: '#e60000', 700: '#cc0000', 800: '#990000', 900: '#4d0000', black: '#030303' },
                        gold: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Rajdhani', 'sans-serif'],
                        teko: ['Teko', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #030303; color: #e5e5e5; overflow-x: hidden; }
        
        .glass-panel { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* PODIUM STYLES */
        .podium-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .podium-card:hover { transform: translateY(-10px); }
        
        .rank-1 { border-color: #eab308; box-shadow: 0 0 50px rgba(234, 179, 8, 0.2); z-index: 10; transform: scale(1.1); }
        .rank-2 { border-color: #9ca3af; box-shadow: 0 0 30px rgba(156, 163, 175, 0.2); z-index: 5; margin-top: 40px; }
        .rank-3 { border-color: #c2410c; box-shadow: 0 0 30px rgba(194, 65, 12, 0.2); z-index: 5; margin-top: 60px; }

        .rank-row { transition: all 0.2s; border-left: 3px solid transparent; }
        .rank-row:hover { background: rgba(255,255,255,0.05); padding-left: 10px; border-left-color: #ff3333; }

        /* Crown Animation */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .crown-anim { animation: float 3s ease-in-out infinite; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030303; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body class="antialiased selection:bg-gold-500 selection:text-black flex flex-col min-h-screen bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">

    <div class="fixed inset-0 bg-[radial-gradient(circle_at_top,rgba(255,51,51,0.1),#030303_70%)] pointer-events-none z-[-1]"></div>

    <!-- NAVIGATION -->
    <nav class="fixed w-full z-50 border-b border-white/10 bg-black/90 backdrop-blur-md py-4">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-trophy text-gold-500 text-xl"></i>
                <span class="font-display font-bold text-lg tracking-widest text-white">CLASSEMENT <span class="text-empire-500">MONDIAL</span></span>
            </div>
            <a href="blindtest_ranked.html" class="text-sm font-mono font-bold text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> RETOUR AU HUB
            </a>
        </div>
    </nav>

    <!-- HEADER -->
    <section class="pt-32 pb-12 text-center px-4">
        <h1 class="font-teko text-7xl md:text-9xl text-white leading-none mb-2 tracking-tighter" data-aos="fade-down">
            HALL OF FAME
        </h1>
        <p class="font-mono text-gray-400 text-sm tracking-[0.3em] uppercase" data-aos="fade-up">Les légendes de l'arène</p>
    </section>

    <!-- PODIUM (TOP 3) -->
    <section class="max-w-5xl mx-auto px-4 mb-20">
        <div id="podium-container" class="flex flex-col md:flex-row justify-center items-end gap-6 md:gap-8 min-h-[400px]">
            <div class="text-gray-500 font-mono animate-pulse w-full text-center">Connexion au satellite Ranked...</div>
        </div>
    </section>

    <!-- LISTE (TOP 4+) -->
    <section class="max-w-4xl mx-auto px-4 pb-32">
        <div class="glass-panel rounded-xl overflow-hidden border-t-4 border-t-empire-600" data-aos="fade-up">
            
            <div class="grid grid-cols-12 gap-4 p-4 border-b border-white/10 text-xs font-mono text-gray-500 uppercase tracking-widest bg-black/40">
                <div class="col-span-2 text-center">#</div>
                <div class="col-span-6">Joueur</div>
                <div class="col-span-4 text-right">Points Elo</div>
            </div>

            <div id="leaderboard-list" class="divide-y divide-white/5">
                <!-- INJECTÉ PAR JS -->
            </div>

        </div>
    </section>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script> AOS.init(); </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, query, orderByChild, limitToLast, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { eloEngine } from "./elo_engine.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- CHARGEMENT TEMPS RÉEL ---
        function initLeaderboard() {
            const usersRef = ref(db, 'users');
            // On récupère les 50 meilleurs selon le champ 'elo'
            const q = query(usersRef, orderByChild('elo'), limitToLast(50));
            
            // onValue = Écouteur Temps Réel (met à jour si l'elo change)
            onValue(q, (snapshot) => {
                const users = [];
                
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    // Filtre les utilisateurs valides
                    if(data.username || data.name) {
                        users.push({
                            name: data.username || data.name || "Inconnu",
                            avatar: data.avatar || `https://ui-avatars.com/api/?name=${data.username || "U"}`,
                            elo: data.elo || 500, // Elo par défaut si absent
                            uid: childSnapshot.key
                        });
                    }
                });

                // Firebase renvoie en ordre croissant (du plus petit au plus grand)
                // On inverse pour avoir le TOP 1 en premier
                users.sort((a, b) => b.elo - a.elo);

                renderPodium(users.slice(0, 3));
                renderList(users.slice(3));
            });
        }

        function renderPodium(top3) {
            const container = document.getElementById('podium-container');
            container.innerHTML = '';

            // Ordre visuel du podium : 2ème (Gauche), 1er (Centre), 3ème (Droite)
            const visualOrder = [1, 0, 2]; 
            
            visualOrder.forEach(idx => {
                const player = top3[idx];
                if (!player) return;

                const rank = idx + 1; // 1, 2 ou 3
                // Utilisation du Moteur Elo pour récupérer le rang officiel (ex: Diamant)
                const rankInfo = eloEngine.getRankInfo(player.elo);
                
                let cardClass = "";
                let badge = "";
                let height = "";
                
                if(rank === 1) { 
                    cardClass = "rank-1 bg-gradient-to-b from-gold-900/40 to-black w-full md:w-1/3 border-t-4 order-1 md:order-2"; 
                    height = "h-[420px]";
                    badge = '<i class="fa-solid fa-crown text-gold-400 text-5xl mb-4 crown-anim drop-shadow-[0_0_10px_gold]"></i>';
                }
                else if(rank === 2) { 
                    cardClass = "rank-2 bg-gradient-to-b from-gray-800/40 to-black w-full md:w-1/4 border-t-4 order-2 md:order-1"; 
                    height = "h-[340px]";
                }
                else { 
                    cardClass = "rank-3 bg-gradient-to-b from-orange-900/40 to-black w-full md:w-1/4 border-t-4 order-3 md:order-3"; 
                    height = "h-[300px]";
                }

                const html = `
                    <div class="podium-card ${cardClass} ${height} rounded-t-xl p-6 flex flex-col items-center justify-end relative glass-panel group cursor-default" data-aos="fade-up" data-aos-delay="${rank*100}">
                        <div class="absolute -top-12 flex flex-col items-center w-full">
                            ${badge}
                            <div class="relative">
                                <img src="${player.avatar}" class="w-24 h-24 rounded-full border-4 border-black shadow-2xl object-cover z-10 relative">
                                <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 bg-black text-white text-sm font-bold px-3 py-1 rounded-full border border-gray-700 z-20 shadow-md">#${rank}</div>
                            </div>
                        </div>
                        
                        <div class="text-center mt-12 w-full">
                            <div class="font-display font-bold text-white text-2xl truncate mb-1 text-shadow-lg">${player.name}</div>
                            <div class="font-mono text-4xl font-black text-white mb-4 tracking-tighter">${player.elo} <span class="text-sm text-gray-500 font-normal">LP</span></div>
                            
                            <!-- BADGE DE RANG DYNAMIQUE -->
                            <div class="flex items-center justify-center gap-3 bg-white/5 py-3 rounded-lg border border-white/5 group-hover:bg-white/10 transition-colors">
                                <img src="${rankInfo.img}" class="w-8 h-8 object-contain filter drop-shadow-md">
                                <div class="flex flex-col items-start leading-none">
                                    <span class="text-[10px] text-gray-500 font-mono uppercase">RANG ACTUEL</span>
                                    <span class="text-xs font-mono font-bold tracking-widest uppercase" style="color:${rankInfo.color}">${rankInfo.name}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function renderList(others) {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';

            others.forEach((player, index) => {
                const realRank = index + 4;
                // Calcul du rang dynamique pour chaque joueur
                const rankInfo = eloEngine.getRankInfo(player.elo);

                const html = `
                    <div class="rank-row grid grid-cols-12 gap-4 p-4 items-center group cursor-default">
                        <div class="col-span-2 text-center font-mono font-bold text-gray-500 text-lg group-hover:text-white">#${realRank}</div>
                        
                        <div class="col-span-6 flex items-center gap-4">
                            <img src="${player.avatar}" class="w-10 h-10 rounded border border-gray-700 object-cover bg-black">
                            <div class="flex flex-col">
                                <span class="font-bold text-white text-base truncate">${player.name}</span>
                                <div class="flex items-center gap-2">
                                    <img src="${rankInfo.img}" class="w-4 h-4 object-contain">
                                    <span class="text-[10px] font-bold uppercase tracking-wider" style="color:${rankInfo.color}">${rankInfo.name}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-span-4 text-right">
                            <span class="font-mono font-bold text-xl text-white group-hover:text-empire-500 transition-colors">${player.elo}</span>
                            <span class="text-[10px] text-gray-600 block -mt-1">POINTS</span>
                        </div>
                    </div>
                `;
                list.innerHTML += html;
            });
        }

        // Démarrage
        initLeaderboard();

    </script>
</body>
</html>
