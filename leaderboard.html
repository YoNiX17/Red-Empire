<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Empire | Classement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Teko:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        empire: { 500: '#ff3333', 600: '#e60000', 700: '#cc0000', 800: '#990000', 900: '#4d0000', black: '#030303' },
                        gold: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' },
                        silver: { 400: '#e5e7eb', 500: '#9ca3af', 600: '#4b5563' },
                        bronze: { 400: '#fdba74', 500: '#f97316', 600: '#c2410c' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Rajdhani', 'sans-serif'],
                        teko: ['Teko', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #030303; color: #e5e5e5; overflow-x: hidden; }
        
        .glass-panel { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* PODIUM STYLES */
        .podium-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .podium-card:hover { transform: translateY(-10px); }
        
        .rank-1 { border-color: #eab308; box-shadow: 0 0 50px rgba(234, 179, 8, 0.2); z-index: 10; transform: scale(1.1); }
        .rank-2 { border-color: #9ca3af; box-shadow: 0 0 30px rgba(156, 163, 175, 0.2); z-index: 5; margin-top: 40px; }
        .rank-3 { border-color: #c2410c; box-shadow: 0 0 30px rgba(194, 65, 12, 0.2); z-index: 5; margin-top: 60px; }

        .rank-row { transition: all 0.2s; border-left: 3px solid transparent; }
        .rank-row:hover { background: rgba(255,255,255,0.05); padding-left: 10px; border-left-color: #ff3333; }

        /* Crown Animation */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .crown-anim { animation: float 3s ease-in-out infinite; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030303; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body class="antialiased selection:bg-gold-500 selection:text-black flex flex-col min-h-screen bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">

    <div class="fixed inset-0 bg-[radial-gradient(circle_at_top,rgba(255,51,51,0.1),#030303_70%)] pointer-events-none z-[-1]"></div>

    <!-- NAVIGATION -->
    <nav class="fixed w-full z-50 border-b border-white/10 bg-black/90 backdrop-blur-md py-4">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-trophy text-gold-500 text-xl"></i>
                <span class="font-display font-bold text-lg tracking-widest text-white">CLASSEMENT <span class="text-empire-500">MONDIAL</span></span>
            </div>
            <a href="blindtest_ranked.html" class="text-sm font-mono font-bold text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> RETOUR AU HUB
            </a>
        </div>
    </nav>

    <!-- HEADER -->
    <section class="pt-32 pb-12 text-center px-4">
        <h1 class="font-teko text-7xl md:text-9xl text-white leading-none mb-2 tracking-tighter" data-aos="fade-down">
            HALL OF FAME
        </h1>
        <p class="font-mono text-gray-400 text-sm tracking-[0.3em] uppercase" data-aos="fade-up">Les légendes de l'arène</p>
    </section>

    <!-- PODIUM (TOP 3) -->
    <section class="max-w-5xl mx-auto px-4 mb-20">
        <div id="podium-container" class="flex flex-col md:flex-row justify-center items-end gap-6 md:gap-8 min-h-[400px]">
            <!-- INJECTÉ PAR JS -->
            <div class="text-gray-500 font-mono animate-pulse">Chargement des champions...</div>
        </div>
    </section>

    <!-- LISTE (TOP 4+) -->
    <section class="max-w-4xl mx-auto px-4 pb-32">
        <div class="glass-panel rounded-xl overflow-hidden border-t-4 border-t-empire-600" data-aos="fade-up">
            
            <div class="grid grid-cols-12 gap-4 p-4 border-b border-white/10 text-xs font-mono text-gray-500 uppercase tracking-widest bg-black/40">
                <div class="col-span-2 text-center">#</div>
                <div class="col-span-6">Joueur</div>
                <div class="col-span-4 text-right">Points Elo</div>
            </div>

            <div id="leaderboard-list" class="divide-y divide-white/5">
                <!-- INJECTÉ PAR JS -->
            </div>

        </div>
    </section>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script> AOS.init(); </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, query, orderByChild, limitToLast, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { eloEngine } from "./elo_engine.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        async function loadLeaderboard() {
            const usersRef = ref(db, 'users');
            // On prend les 50 meilleurs (Firebase trie par ordre croissant, donc les plus petits d'abord)
            const q = query(usersRef, orderByChild('elo'), limitToLast(50));
            
            const snapshot = await get(q);
            const users = [];
            
            snapshot.forEach((childSnapshot) => {
                const data = childSnapshot.val();
                // On s'assure qu'ils ont un pseudo et un elo
                if(data.username || data.name) {
                    users.push({
                        name: data.username || data.name || "Inconnu",
                        avatar: data.avatar || `https://ui-avatars.com/api/?name=${data.username || "U"}`,
                        elo: data.elo || 500, // Default 500
                        uid: childSnapshot.key
                    });
                }
            });

            // Inverser pour avoir le plus grand en premier
            users.sort((a, b) => b.elo - a.elo);

            renderPodium(users.slice(0, 3));
            renderList(users.slice(3));
        }

        function renderPodium(top3) {
            const container = document.getElementById('podium-container');
            container.innerHTML = '';

            // Ordre visuel : 2ème (Gauche), 1er (Centre), 3ème (Droite)
            const podiumOrder = [1, 0, 2]; 
            
            podiumOrder.forEach(idx => {
                const player = top3[idx];
                if (!player) return;

                const rank = idx + 1;
                const rankInfo = eloEngine.getRankInfo(player.elo);
                
                let cardClass = "";
                let badge = "";
                
                if(rank === 1) { 
                    cardClass = "rank-1 bg-gradient-to-b from-gold-900/40 to-black h-[400px] w-full md:w-1/3 border-t-4"; 
                    badge = '<i class="fa-solid fa-crown text-gold-400 text-4xl mb-2 crown-anim"></i>';
                }
                else if(rank === 2) { 
                    cardClass = "rank-2 bg-gradient-to-b from-gray-800/40 to-black h-[320px] w-full md:w-1/4 border-t-4 order-first md:order-none"; 
                }
                else { 
                    cardClass = "rank-3 bg-gradient-to-b from-orange-900/40 to-black h-[280px] w-full md:w-1/4 border-t-4"; 
                }

                const html = `
                    <div class="podium-card ${cardClass} rounded-t-xl p-6 flex flex-col items-center justify-end relative glass-panel" data-aos="fade-up" data-aos-delay="${rank*100}">
                        <div class="absolute -top-10 flex flex-col items-center">
                            ${badge}
                            <img src="${player.avatar}" class="w-20 h-20 rounded-full border-4 border-black shadow-lg object-cover">
                            <div class="bg-black text-white text-xs font-bold px-3 py-1 rounded-full -mt-3 border border-gray-700">#${rank}</div>
                        </div>
                        
                        <div class="text-center mt-12 w-full">
                            <div class="font-display font-bold text-white text-xl truncate mb-1">${player.name}</div>
                            <div class="font-mono text-3xl font-black text-white mb-2">${player.elo} <span class="text-xs text-gray-500">LP</span></div>
                            
                            <div class="flex items-center justify-center gap-2 bg-white/5 py-2 rounded-lg border border-white/5">
                                <img src="${rankInfo.img}" class="w-6 h-6 object-contain">
                                <span class="text-xs font-mono font-bold tracking-widest" style="color:${rankInfo.color}">${rankInfo.name}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function renderList(others) {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';

            others.forEach((player, index) => {
                const realRank = index + 4;
                const rankInfo = eloEngine.getRankInfo(player.elo);

                const html = `
                    <div class="rank-row grid grid-cols-12 gap-4 p-4 items-center group">
                        <div class="col-span-2 text-center font-mono font-bold text-gray-500 text-lg">#${realRank}</div>
                        
                        <div class="col-span-6 flex items-center gap-3">
                            <img src="${player.avatar}" class="w-8 h-8 rounded border border-gray-700 object-cover">
                            <div class="flex flex-col">
                                <span class="font-bold text-white text-sm truncate">${player.name}</span>
                                <div class="flex items-center gap-1 md:hidden">
                                    <span class="text-[10px]" style="color:${rankInfo.color}">${rankInfo.name}</span>
                                </div>
                            </div>
                            <img src="${rankInfo.img}" class="w-6 h-6 object-contain hidden md:block" title="${rankInfo.name}">
                        </div>
                        
                        <div class="col-span-4 text-right">
                            <span class="font-mono font-bold text-white">${player.elo}</span>
                            <span class="text-[10px] text-gray-600">LP</span>
                        </div>
                    </div>
                `;
                list.innerHTML += html;
            });
        }

        // Init
        loadLeaderboard();

    </script>
</body>
</html>
