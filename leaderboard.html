<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Empire | Classement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Teko:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        empire: { 500: '#ff3333', 600: '#e60000', 700: '#cc0000', 800: '#990000', 900: '#4d0000', black: '#030303' },
                        gold: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' },
                        silver: { 400: '#e5e7eb', 500: '#9ca3af', 600: '#4b5563' },
                        bronze: { 400: '#fdba74', 500: '#f97316', 600: '#c2410c' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Rajdhani', 'sans-serif'],
                        teko: ['Teko', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                        'slide-in': 'slideIn 0.5s ease-out forwards'
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                        pulseGlow: { '0%, 100%': { opacity: 0.5 }, '50%': { opacity: 1 } },
                        slideIn: { '0%': { opacity: 0, transform: 'translateX(-20px)' }, '100%': { opacity: 1, transform: 'translateX(0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #030303; color: #e5e5e5; overflow-x: hidden; }
        
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }

        .glass-panel { 
            background: rgba(20, 20, 20, 0.4); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        /* --- PODIUM CARDS --- */
        .podium-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: visible;
        }
        .podium-card:hover { transform: translateY(-15px) scale(1.02); z-index: 20; }
        
        /* Rank 1 (Gold) */
        .rank-1 { 
            background: linear-gradient(180deg, rgba(234, 179, 8, 0.15) 0%, rgba(0,0,0,0.8) 100%);
            border-top: 4px solid #eab308;
            box-shadow: 0 -10px 50px rgba(234, 179, 8, 0.2);
        }
        .rank-1 .avatar-ring { border-color: #eab308; box-shadow: 0 0 20px #eab308; }
        
        /* Rank 2 (Silver) */
        .rank-2 { 
            background: linear-gradient(180deg, rgba(156, 163, 175, 0.15) 0%, rgba(0,0,0,0.8) 100%);
            border-top: 4px solid #9ca3af;
            box-shadow: 0 -10px 30px rgba(156, 163, 175, 0.1);
        }
        .rank-2 .avatar-ring { border-color: #9ca3af; box-shadow: 0 0 15px #9ca3af; }

        /* Rank 3 (Bronze) */
        .rank-3 { 
            background: linear-gradient(180deg, rgba(194, 65, 12, 0.15) 0%, rgba(0,0,0,0.8) 100%);
            border-top: 4px solid #c2410c;
            box-shadow: 0 -10px 30px rgba(194, 65, 12, 0.1);
        }
        .rank-3 .avatar-ring { border-color: #c2410c; box-shadow: 0 0 15px #c2410c; }

        /* --- LISTE STYLES --- */
        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .rank-row { 
            transition: all 0.2s ease-out; 
            border-left: 2px solid transparent;
            opacity: 0; /* Pour animation d'entrée */
            animation: slideIn 0.5s ease-out forwards;
        }
        .rank-row:hover { 
            background: rgba(255,255,255,0.08); 
            transform: scale(1.01) translateX(5px);
            border-left-color: #ff3333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .crown-anim { animation: float 3s ease-in-out infinite; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030303; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body class="antialiased selection:bg-gold-500 selection:text-black flex flex-col min-h-screen bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">

    <canvas id="canvas-container"></canvas>
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_top,rgba(255,51,51,0.08),#030303_60%)] pointer-events-none z-[-1]"></div>

    <!-- NAVIGATION -->
    <nav class="fixed w-full z-50 border-b border-white/10 bg-black/90 backdrop-blur-md py-4">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
            <div class="flex items-center space-x-3 group cursor-pointer">
                <div class="w-8 h-8 flex items-center justify-center bg-empire-600 rounded rotate-45 group-hover:rotate-0 transition-transform">
                    <i class="fa-solid fa-trophy text-white text-sm -rotate-45 group-hover:rotate-0 transition-transform"></i>
                </div>
                <span class="font-display font-bold text-xl tracking-widest text-white">CLASSEMENT <span class="text-empire-500">MONDIAL</span></span>
            </div>
            <a href="blindtest_ranked.html" class="text-sm font-mono font-bold text-gray-400 hover:text-white transition-colors flex items-center gap-2 group">
                <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i> RETOUR AU HUB
            </a>
        </div>
    </nav>

    <!-- HEADER -->
    <section class="pt-32 pb-16 text-center px-4 relative">
        <div class="absolute top-20 left-1/2 -translate-x-1/2 w-[500px] h-[200px] bg-empire-600/20 blur-[100px] rounded-full pointer-events-none"></div>
        <h1 class="font-teko text-8xl md:text-[10rem] text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-700 leading-none mb-2 tracking-tighter drop-shadow-lg" data-aos="zoom-in">
            HALL OF FAME
        </h1>
        <div class="flex items-center justify-center gap-4 text-gray-400 font-mono text-sm tracking-[0.3em] uppercase">
            <div class="h-px w-12 bg-empire-600"></div>
            <span>Légendes de l'Arène</span>
            <div class="h-px w-12 bg-empire-600"></div>
        </div>
    </section>

    <!-- PODIUM (TOP 3) -->
    <section class="max-w-6xl mx-auto px-4 mb-24 relative z-10">
        <div id="podium-container" class="flex flex-col md:flex-row justify-center items-end gap-4 md:gap-8 min-h-[450px]">
            <div id="loading-msg" class="text-empire-500 font-mono animate-pulse w-full text-center text-xl">
                <i class="fa-solid fa-satellite-dish fa-spin mr-3"></i>SYNCHRONISATION SATELLITE...
            </div>
        </div>
    </section>

    <!-- LISTE (TOP 4+) -->
    <section class="max-w-5xl mx-auto px-4 pb-32 relative z-10">
        <div class="glass-panel rounded-2xl overflow-hidden border-t border-t-white/10 shadow-2xl" data-aos="fade-up">
            
            <div class="grid grid-cols-12 gap-4 p-5 border-b border-white/5 text-[10px] font-mono text-gray-500 uppercase tracking-[0.2em] bg-black/60 backdrop-blur-xl sticky top-0 z-20">
                <div class="col-span-2 md:col-span-1 text-center">#</div>
                <div class="col-span-5 md:col-span-5">Joueur</div>
                <div class="col-span-3 md:col-span-3 text-right">Rang</div>
                <div class="col-span-2 md:col-span-3 text-right">Points Elo</div>
            </div>

            <div id="leaderboard-list" class="divide-y divide-white/5">
                <!-- INJECTÉ PAR JS -->
            </div>

        </div>
    </section>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script> 
        AOS.init();
        
        // Particles Background
        const canvas = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');
        let particlesArray;
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.color = Math.random() > 0.5 ? '#ff3333' : '#ffffff';
            }
            update() { this.x += this.speedX; this.y += this.speedY; if (this.size > 0.1) this.size -= 0.01; }
            draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (particlesArray.length < 50) particlesArray.push(new Particle());
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                if (particlesArray[i].size <= 0.1) particlesArray.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        particlesArray = []; animate();
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, query, orderByChild, limitToLast, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { eloEngine } from "./elo_engine.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // --- ATTENTE DE LA CONNEXION AVANT DE CHARGER ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                initLeaderboard();
            } else {
                document.getElementById('loading-msg').innerHTML = `
                    <div class="flex flex-col items-center gap-4">
                        <i class="fa-solid fa-lock text-4xl text-red-500"></i>
                        <span class="text-red-500 font-bold font-display">ACCÈS RESTREINT</span>
                        <a href="index.html" class="px-6 py-2 border border-white/20 hover:bg-white/10 rounded uppercase text-xs font-bold tracking-widest transition-all">Se connecter</a>
                    </div>
                `;
            }
        });

        function initLeaderboard() {
            const usersRef = ref(db, 'users');
            const q = query(usersRef, orderByChild('elo'), limitToLast(50));
            
            onValue(q, (snapshot) => {
                const users = [];
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    if(data.username || data.name) {
                        const safeElo = (data.elo === undefined || data.elo === null) ? 500 : data.elo;
                        users.push({
                            name: data.username || data.name || "Inconnu",
                            avatar: data.avatar || `https://ui-avatars.com/api/?name=${data.username || "U"}`,
                            elo: safeElo,
                            uid: childSnapshot.key
                        });
                    }
                });

                users.sort((a, b) => b.elo - a.elo); // Décroissant

                if (users.length === 0) {
                    document.getElementById('loading-msg').innerText = "Aucun joueur trouvé.";
                    return;
                }

                renderPodium(users.slice(0, 3));
                renderList(users.slice(3));
            }, (error) => {
                console.error("Erreur Firebase:", error);
                document.getElementById('loading-msg').innerText = "Erreur de chargement des données.";
            });
        }

        function renderPodium(top3) {
            const container = document.getElementById('podium-container');
            container.innerHTML = '';

            const visualOrder = [1, 0, 2]; // 2nd, 1st, 3rd
            
            visualOrder.forEach(idx => {
                const player = top3[idx];
                if (!player) return;

                const rank = idx + 1;
                const rankInfo = eloEngine.getRankInfo(player.elo);
                
                let cardClass = "";
                let badge = "";
                let height = "";
                let orderClass = "";
                let glowColor = "";
                
                if(rank === 1) { 
                    cardClass = "rank-1"; 
                    height = "h-[450px]";
                    orderClass = "order-1 md:order-2 w-full md:w-1/3";
                    glowColor = "text-gold-400";
                    badge = '<i class="fa-solid fa-crown text-gold-400 text-6xl mb-6 crown-anim drop-shadow-[0_0_20px_gold]"></i>';
                }
                else if(rank === 2) { 
                    cardClass = "rank-2"; 
                    height = "h-[360px]";
                    orderClass = "order-2 md:order-1 w-full md:w-1/4";
                    glowColor = "text-gray-300";
                }
                else { 
                    cardClass = "rank-3"; 
                    height = "h-[320px]";
                    orderClass = "order-3 md:order-3 w-full md:w-1/4";
                    glowColor = "text-orange-400";
                }

                const html = `
                    <div class="podium-card ${cardClass} ${height} ${orderClass} glass-panel rounded-t-2xl p-6 flex flex-col items-center justify-end relative group cursor-default" data-aos="fade-up" data-aos-delay="${rank*100}">
                        <div class="absolute -top-14 flex flex-col items-center w-full">
                            ${badge}
                            <div class="relative group-hover:scale-110 transition-transform duration-300">
                                <div class="absolute inset-0 bg-white rounded-full blur opacity-20 group-hover:opacity-40 transition-opacity"></div>
                                <img src="${player.avatar}" class="avatar-ring w-28 h-28 rounded-full border-4 shadow-2xl object-cover z-10 relative bg-black">
                                <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 bg-black text-white text-sm font-black font-mono px-3 py-1 rounded border border-gray-700 z-20 shadow-lg tracking-widest">#${rank}</div>
                            </div>
                        </div>
                        
                        <div class="text-center mt-12 w-full flex-grow flex flex-col justify-end pb-4">
                            <div class="font-display font-black text-white text-2xl truncate mb-4 drop-shadow-md tracking-wide">${player.name}</div>
                            
                            <!-- PODIUM RANK BADGE (LARGE) -->
                            <div class="flex flex-col items-center justify-center gap-2 mb-4">
                                <img src="${rankInfo.img}" class="w-16 h-16 object-contain drop-shadow-[0_0_15px_${rankInfo.color}] animate-float">
                                <span class="text-lg font-teko font-bold tracking-widest uppercase" style="color:${rankInfo.color}; text-shadow: 0 0 10px ${rankInfo.color}">${rankInfo.name}</span>
                            </div>

                            <div class="py-3 bg-black/40 rounded-xl border border-white/5 backdrop-blur-sm">
                                <div class="font-mono text-4xl font-black ${glowColor} tracking-tighter leading-none">${player.elo}</div>
                                <div class="text-[10px] text-gray-500 font-mono uppercase tracking-[0.3em] mt-1">League Points</div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function renderList(others) {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';

            others.forEach((player, index) => {
                const realRank = index + 4;
                const rankInfo = eloEngine.getRankInfo(player.elo);
                const delay = index * 50; 

                const html = `
                    <div class="rank-row grid grid-cols-12 gap-4 p-4 items-center group cursor-default" style="animation-delay: ${delay}ms">
                        <div class="col-span-2 md:col-span-1 text-center font-mono font-bold text-gray-600 text-lg group-hover:text-white transition-colors">
                            <span class="opacity-50">#</span>${realRank}
                        </div>
                        
                        <div class="col-span-6 md:col-span-5 flex items-center gap-4">
                            <img src="${player.avatar}" class="w-10 h-10 rounded border border-gray-800 object-cover bg-black group-hover:border-white transition-colors">
                            <div class="flex flex-col min-w-0">
                                <span class="font-bold text-gray-300 text-sm truncate group-hover:text-white font-display tracking-wide">${player.name}</span>
                            </div>
                        </div>

                        <!-- LIST RANK BADGE (ENHANCED) -->
                        <div class="col-span-4 md:col-span-3 text-right md:text-right flex items-center justify-end gap-3">
                            <div class="flex flex-col items-end">
                                <span class="font-teko font-bold text-xl leading-none tracking-wide" style="color:${rankInfo.color}">${rankInfo.name}</span>
                            </div>
                            <img src="${rankInfo.img}" class="w-10 h-10 object-contain drop-shadow-[0_0_8px_${rankInfo.color}]" title="${rankInfo.name}">
                        </div>
                        
                        <div class="hidden md:block col-span-2 md:col-span-3 text-right">
                            <span class="font-mono font-bold text-xl text-white group-hover:text-empire-500 transition-colors">${player.elo}</span>
                            <span class="text-[10px] text-gray-600 ml-1">LP</span>
                        </div>
                    </div>
                `;
                list.innerHTML += html;
            });
        }
    </script>
</body>
</html>
