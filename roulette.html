<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        empire: { 500: '#ff3333', 600: '#e60000', 700: '#cc0000', 800: '#990000', 900: '#4d0000', black: '#030303' },
                        cyber: { dark: '#050505', panel: '#0a0a0a', border: '#ff2e2e' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Rajdhani', 'sans-serif'],
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
                        'pop-in': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(255, 51, 51, 0.2)' },
                            '50%': { boxShadow: '0 0 60px rgba(255, 51, 51, 0.5)' },
                        },
                        popIn: {
                            '0%': { opacity: 0, transform: 'scale(0.8) translateY(20px)' },
                            '100%': { opacity: 1, transform: 'scale(1) translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #030303 0%, #0a0505 50%, #030303 100%);
            color: #e5e5e5;
            overflow-x: hidden;
        }

        .bg-grid {
            background-image:
                linear-gradient(rgba(255, 51, 51, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 51, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .glass-panel {
            background: rgba(8, 8, 8, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 51, 51, 0.15);
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        textarea {
            background: linear-gradient(180deg, #080808 0%, #0a0a0a 100%) !important;
            border: 1px solid rgba(255, 51, 51, 0.2) !important;
            color: #ffcccc !important;
            font-family: 'Rajdhani', monospace !important;
            letter-spacing: 1px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #ff3333 !important;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.15) !important;
            outline: none;
        }

        /* WHEEL CONTAINER - OPTIMIZED */
        .wheel-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            will-change: transform;
        }

        /* STATIC DECORATIVE RINGS - NO ANIMATION */
        .ring-deco {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .ring-outer {
            width: 108%;
            height: 108%;
            border: 2px solid rgba(255, 51, 51, 0.1);
            box-shadow: 0 0 40px rgba(255, 51, 51, 0.05);
        }

        .ring-inner {
            width: 104%;
            height: 104%;
            border: 1px dashed rgba(255, 255, 255, 0.08);
        }

        /* POINTER - ENHANCED */
        .wheel-pointer {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.9));
        }

        .pointer-shape {
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 55px solid;
            border-image: linear-gradient(180deg, #ff3333 0%, #990000 100%) 1;
            position: relative;
        }

        .pointer-shape::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -8px;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #fff 0%, #ff3333 100%);
            border-radius: 50%;
            box-shadow: 0 0 20px #ff3333, 0 0 40px rgba(255, 51, 51, 0.5);
        }

        /* SPIN BUTTON - PREMIUM */
        .btn-spin {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #cc0000 0%, #990000 50%, #660000 100%);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(10% 0, 100% 0, 100% 75%, 90% 100%, 0 100%, 0 25%);
        }

        .btn-spin:hover {
            transform: scale(1.03);
            box-shadow: 0 0 60px rgba(255, 51, 51, 0.5), 0 20px 40px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.35em;
        }

        .btn-spin:active {
            transform: scale(0.98);
        }

        .btn-spin::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.6s;
        }

        .btn-spin:hover::before {
            left: 100%;
        }

        .btn-spin.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        /* WINNER MODAL - ENHANCED */
        #winner-modal {
            backdrop-filter: blur(15px);
        }

        .winner-card {
            background: linear-gradient(180deg, rgba(15, 15, 15, 0.98) 0%, rgba(5, 5, 5, 0.98) 100%);
            border: 2px solid transparent;
            border-image: linear-gradient(135deg, #ff3333, #990000) 1;
            box-shadow:
                0 0 100px rgba(255, 51, 51, 0.25),
                inset 0 0 100px rgba(0, 0, 0, 0.5);
        }

        /* CENTER HUB */
        .center-hub {
            background: radial-gradient(circle, #0f0f0f 0%, #050505 100%);
            box-shadow:
                0 0 60px rgba(0, 0, 0, 0.9),
                inset 0 2px 0 rgba(255, 255, 255, 0.05),
                0 0 30px rgba(255, 51, 51, 0.1);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #030303;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #cc0000, #660000);
            border-radius: 3px;
        }

        /* GLOW EFFECT */
        .glow-red {
            box-shadow: 0 0 60px rgba(255, 51, 51, 0.15);
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        window.login = () => signInWithPopup(auth, provider);

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const saveSection = document.getElementById('save-section');
            const loginMsg = document.getElementById('login-msg');

            if (user) {
                saveSection.classList.remove('hidden');
                loginMsg.classList.add('hidden');
                loadSavedWheels();
            } else {
                saveSection.classList.add('hidden');
                loginMsg.classList.remove('hidden');
            }
        });

        window.saveCurrentList = () => {
            const name = document.getElementById('save-name').value.trim();
            const content = document.getElementById('wheel-input').value.trim();

            if (!name) return alert("Entrez un nom pour la liste.");
            if (!content) return alert("La liste est vide.");

            const wheelRef = ref(db, `users/${currentUser.uid}/saved_wheels/${name}`);
            set(wheelRef, { name, content, date: Date.now() });
            document.getElementById('save-name').value = "";
        };

        function loadSavedWheels() {
            const wheelsRef = ref(db, `users/${currentUser.uid}/saved_wheels`);
            onValue(wheelsRef, (snapshot) => {
                const container = document.getElementById('saved-lists-container');
                container.innerHTML = "";

                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = '<p class="text-gray-600 text-xs italic text-center py-4">Aucune liste sauvegardée</p>';
                    return;
                }

                Object.values(data).forEach(list => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-white/5 p-2.5 rounded-lg hover:bg-white/10 transition-colors group cursor-pointer";
                    div.innerHTML = `
                        <div class="flex-grow overflow-hidden">
                            <div class="text-white font-bold text-xs truncate">${list.name}</div>
                            <div class="text-[10px] text-gray-500 truncate">${list.content.split('\n').length} éléments</div>
                        </div>
                        <button class="delete-btn text-gray-600 hover:text-red-500 px-2 transition-colors">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    `;
                    div.addEventListener('click', (e) => {
                        if (!e.target.closest('.delete-btn')) {
                            document.getElementById('wheel-input').value = list.content;
                            drawWheel();
                        }
                    });
                    div.querySelector('.delete-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (confirm('Supprimer cette liste ?')) {
                            remove(ref(db, `users/${currentUser.uid}/saved_wheels/${list.name}`));
                        }
                    });
                    container.appendChild(div);
                });
            });
        }

        // --- OPTIMIZED WHEEL LOGIC ---
        const wheelCanvas = document.getElementById('wheelCanvas');
        const ctx = wheelCanvas.getContext('2d');
        const inputArea = document.getElementById('wheel-input');
        const spinBtn = document.getElementById('spin-btn');
        const winnerModal = document.getElementById('winner-modal');
        const winnerTextModal = document.getElementById('winner-text-modal');

        let segments = [];
        let currentRotation = 0;
        let isSpinning = false;
        let lastWinner = "";
        let animationId = null;

        // Pre-cached gradient colors
        const redGradient = { start: '#450a0a', mid: '#b91c1c', end: '#7f1d1d' };
        const blackGradient = { start: '#080808', mid: '#1a1a1a', end: '#0f0f0f' };

        inputArea.value = "ROUGE\nNOIR\nREJOUER\nJACKPOT\nPERDU\nDOUBLE\nRIEN\nMYSTÈRE";

        function getSegments() {
            return inputArea.value.split('\n').filter(line => line.trim() !== '');
        }

        window.drawWheel = function () {
            segments = getSegments();
            const numSegments = segments.length;
            if (numSegments === 0) {
                ctx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);
                return;
            }

            const centerX = wheelCanvas.width / 2;
            const centerY = wheelCanvas.height / 2;
            const radius = wheelCanvas.width / 2 - 30;
            const arcSize = (2 * Math.PI) / numSegments;

            ctx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);

            // Draw segments
            for (let i = 0; i < numSegments; i++) {
                const angle = i * arcSize + currentRotation;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.closePath();

                // Simpler gradients for performance
                const gradient = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, radius);
                if (i % 2 === 0) {
                    gradient.addColorStop(0, redGradient.start);
                    gradient.addColorStop(0.6, redGradient.mid);
                    gradient.addColorStop(1, redGradient.end);
                } else {
                    gradient.addColorStop(0, blackGradient.start);
                    gradient.addColorStop(0.6, blackGradient.mid);
                    gradient.addColorStop(1, blackGradient.end);
                }

                ctx.fillStyle = gradient;
                ctx.fill();

                // Segment border
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(0,0,0,0.6)';
                ctx.stroke();

                // Text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                const fontSize = numSegments > 20 ? 22 : (numSegments > 12 ? 30 : 42);
                ctx.font = `800 ${fontSize}px Rajdhani`;
                ctx.shadowColor = "rgba(0,0,0,0.8)";
                ctx.shadowBlur = 8;

                let text = segments[i].toUpperCase();
                if (text.length > 14) text = text.substring(0, 11) + "...";

                ctx.fillText(text, radius - 60, fontSize / 3);
                ctx.restore();
            }

            // Outer ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 8, 0, 2 * Math.PI);
            ctx.lineWidth = 18;
            ctx.strokeStyle = '#0a0a0a';
            ctx.stroke();

            // Red glow ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 16, 0, 2 * Math.PI);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ff3333';
            ctx.shadowColor = '#ff3333';
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        inputArea.addEventListener('input', () => { if (!isSpinning) drawWheel(); });

        window.resetWheel = function () {
            if (isSpinning) return;
            inputArea.value = "";
            drawWheel();
        }

        window.shuffleInputs = function () {
            if (isSpinning) return;
            let arr = getSegments();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            inputArea.value = arr.join('\n');
            drawWheel();
        }

        window.closeWinnerModal = function () {
            winnerModal.classList.add('hidden');
        }

        window.removeWinner = function () {
            const currentText = inputArea.value;
            const escapedWinner = lastWinner.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`^${escapedWinner}$`, 'm');
            let newText = currentText.replace(regex, '').replace(/^\s*[\r\n]/gm, '');
            inputArea.value = newText.trim();
            closeWinnerModal();
            drawWheel();
        }

        window.spinWheel = function () {
            if (isSpinning) return;
            const segs = getSegments();
            if (segs.length < 2) return alert("Ajoutez au moins 2 options !");

            isSpinning = true;
            spinBtn.classList.add('disabled');

            // Optimized physics
            let velocity = Math.random() * 0.4 + 0.5;
            const friction = 0.985;
            const stopThreshold = 0.003;

            function animate() {
                velocity *= friction;
                currentRotation += velocity;
                drawWheel();

                if (velocity > stopThreshold) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    finalizeSpin();
                }
            }
            animate();
        }

        function finalizeSpin() {
            isSpinning = false;
            spinBtn.classList.remove('disabled');

            const numSegments = segments.length;
            const arcSize = (2 * Math.PI) / numSegments;
            const normalizedRotation = currentRotation % (2 * Math.PI);
            let index = Math.floor(((3 * Math.PI / 2) - normalizedRotation) / arcSize) % numSegments;

            if (index < 0) index += numSegments;

            lastWinner = segments[index];

            winnerTextModal.innerText = lastWinner.toUpperCase();
            winnerModal.classList.remove('hidden');

            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#ff3333', '#ffffff', '#990000', '#ffcc00'],
                zIndex: 200
            });
        }

        // Init
        drawWheel();

        // Debounced resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(drawWheel, 100);
        });

    </script>
</body>

</html>
