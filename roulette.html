<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        empire: { 500: '#ff3333', 600: '#e60000', 700: '#cc0000', 800: '#990000', 900: '#4d0000', black: '#030303' },
                        cyber: { dark: '#050505', panel: '#0a0a0a', border: '#ff2e2e' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Rajdhani', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 20s linear infinite',
                        'spin-reverse': 'spin 25s linear infinite reverse',
                        'pulse-glow': 'pulseGlow 2s infinite',
                        'pop-in': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(255, 51, 51, 0.1)' },
                            '50%': { boxShadow: '0 0 40px rgba(255, 51, 51, 0.4)' },
                        },
                        popIn: {
                            '0%': { opacity: 0, transform: 'scale(0.5) translateY(20px)' },
                            '100%': { opacity: 1, transform: 'scale(1) translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #030303; color: #e5e5e5; overflow-x: hidden; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.6; }
        
        .glass-panel { 
            background: rgba(5, 5, 5, 0.95); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 51, 51, 0.2); 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 50px rgba(0,0,0,0.5); 
        }

        /* TEXTAREA STYLE TERMINAL */
        textarea {
            background: #080808 !important;
            border: 1px solid #333 !important;
            color: #ffcccc !important;
            font-family: 'Rajdhani', monospace !important;
            letter-spacing: 1px;
            font-weight: bold;
        }
        textarea:focus { 
            border-color: #ff3333 !important; 
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.1) !important; 
            outline: none;
        }

        /* ROUE - CONTAINER */
        .wheel-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ANNEAUX DÉCORATIFS FUTURISTES */
        .ring-outer, .ring-inner {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        
        .ring-outer { 
            width: 112%; height: 112%; 
            border: 1px solid rgba(255, 51, 51, 0.1);
            border-top: 1px solid rgba(255, 51, 51, 0.6);
            border-bottom: 1px solid rgba(255, 51, 51, 0.6);
            animation: spin-slow;
            box-shadow: 0 0 30px rgba(255,51,51,0.05);
        }
        
        .ring-inner { 
            width: 105%; height: 105%; 
            border: 2px dashed rgba(255, 255, 255, 0.1);
            animation: spin-reverse; 
        }

        /* POINTEUR */
        .wheel-pointer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
        }
        .pointer-shape {
            width: 0; height: 0; 
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 50px solid #ff3333;
        }
        .pointer-shape::after {
            content: '';
            position: absolute;
            top: -45px; left: -5px;
            width: 10px; height: 10px;
            background: white; border-radius: 50%;
            box-shadow: 0 0 10px white;
        }

        /* BOUTON SPIN */
        .btn-glitch {
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            clip-path: polygon(15% 0, 100% 0, 100% 70%, 85% 100%, 0 100%, 0 30%);
        }
        .btn-glitch:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(255, 51, 51, 0.4);
            letter-spacing: 0.3em;
        }
        .btn-glitch::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn-glitch:hover::before { left: 100%; }

        /* WINNER MODAL */
        #winner-modal {
            backdrop-filter: blur(10px);
        }
        .winner-card {
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #ff3333;
            box-shadow: 0 0 100px rgba(255, 51, 51, 0.3);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030303; }
        ::-webkit-scrollbar-thumb { background: #cc0000; border-radius: 3px; }
    </style>
</head>

    <!-- LOGIQUE JAVASCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // CONFIGURATION FIREBASE (Même que auth.js)
        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // --- AUTH GESTION ---
        window.login = () => signInWithPopup(auth, provider);
        
        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const saveSection = document.getElementById('save-section');
            const loginMsg = document.getElementById('login-msg');

            if (user) {
                saveSection.classList.remove('hidden');
                loginMsg.classList.add('hidden');
                loadSavedWheels();
            } else {
                saveSection.classList.add('hidden');
                loginMsg.classList.remove('hidden');
            }
        });

        // --- LOGIQUE SAUVEGARDE ---
        window.saveCurrentList = () => {
            const name = document.getElementById('save-name').value.trim();
            const content = document.getElementById('wheel-input').value.trim();
            
            if (!name) return alert("Entrez un nom pour la liste.");
            if (!content) return alert("La liste est vide.");

            const wheelRef = ref(db, `users/${currentUser.uid}/saved_wheels/${name}`);
            set(wheelRef, {
                name: name,
                content: content,
                date: Date.now()
            });
            document.getElementById('save-name').value = "";
        };

        function loadSavedWheels() {
            const wheelsRef = ref(db, `users/${currentUser.uid}/saved_wheels`);
            onValue(wheelsRef, (snapshot) => {
                const container = document.getElementById('saved-lists-container');
                container.innerHTML = "";
                
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = '<p class="text-gray-600 text-xs italic text-center py-4">Aucune liste sauvegardée</p>';
                    return;
                }

                Object.values(data).forEach(list => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-white/5 p-2 rounded hover:bg-white/10 transition-colors group";
                    div.innerHTML = `
                        <div class="flex-grow cursor-pointer overflow-hidden" onclick="loadList('${list.name.replace(/'/g, "\\'")}')">
                            <div class="text-white font-bold text-xs truncate">${list.name}</div>
                            <div class="text-[10px] text-gray-500 truncate">${list.content.split('\n').length} éléments</div>
                        </div>
                        <button onclick="deleteList('${list.name.replace(/'/g, "\\'")}')" class="text-gray-600 hover:text-red-500 px-2 transition-colors">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    `;
                    // On attache les events manuellement pour éviter les soucis d'échappement
                    div.querySelector('div').onclick = () => {
                        document.getElementById('wheel-input').value = list.content;
                        drawWheel();
                    };
                    div.querySelector('button').onclick = () => {
                        if(confirm('Supprimer cette liste ?')) {
                            remove(ref(db, `users/${currentUser.uid}/saved_wheels/${list.name}`));
                        }
                    };
                    container.appendChild(div);
                });
            });
        }

        // --- PARTICLES (Fond) ---
        const canvas = document.getElementById('canvas-container');
        const ctxBg = canvas.getContext('2d');
        let particlesArray;
        
        function resizeBg() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', () => { resizeBg(); initParticles(); });
        resizeBg();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.color = Math.random() > 0.8 ? '#ff3333' : '#333';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.01;
                if (this.size <= 0.2) { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.size = Math.random()*2 + 1; }
            }
            draw() { ctxBg.fillStyle = this.color; ctxBg.beginPath(); ctxBg.arc(this.x, this.y, this.size, 0, Math.PI*2); ctxBg.fill(); }
        }
        function initParticles() { particlesArray = []; for(let i=0; i<60; i++) particlesArray.push(new Particle()); }
        function animateParticles() { requestAnimationFrame(animateParticles); ctxBg.clearRect(0,0,canvas.width, canvas.height); particlesArray.forEach(p => { p.update(); p.draw(); }); }
        initParticles(); animateParticles();

        // --- ROUE LOGIC ---
        const wheelCanvas = document.getElementById('wheelCanvas');
        const ctx = wheelCanvas.getContext('2d');
        const inputArea = document.getElementById('wheel-input');
        const spinBtn = document.getElementById('spin-btn');
        const winnerModal = document.getElementById('winner-modal');
        const winnerTextModal = document.getElementById('winner-text-modal');

        let segments = [];
        let currentRotation = 0;
        let isSpinning = false;
        let lastWinner = "";

        // Couleurs
        const colors = ['#b91c1c', '#171717', '#7f1d1d', '#262626']; 

        inputArea.value = "ROUGE\nNOIR\nREJOUER\nJACKPOT\nPERDU\nDOUBLE\nRIEN\nMYSTÈRE";
        
        function getSegments() {
            return inputArea.value.split('\n').filter(line => line.trim() !== '');
        }

        // Export pour usage HTML
        window.drawWheel = function() {
            segments = getSegments();
            const numSegments = segments.length;
            if (numSegments === 0) return;

            const centerX = wheelCanvas.width / 2;
            const centerY = wheelCanvas.height / 2;
            const radius = wheelCanvas.width / 2 - 40; 
            const arcSize = (2 * Math.PI) / numSegments;

            ctx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);

            for (let i = 0; i < numSegments; i++) {
                const angle = i * arcSize + currentRotation;
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                
                const gradient = ctx.createRadialGradient(centerX, centerY, 100, centerX, centerY, radius);
                if (i % 2 === 0) { 
                    gradient.addColorStop(0, '#450a0a');
                    gradient.addColorStop(0.5, '#b91c1c');
                    gradient.addColorStop(1, '#7f1d1d');
                } else { 
                    gradient.addColorStop(0, '#000000');
                    gradient.addColorStop(0.5, '#262626');
                    gradient.addColorStop(1, '#171717');
                }
                
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                const fontSize = numSegments > 20 ? 25 : (numSegments > 12 ? 35 : 50);
                ctx.font = `900 ${fontSize}px Rajdhani`; 
                ctx.shadowColor = "rgba(0,0,0,1)";
                ctx.shadowBlur = 10;
                
                let text = segments[i].toUpperCase();
                if(text.length > 15) text = text.substring(0, 12) + "...";
                
                ctx.fillText(text, radius - 80, 18);
                ctx.restore();
            }

            // Bordure
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 10, 0, 2 * Math.PI);
            ctx.lineWidth = 25;
            ctx.strokeStyle = '#0f0f0f';
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 20, 0, 2 * Math.PI);
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ff3333';
            ctx.shadowColor = '#ff3333';
            ctx.shadowBlur = 20;
            ctx.stroke();
            ctx.shadowBlur = 0; 
        }

        inputArea.addEventListener('input', () => { if(!isSpinning) drawWheel(); });

        window.resetWheel = function() {
            if(isSpinning) return;
            inputArea.value = "";
            drawWheel();
        }

        window.shuffleInputs = function() {
            if(isSpinning) return;
            let arr = getSegments();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            inputArea.value = arr.join('\n');
            drawWheel();
        }

        window.closeWinnerModal = function() {
            winnerModal.classList.add('hidden');
        }

        window.removeWinner = function() {
            const currentText = inputArea.value;
            // Échapper les caractères spéciaux regex
            const escapedWinner = lastWinner.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); 
            // Remplacer la première occurrence exacte
            const regex = new RegExp(`^${escapedWinner}$`, 'm'); 
            
            // On essaie de retirer la ligne
            let newText = currentText.replace(regex, '').replace(/^\s*[\r\n]/gm, ''); // Retire aussi les lignes vides
            
            inputArea.value = newText.trim();
            closeWinnerModal();
            drawWheel();
        }

        window.spinWheel = function() {
            if (isSpinning) return;
            const segs = getSegments();
            if (segs.length < 2) return alert("Ajoutez au moins 2 options !");

            isSpinning = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed', 'grayscale');

            // Physique rapide
            let velocity = Math.random() * 0.5 + 0.6; 
            let friction = 0.98; // Friction augmentée pour arrêt plus rapide
            let stopThreshold = 0.005; // Seuil d'arrêt plus haut

            function animate() {
                velocity *= friction;
                currentRotation += velocity;
                drawWheel();

                if (velocity > stopThreshold) {
                    requestAnimationFrame(animate);
                } else {
                    finalizeSpin();
                }
            }
            animate();
        }

        function finalizeSpin() {
            isSpinning = false;
            spinBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'grayscale');
            
            const numSegments = segments.length;
            const arcSize = (2 * Math.PI) / numSegments;
            const normalizedRotation = currentRotation % (2 * Math.PI);
            let index = Math.floor(((3 * Math.PI / 2) - normalizedRotation) / arcSize) % numSegments;
            
            if (index < 0) index += numSegments;

            lastWinner = segments[index];
            
            // Affichage Modal
            winnerTextModal.innerText = lastWinner.toUpperCase();
            winnerModal.classList.remove('hidden');
            
            // FX
            const colors = ['#ff0000', '#ffffff', '#000000', '#b91c1c'];
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, colors: colors, zIndex: 200 });
        }

        // Init
        drawWheel();
        window.addEventListener('resize', drawWheel);

    </script>
</body>
</html>
