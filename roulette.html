    <script>

                extend: {

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #030303;
            color: #e5e5e5;
            overflow-x: hidden;
        }

        /* ANIMATED BACKGROUND */
        .bg-animated {
            background:
                radial-gradient(ellipse at 20% 20%, rgba(255, 51, 51, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 51, 51, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(20, 0, 0, 1) 0%, #030303 100%);
        }

        .glass-panel {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 51, 51, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }

        textarea {
            background: linear-gradient(180deg, #0a0a0a 0%, #080808 100%) !important;
            border: 1px solid rgba(255, 51, 51, 0.15) !important;
            color: #ff9999 !important;
            font-family: 'Rajdhani', monospace !important;
            letter-spacing: 1px;
            font-weight: 600;
        }

        textarea:focus {
            border-color: #ff3333 !important;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.1) !important;
            outline: none;
        }

        textarea::placeholder {
            color: #444 !important;
        }

        /* WHEEL CONTAINER */
        .wheel-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* NEON RINGS */
        .neon-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .neon-ring-1 {
            width: 115%;
            height: 115%;
            border: 1px solid rgba(255, 51, 51, 0.2);
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.1), inset 0 0 30px rgba(255, 51, 51, 0.05);
        }

        .neon-ring-2 {
            width: 108%;
            height: 108%;
            border: 2px solid rgba(255, 51, 51, 0.15);
        }

        .neon-ring-3 {
            width: 102%;
            height: 102%;
            border: 1px dashed rgba(255, 255, 255, 0.05);
        }

        /* CANVAS GLOW */
        .wheel-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 51, 51, 0.15) 0%, transparent 70%);
            filter: blur(40px);
            pointer-events: none;
        }

        /* POINTER */
        .wheel-pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
        }

        .pointer-diamond {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff3333 0%, #cc0000 50%, #990000 100%);
            transform: rotate(45deg);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 51, 51, 0.4);
            position: relative;
        }

        .pointer-diamond::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 15px white;
        }

        /* SPIN BUTTON */
        .btn-spin {
            position: relative;
            background: linear-gradient(135deg, #ff3333 0%, #cc0000 50%, #990000 100%);
            border: none;
            overflow: hidden;
            transition: all 0.3s ease;
            clip-path: polygon(8% 0, 100% 0, 100% 80%, 92% 100%, 0 100%, 0 20%);
        }

        .btn-spin::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.5s;
        }

        .btn-spin:hover::before {
            left: 100%;
        }

        .btn-spin:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 51, 51, 0.5), 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .btn-spin:active {
            transform: scale(0.98);
        }

        .btn-spin.spinning {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        /* CENTER HUB */
        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #0a0a0a 50%, #050505 100%);
            border: 3px solid #ff3333;
            border-radius: 50%;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.9),
                inset 0 0 30px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(255, 51, 51, 0.2);
        }

        .center-hub::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 15%;
            width: 40%;
            height: 20%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, transparent 100%);
            border-radius: 50%;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: linear-gradient(180deg, #151515 0%, #0a0a0a 100%);
            border: 2px solid #ff3333;
            border-radius: 20px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 0 100px rgba(255, 51, 51, 0.3), 0 50px 100px rgba(0, 0, 0, 0.8);
            animation: modalPop 0.4s ease-out;
        }

        @keyframes modalPop {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff3333, transparent);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #030303;
        }

        ::-webkit-scrollbar-thumb {
            background: #cc0000;
            border-radius: 3px;
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        window.login = () => signInWithPopup(auth, provider);
        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            document.getElementById('save-section').classList.toggle('hidden', !user);
            document.getElementById('login-msg').classList.toggle('hidden', !!user);
            if (user) loadSavedWheels();
        });

        window.saveCurrentList = () => {
            const name = document.getElementById('save-name').value.trim();
            const content = document.getElementById('wheel-input').value.trim();
            if (!name || !content) return alert("Remplissez tous les champs.");
            set(ref(db, `users/${currentUser.uid}/saved_wheels/${name}`), { name, content, date: Date.now() });
            document.getElementById('save-name').value = "";
        };

        function loadSavedWheels() {
            onValue(ref(db, `users/${currentUser.uid}/saved_wheels`), (snapshot) => {
                const container = document.getElementById('saved-lists-container');
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = '<p class="text-gray-600 text-xs italic text-center py-3">Aucune liste</p>';
                    return;
                }
                container.innerHTML = '';
                Object.values(data).forEach(list => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-white/5 p-2 rounded hover:bg-white/10 transition cursor-pointer";
                    div.innerHTML = `<div class="text-white text-xs truncate flex-grow">${list.name}</div>
                        <button class="text-gray-500 hover:text-red-500 px-2"><i class="fa-solid fa-trash text-[10px]"></i></button>`;
                    div.addEventListener('click', (e) => {
                        if (e.target.closest('button')) {
                            if (confirm('Supprimer ?')) remove(ref(db, `users/${currentUser.uid}/saved_wheels/${list.name}`));
                        } else {
                            document.getElementById('wheel-input').value = list.content;
                            drawWheel();
                        }
                    });
                    container.appendChild(div);
                });
            });
        }

        // WHEEL LOGIC
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const inputArea = document.getElementById('wheel-input');
        const spinBtn = document.getElementById('spin-btn');
        const modal = document.getElementById('winner-modal');
        const winnerText = document.getElementById('winner-text');

        let segments = [];
        let rotation = 0;
        let spinning = false;
        let lastWinner = "";

        inputArea.value = "ROUGE\nNOIR\nREJOUER\nJACKPOT\nPERDU\nDOUBLE\nRIEN\nMYSTÈRE";

        function getSegments() {
            return inputArea.value.split('\n').filter(l => l.trim());
        }

        window.drawWheel = function () {
            segments = getSegments();
            const n = segments.length;
            if (!n) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = canvas.width / 2 - 25;
            const arc = (2 * Math.PI) / n;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < n; i++) {
                const a = i * arc + rotation;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, a, a + arc);
                ctx.closePath();

                // Gradient
                const grad = ctx.createRadialGradient(cx, cy, 30, cx, cy, r);
                if (i % 2 === 0) {
                    grad.addColorStop(0, '#3d0a0a');
                    grad.addColorStop(0.5, '#b91c1c');
                    grad.addColorStop(1, '#7f1d1d');
                } else {
                    grad.addColorStop(0, '#0a0a0a');
                    grad.addColorStop(0.5, '#1f1f1f');
                    grad.addColorStop(1, '#141414');
                }
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.stroke();

                // Text
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(a + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                const fs = n > 16 ? 22 : n > 10 ? 32 : 40;
                ctx.font = `800 ${fs}px Rajdhani`;
                ctx.shadowColor = "#000";
                ctx.shadowBlur = 6;
                let txt = segments[i].toUpperCase();
                if (txt.length > 12) txt = txt.slice(0, 10) + "..";
                ctx.fillText(txt, r - 50, fs / 3);
                ctx.restore();
            }

            // Border
            ctx.beginPath();
            ctx.arc(cx, cy, r + 10, 0, 2 * Math.PI);
            ctx.lineWidth = 20;
            ctx.strokeStyle = '#0a0a0a';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, r + 18, 0, 2 * Math.PI);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ff3333';
            ctx.shadowColor = '#ff3333';
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.shadowBlur = 0;
        };

        inputArea.addEventListener('input', () => { if (!spinning) drawWheel(); });

        window.resetWheel = function () {
            if (spinning) return;
            inputArea.value = "";
            drawWheel();
        };

        window.shuffleInputs = function () {
            if (spinning) return;
            const arr = getSegments();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            inputArea.value = arr.join('\n');
            drawWheel();
        };

        window.closeModal = function () {
            modal.classList.remove('active');
        };

        window.removeWinner = function () {
            const escaped = lastWinner.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            inputArea.value = inputArea.value.replace(new RegExp(`^${escaped}$`, 'm'), '').replace(/^\s*[\r\n]/gm, '').trim();
            closeModal();
            drawWheel();
        };

        window.spinWheel = function () {
            if (spinning) return;
            const segs = getSegments();
            if (segs.length < 2) return alert("Ajoutez au moins 2 options !");

            spinning = true;
            spinBtn.classList.add('spinning');

            let velocity = 0.5 + Math.random() * 0.3;
            const friction = 0.988;
            const threshold = 0.002;

            function animate() {
                velocity *= friction;
                rotation += velocity;
                drawWheel();

                if (velocity > threshold) {
                    requestAnimationFrame(animate);
                } else {
                    finalize();
                }
            }
            requestAnimationFrame(animate);
        };

        function finalize() {
            spinning = false;
            spinBtn.classList.remove('spinning');

            const n = segments.length;
            const arc = (2 * Math.PI) / n;
            const norm = rotation % (2 * Math.PI);
            let idx = Math.floor(((3 * Math.PI / 2) - norm) / arc) % n;
            if (idx < 0) idx += n;

            lastWinner = segments[idx];
            winnerText.textContent = lastWinner.toUpperCase();

            // Show modal after a tiny delay
            setTimeout(() => {
                modal.classList.add('active');
                try {
                    confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 }, colors: ['#ff3333', '#fff', '#990000'], zIndex: 2000 });
                } catch (e) { }
            }, 100);
        }

        drawWheel();
        window.addEventListener('resize', () => { if (!spinning) drawWheel(); });
    </script>
</body>

</html>
