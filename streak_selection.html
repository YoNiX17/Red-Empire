<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Empire | Streak Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        empire: { 500: '#ff3333', 600: '#e60000', 700: '#cc0000', 800: '#990000', 900: '#4d0000', black: '#030303' },
                        blue: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Rajdhani', 'sans-serif'],
                    },
                    animation: { 'float': 'float 6s ease-in-out infinite' },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #030303; color: #e5e5e5; overflow-x: hidden; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.6; }
        .glass-panel { background: rgba(10, 20, 30, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(59, 130, 246, 0.2); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); }
        
        .cat-card { transition: all 0.4s ease; cursor: pointer; position: relative; overflow: hidden; }
        .cat-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 0 50px rgba(59, 130, 246, 0.3); border-color: #3b82f6; }
        
        /* Modal Styles */
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { transform: scale(0.9) translateY(20px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        .artist-btn { transition: all 0.2s; }
        .artist-btn:hover { background-color: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030303; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }
    </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white flex flex-col min-h-screen">

    <!-- Backgrounds -->
    <canvas id="canvas-container"></canvas>
    <div class="fixed inset-0 bg-[radial-gradient(circle,transparent_20%,black_100%)] pointer-events-none z-[-1]"></div>

    <!-- NAVIGATION -->
    <nav class="fixed w-full z-50 border-b border-blue-900/30 bg-black/80 backdrop-blur-md py-4">
        <div class="max-w-7xl mx-auto px-6 lg:px-8 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3 group">
                <i class="fa-solid fa-crown text-blue-500 text-2xl group-hover:animate-pulse"></i>
                <span class="font-display font-bold text-xl tracking-widest text-white">RED EMPIRE</span>
            </a>
            <div class="flex items-center space-x-8">
                <a href="games.html" class="text-sm font-mono font-bold text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-arrow-left mr-2"></i>RETOUR HUB</a>
                <span class="text-sm font-mono font-bold text-blue-400 border-b border-blue-500 pb-1">STREAK MODE</span>
            </div>
        </div>
    </nav>

    <!-- HEADER -->
    <section class="pt-32 pb-8 text-center relative z-10 px-4">
        <div class="inline-block mb-2 px-3 py-1 border border-blue-500/30 rounded-full bg-blue-900/20">
            <span class="text-xs font-mono font-bold tracking-[0.2em] text-blue-300 uppercase">SURVIVAL MODE</span>
        </div>
        <h1 class="font-display text-5xl md:text-7xl font-black text-white mb-4 drop-shadow-[0_0_25px_rgba(59,130,246,0.6)]">
            STREAK <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">MUSICAL</span>
        </h1>
        <p class="text-gray-400 font-mono text-lg max-w-2xl mx-auto">Combien de titres pouvez-vous enchaîner sans erreur ?</p>
    </section>

    <!-- SELECTION GRID -->
    <section class="flex-grow max-w-6xl mx-auto px-6 lg:px-8 pb-24 w-full relative z-10 flex flex-col justify-center">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            
            <!-- CATEGORIE 1: RAP FR -->
            <div onclick="openModal('modal-rap')" class="cat-card glass-panel rounded-2xl border border-blue-500/20 group h-96 flex flex-col justify-center items-center relative" data-aos="fade-up">
                <div class="absolute inset-0 bg-gradient-to-b from-blue-900/20 to-black z-0"></div>
                <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')]"></div>
                
                <div class="relative z-10 text-center p-8 group-hover:translate-y-[-10px] transition-transform duration-500">
                    <div class="w-32 h-32 mx-auto bg-blue-600/10 rounded-full flex items-center justify-center border-2 border-blue-500 mb-8 shadow-[0_0_40px_rgba(59,130,246,0.3)] animate-float">
                        <i class="fa-solid fa-microphone text-5xl text-blue-400"></i>
                    </div>
                    <h2 class="font-display text-4xl font-black text-white mb-3 tracking-wide">RAP FRANÇAIS</h2>
                    <p class="text-blue-300 font-mono text-sm uppercase tracking-widest border-t border-blue-500/30 pt-4 mt-4 inline-block px-4">
                        La Crème du Rap
                    </p>
                </div>
            </div>

            <!-- CATEGORIE 2: BIENTÔT -->
            <div class="cat-card glass-panel rounded-2xl border border-white/5 h-96 flex flex-col justify-center items-center relative opacity-50 grayscale cursor-not-allowed" data-aos="fade-up" data-aos-delay="100">
                <div class="absolute top-6 right-6"><i class="fa-solid fa-lock text-3xl text-gray-600"></i></div>
                <div class="w-32 h-32 mx-auto bg-gray-800 rounded-full flex items-center justify-center border-2 border-gray-700 mb-8">
                    <i class="fa-solid fa-earth-americas text-5xl text-gray-500"></i>
                </div>
                <h2 class="font-display text-4xl font-bold text-gray-600 mb-2">RAP US</h2>
                <p class="text-gray-500 font-mono text-sm uppercase tracking-widest mt-2">Bientôt disponible</p>
            </div>

        </div>
    </section>

    <!-- MODAL RAP FR -->
    <div id="modal-rap" class="modal-overlay fixed inset-0 z-[100] bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="modal-content w-full max-w-2xl bg-[#0a0a0a] border border-blue-500/50 rounded-3xl p-1 relative overflow-hidden shadow-[0_0_100px_rgba(59,130,246,0.3)]">
            
            <div class="bg-[#0f172a] rounded-[22px] p-8 relative overflow-hidden">
                <button onclick="closeModals()" class="absolute top-6 right-6 text-gray-500 hover:text-white transition-colors z-20">
                    <i class="fa-solid fa-xmark text-3xl"></i>
                </button>

                <div class="text-center mb-10 relative z-10">
                    <span class="text-blue-500 font-mono text-xs tracking-[0.3em] uppercase font-bold">Sélectionnez votre artiste</span>
                    <h3 class="font-display text-4xl text-white font-black mt-2">RAP <span class="text-outline-blue text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-white">FRANÇAIS</span></h3>
                </div>

                <!-- ARTIST GRID -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 relative z-10">
                    
                    <!-- ARTISTE 1: PLK (LIEN ACTIF) -->
                    <a href="streak_game.html" class="artist-btn group relative h-40 bg-black/40 border border-white/10 rounded-xl overflow-hidden flex flex-col items-center justify-end pb-4 cursor-pointer hover:border-blue-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-90"></div>
                        <div class="absolute inset-0 flex items-center justify-center opacity-30 group-hover:opacity-50 transition-opacity">
                            <span class="font-display text-6xl font-bold text-gray-700">P</span>
                        </div>
                        
                        <div class="relative z-10 text-center">
                            <h4 class="font-display text-2xl font-bold text-white group-hover:text-blue-400 transition-colors">PLK</h4>
                            <span class="text-[10px] font-mono text-gray-400 uppercase tracking-wider group-hover:text-white">Polak</span>
                        </div>
                        <div class="absolute top-2 right-2 w-2 h-2 bg-green-500 rounded-full shadow-[0_0_10px_#22c55e]"></div>
                    </a>

                    <!-- Autres artistes -->
                    <div class="artist-btn group relative h-40 bg-black/40 border border-white/10 rounded-xl overflow-hidden flex flex-col items-center justify-end pb-4 cursor-not-allowed opacity-60">
                        <div class="relative z-10 text-center">
                            <h4 class="font-display text-2xl font-bold text-gray-500">TIAKOLA</h4>
                            <span class="text-[10px] font-mono text-gray-600 uppercase tracking-wider">Bientôt</span>
                        </div>
                    </div>

                    <div class="artist-btn group relative h-40 bg-black/40 border border-white/10 rounded-xl overflow-hidden flex flex-col items-center justify-end pb-4 cursor-not-allowed opacity-60">
                        <div class="relative z-10 text-center">
                            <h4 class="font-display text-2xl font-bold text-gray-500">WERENOI</h4>
                            <span class="text-[10px] font-mono text-gray-600 uppercase tracking-wider">Bientôt</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
        // Particles
        const canvas = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');
        let particlesArray;
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        class Particle {
            constructor(x, y, dx, dy, size, color) { this.x = x; this.y = y; this.dx = dx; this.dy = dy; this.size = size; this.color = color; }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fillStyle = this.color; ctx.fill(); }
            update() { if (this.x > canvas.width || this.x < 0) this.dx = -this.dx; if (this.y > canvas.height || this.y < 0) this.dy = -this.dy; this.x += this.dx; this.y += this.dy; this.draw(); }
        }
        function init() { particlesArray = []; for(let i=0; i<60; i++) { let size = Math.random() * 2; let x = Math.random() * innerWidth; let y = Math.random() * innerHeight; let dx = (Math.random() - 0.5) * 0.3; let dy = (Math.random() - 0.5) * 0.3; particlesArray.push(new Particle(x, y, dx, dy, size, '#3b82f6')); } }
        function animate() { requestAnimationFrame(animate); ctx.clearRect(0,0,innerWidth, innerHeight); particlesArray.forEach(p => p.update()); }
        window.addEventListener('resize', ()=>{ canvas.width=innerWidth; canvas.height=innerHeight; init(); }); init(); animate();

        function openModal(modalId) { document.getElementById(modalId).classList.add('active'); }
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(el => el.classList.remove('active')); }
        window.onclick = function(event) { if (event.target.classList.contains('modal-overlay')) closeModals(); }
    </script>
</body>
</html>
