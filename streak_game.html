<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Empire | Streak PLK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blue: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
                        cyber: { dark: '#020617', panel: '#0f172a' },
                    },
                    fontFamily: {
                        manga: ['Bangers', 'cursive'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Rajdhani', 'sans-serif'],
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 4s linear infinite',
                        'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        glow: {
                            'from': { boxShadow: '0 0 10px #3b82f6, 0 0 20px #3b82f6' },
                            'to': { boxShadow: '0 0 20px #2563eb, 0 0 30px #2563eb' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; color: #eee; overflow: hidden; }
        .bg-animated { position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 50% 50%, #1e3a8a 0%, #020617 70%); }
        .glass-hud { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 16px; }
        
        .disk-spin { animation: spin 4s linear infinite; }
        .disk-paused { animation-play-state: paused !important; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .input-cyber { 
            background: rgba(2, 6, 23, 0.8); border: 1px solid rgba(59, 130, 246, 0.3); 
            color: white; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5); backdrop-filter: blur(5px); 
        }
        .input-cyber:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
        
        .text-glow-blue { text-shadow: 0 0 10px rgba(59, 130, 246, 0.8), 0 0 20px rgba(59, 130, 246, 0.4); }
        
        /* États de visibilité */
        .hidden-force { display: none !important; }
        .state-hidden { opacity: 0; pointer-events: none; transform: scale(0.9); transition: all 0.5s ease; }
        .state-visible { opacity: 1; pointer-events: auto; transform: scale(1); transition: all 0.5s ease; }
    </style>
</head>
<body class="h-screen flex flex-col font-mono relative">

    <div class="bg-animated"></div>
    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20 pointer-events-none mix-blend-overlay"></div>

    <!-- LECTEUR AUDIO UNIQUE -->
    <audio id="game-audio" preload="auto"></audio>

    <!-- HUD -->
    <nav class="absolute top-0 w-full p-6 z-50 flex items-start justify-between pointer-events-none">
        <div class="pointer-events-auto flex items-center gap-4">
            <a href="streak_selection.html" class="glass-hud w-12 h-12 flex items-center justify-center text-blue-300 hover:text-white transition-all cursor-pointer">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="glass-hud px-4 py-2 flex items-center gap-3">
                <i class="fa-solid fa-volume-high text-blue-400 text-xs"></i>
                <input type="range" min="0" max="1" step="0.1" value="0.5" class="w-20 accent-blue-500" oninput="updateVolume(this.value)">
            </div>
        </div>

        <div class="flex flex-col items-center mt-2">
            <div class="relative">
                <div class="text-8xl font-black font-display text-transparent bg-clip-text bg-gradient-to-b from-white to-blue-600 drop-shadow-[0_0_15px_rgba(59,130,246,0.6)]" id="streak-counter">0</div>
                <div class="absolute -top-4 -right-8 text-xs font-mono text-blue-400 border border-blue-500/50 px-2 py-0.5 rounded bg-black/50 backdrop-blur-sm">STREAK</div>
            </div>
        </div>

        <div class="flex flex-col items-end gap-2 pointer-events-auto">
            <div class="glass-hud px-5 py-3 text-right">
                <div class="text-[10px] text-blue-400 font-mono tracking-widest uppercase mb-1">Record</div>
                <div class="font-display font-bold text-2xl text-white flex items-center justify-end gap-2">
                    <i class="fa-solid fa-trophy text-yellow-500 text-sm"></i>
                    <span id="best-streak">0</span>
                </div>
            </div>
            <div class="glass-hud px-4 py-2 flex items-center gap-3 text-red-400 font-display font-bold text-xl" id="timer-display">20s</div>
        </div>
    </nav>

    <!-- ZONE PRINCIPALE -->
    <div class="flex-grow flex flex-col items-center justify-center relative z-10 w-full perspective-[1000px]">
        
        <!-- 1. CONTAINER REVELATION (Pochette) -->
        <div id="reveal-container" class="absolute inset-0 flex flex-col items-center justify-center z-20 state-hidden">
            <!-- Pochette Carrée -->
            <div class="relative mb-8">
                <div class="absolute inset-0 bg-blue-600 blur-[60px] opacity-50 animate-pulse"></div>
                <img id="reveal-cover" src="https://i.postimg.cc/FR5kN5CH/plk_concert_paris_zenith_800x800.jpg" class="w-72 h-72 md:w-96 md:h-96 object-cover shadow-[0_0_60px_rgba(59,130,246,0.6)] border-4 border-white/10 rounded-lg animate-[spin_10s_linear_infinite] relative z-10">
            </div>

            <!-- Infos -->
            <div class="text-center z-10 bg-black/80 backdrop-blur-md p-6 rounded-xl border border-blue-500/30 min-w-[320px]">
                <div class="text-blue-400 text-xs font-mono tracking-[0.4em] mb-2 uppercase">Identifié</div>
                <h2 id="res-title" class="text-3xl md:text-5xl font-display font-black text-white uppercase tracking-tight text-glow-blue mb-3 truncate max-w-lg">TITRE</h2>
                <div class="inline-flex flex-col items-center gap-2">
                    <span class="px-4 py-1 bg-blue-600 text-white rounded text-sm font-bold uppercase shadow-[0_0_15px_#2563eb]" id="res-album">ALBUM</span>
                    <span id="res-feat" class="text-xs text-blue-300 font-mono italic hidden">Feat. Artistes</span>
                </div>
            </div>
        </div>

        <!-- 2. CONTAINER JEU (Vinyle) -->
        <div id="vinyl-container" class="relative state-visible">
            <div class="visualizer-circle"></div>
            <div class="relative w-72 h-72 md:w-96 md:h-96 group animate-[float_6s_ease-in-out_infinite]">
                <div class="absolute inset-4 bg-blue-600 rounded-full blur-[60px] opacity-40 animate-pulse"></div>
                <div id="disk" class="w-full h-full rounded-full bg-[#050505] border border-gray-800 shadow-2xl flex items-center justify-center disk-spin relative z-10 overflow-hidden">
                    <div class="absolute inset-0 rounded-full border-[60px] border-[#0a0a0a] opacity-80" style="background: repeating-radial-gradient(#111 0, #111 2px, #000 3px, #000 4px);"></div>
                    <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-white/5 to-transparent opacity-30 pointer-events-none"></div>
                    <div class="w-32 h-32 md:w-40 md:h-40 rounded-full bg-blue-900 border-4 border-black flex items-center justify-center relative z-20 shadow-[0_0_20px_black] overflow-hidden">
                        <img id="disk-cover" src="https://i.postimg.cc/FR5kN5CH/plk_concert_paris_zenith_800x800.jpg" class="w-full h-full object-cover opacity-80 mix-blend-luminosity">
                    </div>
                </div>
            </div>
            <div class="mt-16 text-center">
                <div class="inline-flex items-center gap-3 px-6 py-2 rounded-full bg-blue-900/20 border border-blue-500/30">
                    <span id="status-text" class="text-blue-300 font-mono text-sm font-bold tracking-widest uppercase">Écoute en cours...</span>
                </div>
            </div>
        </div>

    </div>

    <!-- ZONE DE SAISIE -->
    <div class="fixed bottom-0 w-full p-6 pb-10 z-40 flex justify-center bg-gradient-to-t from-black via-black/80 to-transparent">
        <div class="w-full max-w-2xl relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 via-cyan-500 to-blue-600 rounded-xl opacity-30 blur-lg group-hover:opacity-60 transition duration-500"></div>
            <div class="relative flex shadow-2xl">
                <input type="text" id="input-guess" placeholder="TITRE DU SON..." class="input-cyber flex-1 px-8 py-5 text-xl md:text-2xl rounded-l-xl uppercase transition-all" autocomplete="off" onkeydown="if(event.key === 'Enter') submitGuess()">
                <button onclick="submitGuess()" class="bg-blue-600 hover:bg-blue-500 text-white font-display font-bold px-8 py-5 text-lg md:text-xl rounded-r-xl transition-all border-l border-white/10 hover:shadow-[0_0_30px_#3b82f6]">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
            <div class="text-center mt-3 flex justify-between px-2">
                <span class="text-[10px] font-mono text-gray-500 uppercase tracking-[0.2em]" id="attempts-info">ESSAIS RESTANTS : <span class="text-white font-bold" id="attempts-count">2</span></span>
                <span class="text-[10px] font-mono text-blue-400 uppercase tracking-[0.2em] font-bold" id="step-info">ÉTAPE 1/2 : TITRE</span>
            </div>
        </div>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="game-over-overlay" class="hidden-force fixed inset-0 z-[100] bg-black/95 backdrop-blur-2xl flex items-center justify-center p-4">
        <div class="w-full max-w-lg relative bg-[#0f172a] border border-red-900/50 p-8 md:p-12 rounded-2xl text-center">
            <h2 class="font-display font-black text-6xl md:text-7xl text-red-600 mb-1 tracking-tighter animate-pulse">ÉCHEC</h2>
            <p class="font-mono text-gray-500 text-sm tracking-[0.5em] mb-8 uppercase">Série Interrompue</p>
            <div class="text-8xl font-black font-display text-white mb-8" id="final-score">0</div>
            <div class="bg-red-900/10 border border-red-500/20 p-4 rounded-lg mb-8 text-left">
                <div class="text-[10px] text-red-400 font-bold uppercase tracking-wider mb-1">C'était :</div>
                <div id="fail-correct-answer" class="text-white font-display font-bold text-xl truncate">...</div>
                <div id="fail-correct-album" class="text-gray-400 font-mono text-sm">Album: ...</div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="location.reload()" class="w-full py-4 bg-white text-black font-black font-display text-lg uppercase tracking-wider hover:bg-gray-200 transition-colors rounded-lg">RÉESSAYER</button>
                <a href="streak_selection.html" class="w-full flex items-center justify-center py-4 border border-white/10 text-gray-400 font-bold font-mono uppercase tracking-wider hover:text-white hover:border-white transition-colors rounded-lg">QUITTER</a>
            </div>
        </div>
    </div>

                { title: "Mec de cité", album: "Feat. Yaro", url: "https://storage.googleapis.com/blind-test-red-empire/Plk/Yaro%2C%20Ninho%2C%20PLK%20-%20Mec%20de%20cit%C3%A9.mp3" },
                { title: "Salut", album: "Feat. Yaro", url: "https://storage.googleapis.com/blind-test-red-empire/Plk/Yaro%2C%20PLK%20-%20Salut.mp3" },
                { title: "Les jolies filles", album: "Feat. Zamdane", url: "https://storage.googleapis.com/blind-test-red-empire/Plk/Zamdane%2C%20PLK%20-%20Les%20jolies%20filles.mp3" },
                { title: "Piou Piou", album: "Feat. Zeu", url: "https://storage.googleapis.com/blind-test-red-empire/Plk/Zeu%2C%20PLK%2C%20Ormaz%20-%20Piou%20Piou.mp3" },
                { title: "Tu vois comment", album: "Feat. Zkr", url: "https://storage.googleapis.com/blind-test-red-empire/Plk/Zkr%2C%20PLK%20-%20Tu%20vois%20comment%20.mp3" }
            ],
            "Singles / Hors Album": [
                { title: "10 Millions", album: "Single", url: "https://storage.googleapis.com/blind-test-red-empire/Plk/PLK%20-%2010%20Millions.mp3" },
                { title: "1Eu", album: "Single", url: "https://storage.googleapis.com/blind-test-red-empire/Plk/PLK%20-%201%E2%82%AC%C2%A0%201Eu.mp3" },
                { title: "Règlement Freestyle #17", album: "Freestyle", url: "https://storage.googleapis.com/blind-test-red-empire/Plk/PLK%20-%20R%C3%A8glement%20Freestyle%20%2317.mp3" },
                { title: "Avec moi", album: "Single", url: "https://storage.googleapis.com/blind-test-red-empire/Plk/PLK%20-%20Avec%20moi.mp3" }
            ]
        };

        // 1. Création de la base de données plate
        const PLK_DATABASE = [];
        Object.values(PLK_RAW_DISCOGRAPHY).flat().forEach(item => {
            let processedItem = { ...item };
            if (processedItem.album.startsWith("Feat.")) {
                processedItem.feat = processedItem.album.replace("Feat. ", "");
                processedItem.album = "Feat.";
            }
            if (processedItem.album.includes("Enna (Boost)")) processedItem.album = "Enna";
            if (processedItem.album.includes("BO") || processedItem.album.includes("Freestyle")) processedItem.album = "Single";
            PLK_DATABASE.push(processedItem);
        });

        // 2. Variables d'état
        let currentStreak = 0;
        let bestStreak = localStorage.getItem('plk_best_streak') || 0;
        let currentSong = null;
        let usedIndices = [];
        let timerInterval = null;
        let gameStep = 1;
        let attemptsTitle = 2;
        let attemptsAlbum = 1;

        // DOM HELPERS
        const getEl = (id) => document.getElementById(id);

        // 3. INITIALISATION
        document.addEventListener('DOMContentLoaded', () => {
            const bestEl = getEl('best-streak');
            if(bestEl) bestEl.innerText = bestStreak;
            
            // On lance le jeu dès que la page est prête
            startGame();
        });

        function updateVolume(val) {
            const audio = getEl('game-audio');
            if(audio) audio.volume = val;
        }

        function startGame() {
            // Tentative de lecture immédiate (sera bloquée si pas d'interaction, mais on essaye)
            const audio = getEl('game-audio');
            if(audio) {
                // Petite astuce : on joue du silence pour "chauffer" le moteur audio
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                }).catch(() => {
                    // Si bloqué, on ajoute un listener global pour débloquer au premier clic
                    document.addEventListener('click', () => {
                        if(audio.paused && currentSong) audio.play();
                    }, { once: true });
                });
            }
            nextRound();
        }

        function nextRound() {
            gameStep = 1;
            attemptsTitle = 2;
            attemptsAlbum = 1;
            
            // --- RESET UI ---
            const revealContainer = getEl('reveal-container');
            if (revealContainer) {
                revealContainer.classList.remove('state-visible');
                revealContainer.classList.add('state-hidden');
            }
            
            const vinylContainer = getEl('vinyl-container');
            if (vinylContainer) {
                vinylContainer.classList.remove('state-hidden');
                vinylContainer.classList.add('state-visible');
            }
            
            const diskEl = getEl('disk');
            if (diskEl) diskEl.classList.remove('disk-paused');
            
            const inputEl = getEl('input-guess');
            if (inputEl) {
                inputEl.value = "";
                inputEl.placeholder = "TITRE DU SON...";
                inputEl.disabled = false;
                inputEl.classList.remove('border-green-500', 'border-red-500');
                inputEl.focus();
            }
            
            const statusText = getEl('status-text');
            if (statusText) {
                statusText.innerText = "Écoute en cours...";
                statusText.className = "text-blue-300 font-mono text-sm font-bold tracking-widest uppercase";
            }

            const stepInfoEl = getEl('step-info');
            if (stepInfoEl) {
                stepInfoEl.innerText = "ÉTAPE 1/2 : TITRE";
                stepInfoEl.className = "text-[10px] font-mono text-blue-400 uppercase tracking-[0.2em] font-bold";
            }
            
            const attemptsInfoEl = getEl('attempts-count');
            if (attemptsInfoEl) attemptsInfoEl.innerText = attemptsTitle;

            // --- CHOIX DU SON ---
            if (usedIndices.length === PLK_DATABASE.length) usedIndices = [];
            
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * PLK_DATABASE.length);
            } while (usedIndices.includes(randomIndex));
            
            usedIndices.push(randomIndex);
            currentSong = PLK_DATABASE[randomIndex];

            // Cover Neutre
            const coverEl = getEl('disk-cover');
            if (coverEl) coverEl.src = "https://i.postimg.cc/FR5kN5CH/plk_concert_paris_zenith_800x800.jpg"; 

            // Audio
            const audio = getEl('game-audio');
            if (currentSong.url && audio) {
                audio.src = currentSong.url;
                audio.volume = 0.5; 
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Autoplay blocked, waiting for interaction"));
            }

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            let timeLeft = 20;
            const timerDisplay = getEl('timer-display');
            
            if (timerDisplay) {
                timerDisplay.innerText = timeLeft + "s";
                timerDisplay.classList.remove('text-red-500');
                timerDisplay.classList.add('text-blue-400');
            }

            timerInterval = setInterval(() => {
                timeLeft--;
                if (timerDisplay) {
                    timerDisplay.innerText = timeLeft + "s";
                    if (timeLeft <= 5) {
                        timerDisplay.classList.remove('text-blue-400');
                        timerDisplay.classList.add('text-red-500');
                    }
                }
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleLoss("Temps écoulé !");
                }
            }, 1000);
        }

        // Comparaison
        function isCloseMatch(input, target) {
            if (!target) return false;
            const clean = (str) => str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '');
            const a = clean(input);
            const b = clean(target);
            
            if (a === b) return true;
            if (b.length > 3 && b.includes(a)) return true;
            
            // Levenshtein simple
            if(a.length === 0) return false;
            if(a.length < 3) return false;
            
            let matchCount = 0;
            const len = Math.min(a.length, b.length);
            for(let i=0; i<len; i++) { if(a[i] === b[i]) matchCount++; }
            return (matchCount / Math.max(a.length, b.length)) > 0.65;
        }

        window.submitGuess = () => {
            const inputEl = getEl('input-guess');
            if (!inputEl) return;
            const guess = inputEl.value.trim();
            if (!guess) return;

            const stepInfoEl = getEl('step-info');
            const attemptsInfoEl = getEl('attempts-count');
            const statusText = getEl('status-text');

            if (gameStep === 1) { // TITRE
                if (isCloseMatch(guess, currentSong.title)) {
                    gameStep = 2;
                    inputEl.value = "";
                    inputEl.placeholder = "QUEL ALBUM ?";
                    inputEl.classList.add('border-green-500');
                    setTimeout(() => inputEl.classList.remove('border-green-500'), 500);
                    
                    if(stepInfoEl) {
                        stepInfoEl.innerText = "ÉTAPE 2/2 : ALBUM";
                        stepInfoEl.className = "text-[10px] font-mono text-yellow-400 uppercase tracking-[0.2em] font-bold animate-pulse";
                    }
                    if(attemptsInfoEl) attemptsInfoEl.innerText = attemptsAlbum;
                    if(statusText) {
                        statusText.innerText = "TITRE VALIDÉ ! ALBUM ?";
                        statusText.className = "text-green-400 font-bold tracking-widest uppercase";
                    }
                } else {
                    attemptsTitle--;
                    if(attemptsInfoEl) attemptsInfoEl.innerText = attemptsTitle;
                    inputEl.classList.add('border-red-500', 'animate-shake');
                    setTimeout(() => inputEl.classList.remove('border-red-500', 'animate-shake'), 500);
                    
                    if (attemptsTitle <= 0) handleLoss("Mauvais titre");
                }
            } else { // ALBUM
                if (isCloseMatch(guess, currentSong.album)) {
                    handleWin();
                } else {
                    attemptsAlbum--;
                    if (attemptsAlbum <= 0) handleLoss("Mauvais album");
                }
            }
        };

        function handleWin() {
            clearInterval(timerInterval);
            
            const inputEl = getEl('input-guess');
            if(inputEl) inputEl.classList.add('border-green-500', 'text-green-400');
            
            const statusText = getEl('status-text');
            if(statusText) {
                statusText.innerText = "CORRECT !";
                statusText.className = "text-green-400 font-display font-black text-xl tracking-widest uppercase animate-bounce";
            }

            currentStreak++;
            const streakCounter = getEl('streak-counter');
            if (streakCounter) streakCounter.innerText = currentStreak;
            
            if(currentStreak > bestStreak) {
                bestStreak = currentStreak;
                localStorage.setItem('plk_best_streak', bestStreak);
                const bestEl = getEl('best-streak');
                if(bestEl) bestEl.innerText = bestStreak;
            }
            
            showReveal(true); // True = Victoire = Musique continue
        }

        function handleLoss(reason) {
            clearInterval(timerInterval);
            const audio = getEl('game-audio');
            if(audio) audio.pause(); // Arrêt musique car perdu
            
            const inputEl = getEl('input-guess');
            if(inputEl) inputEl.classList.add('border-red-500', 'text-red-400', 'animate-shake');
            
            const statusText = getEl('status-text');
            if(statusText) {
                statusText.innerText = reason || "ERREUR...";
                statusText.className = "text-red-500 font-display font-black text-xl tracking-widest uppercase";
            }
            showReveal(false); // False = Défaite
        }

        function showReveal(isWin) {
            const vinylContainer = getEl('vinyl-container');
            const revealContainer = getEl('reveal-container');

            if(vinylContainer) {
                vinylContainer.classList.remove('state-visible');
                vinylContainer.classList.add('state-hidden');
            }

            setTimeout(() => {
                if(revealContainer) {
                    revealContainer.classList.remove('state-hidden');
                    revealContainer.classList.add('state-visible');
                }

                const resTitle = getEl('res-title');
                if(resTitle) resTitle.innerText = currentSong.title;
                
                const revealCoverEl = getEl('reveal-cover');
                if(revealCoverEl) {
                    const coverUrl = ALBUM_COVERS[currentSong.album] || ALBUM_COVERS["Single"];
                    revealCoverEl.src = coverUrl;
                }
                
                const albumEl = getEl('res-album');
                if(albumEl) albumEl.innerText = currentSong.album;
                
                const featEl = getEl('res-feat');
                if(featEl) {
                    if (currentSong.feat) {
                        featEl.innerText = "Feat. " + currentSong.feat;
                        featEl.classList.remove('hidden');
                    } else {
                        featEl.classList.add('hidden');
                    }
                }
                
                if (isWin) {
                    // Si gagné, on laisse la musique et on attend 8s
                    setTimeout(() => {
                        nextRound();
                    }, 8000); 
                } else {
                    // Si perdu, on attend 2s pour lire la réponse, puis Game Over
                    setTimeout(() => {
                        showGameOver();
                    }, 2000);
                }
            }, 500);
        }

        function showGameOver() {
            const finalScore = getEl('final-score');
            if(finalScore) finalScore.innerText = currentStreak;
            
            const failAnswer = getEl('fail-correct-answer');
            if(failAnswer) failAnswer.innerText = currentSong.title;
            
            const failAlbum = getEl('fail-correct-album');
            if(failAlbum) {
                let detailText = `Album: ${currentSong.album}`;
                if(currentSong.feat) detailText += ` (Feat. ${currentSong.feat})`;
                failAlbum.innerText = detailText;
            }
            
            const gameOverOverlay = getEl('game-over-overlay');
            if(gameOverOverlay) gameOverOverlay.classList.remove('hidden-force');
        }

        window.submitGuess = submitGuess;
        window.updateVolume = updateVolume;

    </script>
</body>
