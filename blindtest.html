<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindtest JCJ | Red Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Police style Manga/Comic -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --red: #ff2e2e;
            --yellow: #facc15;
            --dark-bg: #121212;
            --panel-bg: #1a1a1a;
            --text-main: #eeeeee;
            --border-color: #ffffff;
        }

        body { 
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Roboto Condensed', sans-serif;
            overflow: hidden;
            /* Motif à pois sombre style Manga (Halftone) */
            background-image: radial-gradient(#333 20%, transparent 20%);
            background-size: 12px 12px;
        }
        
        .font-manga { font-family: 'Bangers', cursive; letter-spacing: 1.5px; }

        /* --- PANNEAUX MANGA DARK --- */
        .manga-panel {
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            /* Ombre dure colorée pour le style Pop */
            box-shadow: 8px 8px 0px var(--red);
            transition: transform 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        /* Effet de vitesse sur les panneaux (plus subtil en sombre) */
        .speed-lines::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.03) 10px, rgba(255,255,255,0.03) 20px);
            pointer-events: none;
        }

        /* --- BOUTONS POP --- */
        .btn-pop {
            background: var(--border-color); /* Blanc */
            color: var(--dark-bg);
            font-family: 'Bangers', cursive;
            text-transform: uppercase;
            border: 2px solid var(--border-color);
            transition: all 0.1s ease;
            box-shadow: 4px 4px 0px var(--yellow);
        }
        .btn-pop:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--yellow);
            background: var(--yellow);
            color: var(--dark-bg);
            border-color: var(--yellow);
        }
        .btn-pop:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--yellow);
        }
        
        .btn-red { 
            background: var(--red); 
            color: white; 
            border-color: var(--red);
            box-shadow: 4px 4px 0px var(--border-color); 
        }
        .btn-red:hover { 
            background: #ff4444; 
            color: white; 
            box-shadow: 6px 6px 0px var(--border-color); 
            border-color: #ff4444;
        }

        /* --- TIMER BAR --- */
        @keyframes shrink { from { width: 100%; } to { width: 0%; } }
        .timer-container { width: 100%; height: 12px; background: #333; border: 2px solid var(--border-color); border-radius: 99px; overflow: hidden; }
        .timer-fill { height: 100%; background: var(--yellow); width: 100%; }
        .timer-running { animation: shrink linear forwards; }

        /* --- DISQUE QUI TOURNE --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .disk-spin { animation: spin 3s linear infinite; }
        .disk-paused { animation-play-state: paused !important; }

        /* --- INPUT STYLE --- */
        .input-manga {
            border: 3px solid var(--border-color);
            background: #222;
            color: white;
            font-family: 'Bangers', cursive;
            letter-spacing: 1px;
            box-shadow: inset 4px 4px 0px #000;
        }
        .input-manga:focus { outline: none; border-color: var(--yellow); color: var(--yellow); }
        .input-manga::placeholder { color: #666; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- NAVBAR -->
    <nav class="h-16 bg-[#111] border-b-4 border-white flex items-center justify-between px-6 z-50 shadow-lg">
        <a href="blindtest_hub.html" class="flex items-center gap-2 font-bold text-gray-400 hover:text-white transition-colors">
            <i class="fa-solid fa-chevron-left"></i>
            <span class="font-manga text-xl tracking-wider">QUITTER</span>
        </a>
        
        <div class="absolute left-1/2 transform -translate-x-1/2 bg-white text-black px-6 py-1 skew-x-[-10deg] border-2 border-white shadow-[4px_4px_0px_#ff2e2e]">
            <h1 class="font-manga text-2xl skew-x-[10deg] tracking-widest">BLINDTEST <span class="text-red-600">ARENA</span></h1>
        </div>

        <div id="user-badge" class="flex items-center gap-2 bg-gray-800 px-4 py-1 rounded-full border-2 border-white">
            <div class="w-3 h-3 bg-green-500 rounded-full border border-white"></div>
            <span class="text-sm font-bold truncate max-w-[100px] text-white">Joueur</span>
        </div>
    </nav>


    <!-- ========================================== -->
    <!-- ÉCRAN 1 : MENU PRINCIPAL                   -->
    <!-- ========================================== -->
    <div id="screen-menu" class="flex-grow flex items-center justify-center p-4">
        <div class="manga-panel p-8 max-w-md w-full text-center speed-lines">
            
            <div class="w-24 h-24 bg-red-600 rounded-full mx-auto mb-6 flex items-center justify-center border-4 border-white shadow-[0px_0px_20px_rgba(255,46,46,0.4)]">
                <i class="fa-solid fa-play text-4xl text-white pl-1"></i>
            </div>
            
            <h2 class="text-5xl font-manga text-white mb-2 text-shadow-sm">PRÊT AU COMBAT ?</h2>
            <p class="text-gray-400 font-bold mb-8 text-sm tracking-wider">REJOIGNEZ UNE ARÈNE MUSICALE</p>
            
            <div class="space-y-4">
                <button onclick="createRoom()" class="btn-pop btn-red w-full py-4 text-2xl tracking-wider rounded-lg transform transition hover:-rotate-1">
                    CRÉER UNE SALLE
                </button>
                
                <div class="flex items-center gap-3 opacity-50">
                    <div class="h-0.5 bg-gray-600 flex-1 rounded"></div>
                    <span class="text-xs font-bold text-gray-500">OU</span>
                    <div class="h-0.5 bg-gray-600 flex-1 rounded"></div>
                </div>

                <div class="flex gap-3">
                    <input type="text" id="input-room-code" placeholder="CODE" class="input-manga w-32 text-center text-2xl uppercase rounded-lg">
                    <button onclick="joinRoom()" class="btn-pop flex-1 rounded-lg text-xl">
                        REJOINDRE
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- ÉCRAN 2 : LOBBY                            -->
    <!-- ========================================== -->
    <div id="screen-lobby" class="hidden flex-grow flex flex-col md:flex-row p-6 gap-6 h-full">
        
        <!-- GAUCHE : CONFIGURATION -->
        <div class="w-full md:w-1/3 flex flex-col gap-4">
            <!-- Carte Code -->
            <div class="manga-panel p-6 text-center bg-[#222] border-white">
                <span class="bg-yellow-400 text-black text-xs font-bold px-3 py-1 rounded mb-2 inline-block border border-black shadow-[2px_2px_0px_#000]">CODE SALLE</span>
                <div id="lobby-code" class="text-6xl font-manga text-white tracking-wider mt-2">----</div>
            </div>

            <!-- Carte Paramètres -->
            <div class="manga-panel p-6 flex-grow flex flex-col bg-[#1a1a1a]">
                <h3 class="font-manga text-3xl mb-6 text-white border-b-4 border-red-600 inline-block w-max pr-4">PARAMÈTRES</h3>
                
                <div id="host-controls" class="hidden space-y-6">
                    <div>
                        <div class="flex justify-between font-bold mb-2 text-gray-300">
                            <span>Temps de réponse</span>
                            <span id="display-duration" class="bg-white text-black px-2 rounded border border-gray-500">20s</span>
                        </div>
                        <input type="range" min="5" max="45" value="20" id="setting-duration" class="w-full accent-red-600 h-2 bg-gray-700 rounded-lg cursor-pointer" onchange="updateSettings()">
                    </div>
                    
                    <div class="mt-auto">
                        <button onclick="startGame()" class="btn-pop btn-red w-full py-4 text-2xl rounded-lg transform transition hover:scale-105">
                            LANCER LA PARTIE !
                        </button>
                    </div>
                </div>
                
                <div id="guest-controls" class="flex-grow flex flex-col items-center justify-center text-center text-gray-500">
                    <i class="fa-solid fa-hourglass-half text-4xl mb-4 animate-pulse"></i>
                    <p class="font-bold text-sm uppercase">En attente de l'hôte...</p>
                </div>
            </div>
        </div>

        <!-- DROITE : JOUEURS -->
        <div class="flex-1 manga-panel flex flex-col bg-[#151515]">
            <div class="h-16 bg-[#0a0a0a] flex items-center justify-between px-6 border-b-2 border-white">
                <span class="font-manga text-2xl tracking-wide text-yellow-400 text-shadow-sm">JOUEURS</span>
                <div class="flex gap-3">
                    <button onclick="switchTeam(1)" class="text-xs font-bold bg-blue-600 text-white px-4 py-2 rounded border-2 border-white hover:bg-blue-500 shadow-[2px_2px_0px_#fff]">BLEU</button>
                    <button onclick="switchTeam(2)" class="text-xs font-bold bg-red-600 text-white px-4 py-2 rounded border-2 border-white hover:bg-red-500 shadow-[2px_2px_0px_#fff]">ROUGE</button>
                </div>
            </div>
            
            <div class="flex-grow grid grid-cols-2 relative bg-[#111]">
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 bg-white border-4 border-black px-4 py-2 rounded-full shadow-[4px_4px_0px_#000]">
                     <span class="font-manga text-3xl text-black">VS</span>
                </div>

                <!-- Team Blue -->
                <div class="p-4 border-r-2 border-white/20 bg-blue-900/10">
                    <div id="list-team-1" class="space-y-3"></div>
                </div>
                <!-- Team Red -->
                <div class="p-4 bg-red-900/10">
                    <div id="list-team-2" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- ÉCRAN 3 : JEU (IN GAME)                    -->
    <!-- ========================================== -->
    <div id="screen-game" class="hidden relative flex-grow flex flex-col bg-[#111]">
        
        <!-- Timer -->
        <div class="w-full bg-[#1a1a1a] p-4 border-b-4 border-white flex justify-center shadow-lg z-20">
            <div class="timer-container max-w-2xl shadow-inner bg-black">
                <div id="game-timer-bar" class="timer-fill" style="width: 100%;"></div>
            </div>
        </div>

        <!-- CENTRE : DISQUE & VIDEO -->
        <div class="flex-grow flex flex-col items-center justify-center relative overflow-hidden p-4">
            
            <!-- Effet de fond discret -->
            <div class="absolute inset-0 opacity-5 pointer-events-none bg-[linear-gradient(45deg,#fff_25%,transparent_25%,transparent_75%,#fff_75%,#fff),linear-gradient(45deg,#fff_25%,transparent_25%,transparent_75%,#fff_75%,#fff)]" style="background-size: 20px 20px; background-position: 0 0, 10px 10px;"></div>

            <!-- Video Player (Révélation) -->
            <div id="video-wrapper" class="absolute inset-0 z-10 flex items-center justify-center bg-black/95 hidden">
                <div class="w-full h-full max-w-4xl max-h-[70vh] bg-black border-4 border-white rounded-lg shadow-[0_0_50px_rgba(255,255,255,0.1)] overflow-hidden">
                    <video id="game-video" class="w-full h-full object-contain" playsinline></video>
                </div>
            </div>

            <!-- Mode Vinyle (Devinette) -->
            <div id="vinyl-wrapper" class="relative z-20 flex flex-col items-center transition-transform duration-300">
                
                <!-- Disque -->
                <div class="relative w-64 h-64 md:w-80 md:h-80 mb-8 group">
                    <div class="absolute inset-0 bg-white rounded-full blur-xl opacity-10 group-hover:opacity-20 transition-opacity"></div>
                    <div class="w-full h-full rounded-full bg-[#111] border-[6px] border-white shadow-2xl flex items-center justify-center disk-spin disk-paused relative" id="disk">
                        <!-- Sillons -->
                        <div class="absolute inset-0 rounded-full border-[20px] border-[#1a1a1a] opacity-60"></div>
                        <div class="absolute inset-10 rounded-full border-[20px] border-[#222] opacity-60"></div>
                        
                        <!-- Sticker Central -->
                        <div class="absolute w-28 h-28 bg-red-600 rounded-full flex items-center justify-center border-4 border-white z-20 shadow-inner">
                            <i class="fa-solid fa-music text-4xl text-white"></i>
                        </div>
                    </div>
                    <!-- Bras de lecture (Déco) -->
                    <div class="absolute -top-4 -right-4 w-32 h-4 bg-gray-300 rotate-45 origin-top-right border-2 border-black rounded-full shadow-lg z-30"></div>
                </div>

                <div class="text-center bg-white px-8 py-2 border-4 border-black rounded-full shadow-[4px_4px_0px_#000] transform -rotate-2">
                    <h2 class="text-4xl font-manga text-black tracking-widest">ÉCOUTEZ !</h2>
                </div>
            </div>

            <!-- Volume -->
            <div class="absolute top-4 right-4 z-30 bg-[#222] border-2 border-white rounded-full px-4 py-2 flex items-center gap-3 shadow-lg">
                <i class="fa-solid fa-volume-high text-gray-400"></i>
                <input type="range" min="0" max="1" step="0.1" value="0.5" class="w-20 accent-white h-1 bg-gray-600 rounded-lg cursor-pointer" oninput="document.getElementById('game-video').volume = this.value">
            </div>

        </div>

        <!-- BAS : INPUT RÉPONSE -->
        <div class="bg-[#1a1a1a] border-t-4 border-white p-6 relative z-30 shadow-[0_-4px_20px_rgba(0,0,0,0.5)]">
            
            <!-- Résultat Overlay (Pop-up victoire) -->
            <div id="result-display" class="hidden absolute inset-x-0 bottom-full mb-8 z-50 flex justify-center pointer-events-none px-4">
                <div class="bg-yellow-400 border-4 border-black p-8 max-w-2xl w-full text-center shadow-[12px_12px_0px_rgba(0,0,0,0.5)] transform -rotate-1">
                    <h3 class="text-black font-bold text-sm uppercase tracking-[0.3em] mb-3 border-b-2 border-black inline-block pb-1">C'ÉTAIT L'OPENING DE</h3>
                    <h2 id="res-anime" class="text-4xl md:text-6xl font-manga text-white text-shadow-black mb-2 drop-shadow-md" style="-webkit-text-stroke: 2px black;">ANIME NAME</h2>
                    <p id="res-song" class="text-black text-2xl font-bold italic bg-white inline-block px-4 py-1 border-2 border-black mt-2">"Song Title"</p>
                </div>
            </div>

            <div class="max-w-3xl mx-auto flex gap-4">
                <input type="text" id="input-guess" placeholder="NOM DE L'ANIME..." class="input-manga flex-1 h-16 px-6 text-2xl uppercase rounded-lg shadow-[4px_4px_0px_#000]" autocomplete="off">
                <button onclick="submitGuess()" class="btn-pop btn-red w-40 rounded-lg text-2xl shadow-[4px_4px_0px_#000]">
                    ENVOYER
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIQUE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue, update, remove, push, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        // IMPORT EXTERNE (Fichier op_database.js requis dans le même dossier)
        import { OP_DATABASE } from "./op_database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let currentRoomId = null;
        let isHost = false;
        let roundTimer = null;
        const videoEl = document.getElementById('game-video');
        const diskEl = document.getElementById('disk');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.querySelector('#user-badge span').innerText = user.displayName;
            } else {
                alert("Connexion requise !");
                window.location.href = "index.html";
            }
        });

        window.updateSettings = () => {
            if (!isHost) return;
            const range = document.getElementById('setting-duration');
            update(ref(db, `blindtest/rooms/${currentRoomId}/settings`), { duration: parseInt(range.value) });
            document.getElementById('display-duration').innerText = range.value + 's';
        };

        window.createRoom = async () => {
            if (!currentUser) return;
            const roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoomId = roomCode;
            isHost = true;

            const roomData = {
                host: currentUser.uid,
                status: 'lobby',
                settings: { duration: 20, rounds: 5 },
                players: { [currentUser.uid]: { name: currentUser.displayName, team: 1, score: 0, avatar: currentUser.photoURL } },
                gameState: { currentRound: 0, songIndex: 0, startTime: 0, phase: 'lobby' }
            };

            try {
                await set(ref(db, `blindtest/rooms/${roomCode}`), roomData);
                enterLobby(roomCode);
            } catch(e) {
                console.error(e);
                alert("Erreur création. Vérifiez les règles Firebase.");
            }
        };

        window.joinRoom = async () => {
            if (!currentUser) return;
            const code = document.getElementById('input-room-code').value.toUpperCase();
            if (code.length < 4) return alert("Code trop court");

            try {
                const roomRef = ref(db, `blindtest/rooms/${code}`);
                const snapshot = await get(roomRef);

                if (snapshot.exists()) {
                    currentRoomId = code;
                    isHost = false;
                    const updates = {};
                    updates[`blindtest/rooms/${code}/players/${currentUser.uid}`] = {
                        name: currentUser.displayName,
                        team: 1, score: 0, avatar: currentUser.photoURL
                    };
                    await update(ref(db), updates);
                    enterLobby(code);
                } else {
                    alert("Salle introuvable !");
                }
            } catch(e) { alert("Erreur connexion salle."); }
        };

        function enterLobby(code) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-lobby').classList.remove('hidden');
            document.getElementById('lobby-code').innerText = code;

            if (isHost) {
                document.getElementById('host-controls').classList.remove('hidden');
                document.getElementById('guest-controls').classList.add('hidden');
            }

            onValue(ref(db, `blindtest/rooms/${code}`), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                renderPlayers(data.players);
                
                if (!isHost) {
                    document.getElementById('display-duration').innerText = data.settings.duration + 's';
                    document.getElementById('setting-duration').value = data.settings.duration;
                }

                if (data.status === 'playing') {
                    if (document.getElementById('screen-game').classList.contains('hidden')) {
                        document.getElementById('screen-lobby').classList.add('hidden');
                        document.getElementById('screen-game').classList.remove('hidden');
                    }
                    handleGameSync(data.gameState, data.settings);
                }
            });
        }

        function renderPlayers(players) {
            const t1 = document.getElementById('list-team-1');
            const t2 = document.getElementById('list-team-2');
            t1.innerHTML = ''; t2.innerHTML = '';

            Object.values(players).forEach(p => {
                const el = document.createElement('div');
                el.className = "flex items-center gap-2 bg-[#222] border border-gray-600 p-2 rounded mb-2 shadow-sm";
                el.innerHTML = `
                    <img src="${p.avatar || 'https://ui-avatars.com/api/?name='+p.name}" class="w-10 h-10 rounded border-2 border-white bg-black"> 
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-white text-sm truncate uppercase font-manga tracking-wider">${p.name}</div>
                        <div class="text-xs text-yellow-400 font-mono font-bold">${p.score} PTS</div>
                    </div>
                `;
                if (p.team === 1) t1.appendChild(el);
                else t2.appendChild(el);
            });
        }

        window.switchTeam = (teamId) => {
            update(ref(db, `blindtest/rooms/${currentRoomId}/players/${currentUser.uid}`), { team: teamId });
        };

        window.startGame = () => {
            const randomIndex = Math.floor(Math.random() * OP_DATABASE.length);
            update(ref(db, `blindtest/rooms/${currentRoomId}`), {
                status: 'playing',
                gameState: {
                    currentRound: 1,
                    songIndex: randomIndex,
                    startTime: Date.now() + 3000,
                    phase: 'guessing'
                }
            });
        };

        let lastPhase = '';
        let lastStartTime = 0;

        function handleGameSync(gameState, settings) {
            if (gameState.phase === lastPhase && gameState.startTime === lastStartTime) return;
            lastPhase = gameState.phase;
            lastStartTime = gameState.startTime;
            
            const songData = OP_DATABASE[gameState.songIndex];

            if (gameState.phase === 'guessing') {
                document.getElementById('result-display').classList.add('hidden');
                document.getElementById('video-wrapper').classList.add('hidden');
                document.getElementById('vinyl-wrapper').classList.remove('hidden');
                
                document.getElementById('input-guess').value = "";
                document.getElementById('input-guess').disabled = false;
                document.getElementById('input-guess').focus();

                videoEl.src = songData.url;
                videoEl.volume = 0.5;
                videoEl.play().catch(e => console.log("Autoplay bloqué"));

                diskEl.classList.remove('disk-paused');
                
                const bar = document.getElementById('game-timer-bar');
                bar.classList.remove('timer-running');
                void bar.offsetWidth;
                bar.style.animationDuration = settings.duration + 's';
                bar.classList.add('timer-running');

                if (isHost) {
                    clearTimeout(roundTimer);
                    roundTimer = setTimeout(() => {
                        update(ref(db, `blindtest/rooms/${currentRoomId}/gameState`), { phase: 'reveal', startTime: Date.now() });
                    }, settings.duration * 1000);
                }

            } else if (gameState.phase === 'reveal') {
                document.getElementById('result-display').classList.remove('hidden');
                document.getElementById('res-anime').innerText = songData.anime;
                document.getElementById('res-song').innerText = songData.song;
                
                document.getElementById('video-wrapper').classList.remove('hidden');
                document.getElementById('vinyl-wrapper').classList.add('hidden');
                
                diskEl.classList.add('disk-paused');
                document.getElementById('input-guess').disabled = true;

                if (isHost) {
                    setTimeout(() => {
                        const nextIndex = Math.floor(Math.random() * OP_DATABASE.length);
                        update(ref(db, `blindtest/rooms/${currentRoomId}/gameState`), {
                            currentRound: gameState.currentRound + 1,
                            songIndex: nextIndex,
                            startTime: Date.now(),
                            phase: 'guessing'
                        });
                    }, 5000);
                }
            }
        }

        window.submitGuess = () => {
            const userGuess = document.getElementById('input-guess').value;
            document.getElementById('input-guess').value = "";
            const btn = document.querySelector('button[onclick="submitGuess()"]');
            const originalText = btn.innerText;
            btn.innerText = "OK !";
            setTimeout(() => btn.innerText = originalText, 1000);
        };

    </script>
