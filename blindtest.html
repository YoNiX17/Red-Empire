<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blindtest JCJ | Red Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Shojumaru&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff003c; /* Cyberpunk Red */
            --secondary: #711c91; /* Cyberpunk Purple */
            --dark: #050103;
            --glass: rgba(15, 5, 10, 0.8);
        }

        body { 
            background-color: var(--dark); 
            color: #e5e5e5; 
            font-family: 'Rajdhani', sans-serif; 
            overflow: hidden; 
        }
        
        .font-jap { font-family: 'Shojumaru', system-ui; }
        .font-tech { font-family: 'Orbitron', sans-serif; }

        /* --- CRT SCANLINE EFFECT --- */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }
        
        /* --- HUD BORDERS --- */
        .hud-panel {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 60, 0.3);
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.1);
            position: relative;
            clip-path: polygon(
                15px 0, 100% 0, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                0 100%, 0 15px
            );
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        /* Interaction Panneau */
        .hud-panel:hover {
            border-color: rgba(255, 0, 60, 0.8);
            box-shadow: 0 0 40px rgba(255, 0, 60, 0.2);
        }

        /* Décorations coins */
        .hud-corner {
            position: absolute; 
            width: 8px; 
            height: 8px;
            border: 2px solid var(--primary);
            transition: all 0.3s ease;
            opacity: 0.5;
        }
        .hc-tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
        .hc-tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
        .hc-bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
        .hc-br { bottom: 0; right: 0; border-left: 0; border-top: 0; }
        
        .hud-panel:hover .hud-corner {
            opacity: 1;
            box-shadow: 0 0 10px var(--primary);
            border-color: #fff; 
        }

        /* --- NEON TEXT --- */
        .text-neon {
            text-shadow: 0 0 5px var(--primary), 0 0 20px var(--primary);
        }

        /* --- ANIMATIONS --- */
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.2); opacity: 0; } }
        .pulse-ring::before {
            content: ''; position: absolute; inset: -10px; border: 2px solid var(--primary); border-radius: 50%;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        .spin-disk { animation: spin-slow 6s linear infinite; }
        .paused-disk { animation-play-state: paused !important; }
        
        /* Visualizer bars */
        .bar { width: 8px; background: var(--primary); box-shadow: 0 0 15px var(--primary); margin: 0 2px; }
        .playing .bar { animation: sound 0.5s ease-in-out infinite alternate; }
        @keyframes sound { 0% { height: 10px; opacity: 0.5; } 100% { height: 60px; opacity: 1; } }
        .bar:nth-child(odd) { animation-duration: 0.4s; }
        .bar:nth-child(2n) { animation-duration: 0.6s; }
        .bar:nth-child(3n) { animation-duration: 0.3s; }

        /* Timer Bar */
        @keyframes load { from { width: 100%; } to { width: 0%; } }
        .timer-bar { height: 4px; background: var(--primary); width: 100%; box-shadow: 0 0 20px var(--primary); }
        .timer-running { animation: load linear forwards; }

        /* Glitch input focus */
        .input-cyber:focus {
            box-shadow: 0 0 15px var(--secondary);
            border-color: var(--secondary);
        }
    </style>
</head>

    <!-- SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue, update, remove, push, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        // IMPORT DE LA LISTE D'OPENINGS
        import { OP_DATABASE } from "./op_database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let currentRoomId = null;
        let isHost = false;
        let roundTimer = null;
        
        const videoEl = document.getElementById('game-video');
        const diskEl = document.getElementById('disk');
        const visualizerEl = document.getElementById('visualizer');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
            } else {
                alert("Veuillez vous identifier au QG.");
                window.location.href = "index.html";
            }
        });

        window.updateSettings = () => {
            if (!isHost) return;
            const range = document.getElementById('setting-duration');
            const duration = parseInt(range.value);
            
            const percent = ((duration - range.min) / (range.max - range.min)) * 100;
            document.getElementById('range-progress').style.width = percent + "%";
            document.getElementById('range-thumb').style.left = percent + "%";
            
            update(ref(db, `blindtest/rooms/${currentRoomId}/settings`), { duration });
            document.getElementById('display-duration').innerText = duration + 's';
        };

        window.createRoom = async () => {
            if (!currentUser) return;
            const roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoomId = roomCode;
            isHost = true;

            const roomData = {
                host: currentUser.uid,
                status: 'lobby',
                settings: { duration: 20, rounds: 5 },
                players: { [currentUser.uid]: { name: currentUser.displayName, team: 1, score: 0, avatar: currentUser.photoURL } },
                gameState: { currentRound: 0, songIndex: 0, startTime: 0, phase: 'lobby' }
            };

            await set(ref(db, `blindtest/rooms/${roomCode}`), roomData);
            enterLobby(roomCode);
        };

        window.joinRoom = async () => {
            if (!currentUser) return;
            const code = document.getElementById('input-room-code').value.toUpperCase();
            if (code.length < 4) return alert("Code invalide");

            const roomRef = ref(db, `blindtest/rooms/${code}`);
            const snapshot = await get(roomRef);

            if (snapshot.exists()) {
                currentRoomId = code;
                isHost = false;
                const updates = {};
                updates[`blindtest/rooms/${code}/players/${currentUser.uid}`] = {
                    name: currentUser.displayName,
                    team: 1, 
                    score: 0,
                    avatar: currentUser.photoURL
                };
                await update(ref(db), updates);
                enterLobby(code);
            } else {
                alert("Salle introuvable !");
            }
        };

        function enterLobby(code) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-lobby').classList.remove('hidden');
            document.getElementById('lobby-code').innerText = code;

            if (isHost) {
                document.getElementById('host-controls').classList.remove('hidden');
                document.getElementById('guest-controls').classList.add('hidden');
            }

            onValue(ref(db, `blindtest/rooms/${code}`), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                renderPlayers(data.players);
                
                if (!isHost) {
                    document.getElementById('display-duration').innerText = data.settings.duration + 's';
                    const range = document.getElementById('setting-duration');
                    const percent = ((data.settings.duration - 5) / (45 - 5)) * 100;
                    document.getElementById('range-progress').style.width = percent + "%";
                    document.getElementById('range-thumb').style.left = percent + "%";
                }

                if (data.status === 'playing') {
                    if (document.getElementById('screen-game').classList.contains('hidden')) {
                        document.getElementById('screen-lobby').classList.add('hidden');
                        document.getElementById('screen-game').classList.remove('hidden');
                    }
                    handleGameSync(data.gameState, data.settings);
                }
            });
        }

        function renderPlayers(players) {
            const t1 = document.getElementById('list-team-1');
            const t2 = document.getElementById('list-team-2');
            t1.innerHTML = ''; t2.innerHTML = '';

            Object.values(players).forEach(p => {
                const el = document.createElement('div');
                el.className = "flex items-center gap-3 text-white text-sm bg-black/40 p-3 border-l-4 mb-2 transition-all hover:bg-white/5 " + (p.team === 1 ? "border-blue-500" : "border-red-500");
                el.innerHTML = `<img src="${p.avatar || 'https://ui-avatars.com/api/?name='+p.name}" class="w-10 h-10 rounded object-cover border border-white/10"> <div><div class="font-bold font-tech uppercase text-xs tracking-wider">${p.name}</div><div class="text-[10px] text-gray-400 font-mono">SCORE: ${p.score}</div></div>`;
                
                if (p.team === 1) t1.appendChild(el);
                else t2.appendChild(el);
            });
        }

        window.switchTeam = (teamId) => {
            update(ref(db, `blindtest/rooms/${currentRoomId}/players/${currentUser.uid}`), { team: teamId });
        };

        window.startGame = () => {
            const randomIndex = Math.floor(Math.random() * OP_DATABASE.length);
            update(ref(db, `blindtest/rooms/${currentRoomId}`), {
                status: 'playing',
                gameState: {
                    currentRound: 1,
                    songIndex: randomIndex,
                    startTime: Date.now() + 3000,
                    phase: 'guessing'
                }
            });
        };

        let lastPhase = '';
        let lastStartTime = 0;

        function handleGameSync(gameState, settings) {
            if (gameState.phase === lastPhase && gameState.startTime === lastStartTime) return;
            lastPhase = gameState.phase;
            lastStartTime = gameState.startTime;
            
            const songData = OP_DATABASE[gameState.songIndex];

            if (gameState.phase === 'guessing') {
                document.getElementById('result-display').classList.add('hidden');
                document.getElementById('video-wrapper').classList.add('hidden');
                document.getElementById('vinyl-wrapper').classList.remove('hidden');
                
                document.getElementById('input-guess').value = "";
                document.getElementById('input-guess').disabled = false;
                document.getElementById('input-guess').focus();

                videoEl.src = songData.url;
                videoEl.volume = 0.5;
                videoEl.play().catch(e => console.log("Autoplay bloqué"));

                diskEl.classList.remove('paused-disk');
                visualizerEl.style.opacity = 1;
                visualizerEl.classList.add('playing');

                const bar = document.getElementById('game-timer-bar');
                bar.classList.remove('timer-running');
                void bar.offsetWidth;
                bar.style.animationDuration = settings.duration + 's';
                bar.classList.add('timer-running');

                if (isHost) {
                    clearTimeout(roundTimer);
                    roundTimer = setTimeout(() => {
                        update(ref(db, `blindtest/rooms/${currentRoomId}/gameState`), { phase: 'reveal', startTime: Date.now() });
                    }, settings.duration * 1000);
                }

            } else if (gameState.phase === 'reveal') {
                document.getElementById('result-display').classList.remove('hidden');
                document.getElementById('res-anime').innerText = songData.anime;
                document.getElementById('res-song').innerText = songData.song;
                
                document.getElementById('video-wrapper').classList.remove('hidden');
                document.getElementById('vinyl-wrapper').classList.add('hidden');
                
                diskEl.classList.add('paused-disk');
                visualizerEl.style.opacity = 0;
                visualizerEl.classList.remove('playing');
                
                document.getElementById('input-guess').disabled = true;

                if (isHost) {
                    setTimeout(() => {
                        const nextIndex = Math.floor(Math.random() * OP_DATABASE.length);
                        update(ref(db, `blindtest/rooms/${currentRoomId}/gameState`), {
                            currentRound: gameState.currentRound + 1,
                            songIndex: nextIndex,
                            startTime: Date.now(),
                            phase: 'guessing'
                        });
                    }, 5000);
                }
            }
        }

        window.submitGuess = () => {
            const userGuess = document.getElementById('input-guess').value;
            document.getElementById('input-guess').value = "";
            console.log("Réponse:", userGuess);
            
            const input = document.getElementById('input-guess');
            input.placeholder = "DONNÉES ENVOYÉES...";
            setTimeout(() => input.placeholder = "ENTREZ LE NOM DE L'ANIME...", 2000);
        };

    </script>
</body>
</html>
