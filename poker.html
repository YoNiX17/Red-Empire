                        <button 
                            onClick={handleCreate} 
                            disabled={!name.trim()} 
                            className="w-full btn btn-raise py-4 text-lg"
                        >
                            <i className="fa-solid fa-play mr-2"></i>CRÉER LA TABLE
                        </button>
                    </div>
                    
                    {/* Tables List */}
                    <div className="w-full max-w-xl">
                        <h2 className="font-display text-2xl text-white mb-5">
                            <i className="fa-solid fa-list text-yellow-400 mr-3"></i>
                            Tables ({active.length})
                        </h2>
                        
                        {active.length === 0 ? (
                            <div className="glass p-12 text-center rounded-xl">
                                <i className="fa-solid fa-ghost text-5xl text-gray-700 mb-4"></i>
                                <p className="text-gray-500 text-lg">Aucune table disponible</p>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                {active.map(([id, t]) => {
                                    const cnt = Object.keys(t.players || {}).length;
                                    return (
                                        <div key={id} className="glass p-5 rounded-xl flex justify-between items-center">
                                            <div>
                                                <div className="font-bold text-white text-lg flex items-center gap-2">
                                                    {t.name}
                                                    <span className="text-xs text-gray-500 font-normal bg-gray-800 px-2 py-0.5 rounded">
                                                        {t.cardDesign || 'classic'}
                                                    </span>
                                                </div>
                                                <div className="text-sm text-gray-400 mt-1">
                                                    <span className="mr-4">
                                                        <i className="fa-solid fa-users mr-1"></i>{cnt}/{MAX_P}
                                                    </span>
                                                    <span className="mr-4">
                                                        <i className="fa-solid fa-coins text-yellow-500 mr-1"></i>{t.buyIn}
                                                    </span>
                                                    <span className={t.status === 'playing' ? 'text-green-400' : 'text-blue-400'}>
                                                        ● {t.status === 'playing' ? 'En jeu' : 'Attente'}
                                                    </span>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => { soundManager.init(); onJoin(id); }} 
                                                disabled={cnt >= MAX_P} 
                                                className="btn btn-raise px-6 py-3"
                                            >
                                                {cnt >= MAX_P ? 'COMPLET' : 'REJOINDRE'}
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                    
                    <a href="games.html" className="mt-10 text-gray-500 hover:text-white transition text-lg">
                        <i className="fa-solid fa-arrow-left mr-2"></i>Retour
                    </a>
                </div>
            );
        };
        
        // ==========================================
        // TABLE COMPONENT
        // ==========================================
        const Table = ({ tableId, user, onLeave }) => {
            const [game, setGame] = useState(null);
            const [confetti, setConfetti] = useState(false);
            const [winner, setWinner] = useState(null);
            const [raise, setRaise] = useState(40);
            const [muted, setMuted] = useState(false);
            const prevTurnRef = useRef(null);
            
            // Subscribe to game updates
            useEffect(() => {
                if (!tableId) return;
                
                const ref = window.FB.ref(window.FB.db, `poker_tables/${tableId}`);
                
                const unsub = window.FB.onValue(ref, snap => {
                    if (!snap.exists()) {
                        onLeave();
                        return;
                    }
                    
                    const d = snap.val();
                    
                    // Clean up empty tables
                    if (Object.keys(d.players || {}).length === 0) {
                        window.FB.remove(ref);
                        onLeave();
                        return;
                    }
                    
                    // Play turn sound
                    if (d.currentPlayer === user.id && prevTurnRef.current !== user.id && d.status === 'playing') {
                        soundManager.play('turn');
                    }
                    prevTurnRef.current = d.currentPlayer;
                    
                    setGame(d);
                    
                    // Handle winner
                    if (d.winnerId && d.showWinner && !winner) {
                        const w = d.players[d.winnerId];
                        if (w) {
                            soundManager.play('win');
                            setWinner({
                                player: w,
                                pot: d.lastPot || d.pot || 0,
                                hand: d.winnerHand
                            });
                            if (d.winnerId === user.id) {
                                setConfetti(true);
                                setTimeout(() => setConfetti(false), 4000);
                            }
                        }
                    }
                });
                
                // Clean up on disconnect
                window.FB.onDisconnect(
                    window.FB.ref(window.FB.db, `poker_tables/${tableId}/players/${user.id}`)
                ).remove();
                
                return () => unsub();
            }, [tableId, user.id]);
            
            const toggleSound = () => {
                setMuted(soundManager.toggle());
            };
            
            // ==========================================
            // GAME ACTIONS
            // ==========================================
            const act = async (action, amt = 0) => {
                if (!game || game.currentPlayer !== user.id) return;
                
                const p = game.players;
                const me = p[user.id];
                
                if (!me || me.folded) return;
                
                // Check if player can act
                if ((me.chips || 0) <= 0 && action !== 'fold' && !me.isAllIn) {
                    if (action === 'check' && (me.currentBet || 0) >= (game.currentBet || 0)) {
                        // Allow check when already matched
                    } else if (action !== 'fold') {
                        return;
                    }
                }
                
                // Play sound
                if (action === 'fold') soundManager.play('fold');
                else if (action === 'check') soundManager.play('check');
                else if (action === 'call' || action === 'raise') soundManager.play('chip');
                else if (action === 'all-in') soundManager.play('allin');
                
                const active = Object.keys(p).filter(id => !p[id].folded);
                const upd = {};
                const path = `poker_tables/${tableId}/players/${user.id}`;
                
                let pot = game.pot || 0;
                let currBet = game.currentBet || 0;
                
                // Process action
                if (action === 'fold') {
                    upd[`${path}/folded`] = true;
                    upd[`${path}/lastAction`] = 'fold';
                }
                else if (action === 'check') {
                    upd[`${path}/lastAction`] = 'check';
                    upd[`${path}/hasActed`] = true;
                }
                else if (action === 'call') {
                    const diff = Math.min(currBet - (me.currentBet || 0), me.chips || 0);
                    if (diff <= 0) return;
                    upd[`${path}/currentBet`] = (me.currentBet || 0) + diff;
                    upd[`${path}/chips`] = (me.chips || 0) - diff;
                    upd[`${path}/lastAction`] = 'call';
                    upd[`${path}/hasActed`] = true;
                    pot += diff;
                    upd[`poker_tables/${tableId}/pot`] = pot;
                }
                else if (action === 'raise') {
                    if ((me.chips || 0) <= 0) return;
                    const diff = amt - (me.currentBet || 0);
                    if (diff <= 0 || diff > (me.chips || 0)) return;
                    upd[`${path}/currentBet`] = amt;
                    upd[`${path}/chips`] = (me.chips || 0) - diff;
                    upd[`${path}/lastAction`] = 'raise';
                    upd[`${path}/hasActed`] = true;
                    pot += diff;
                    currBet = amt;
                    upd[`poker_tables/${tableId}/pot`] = pot;
                    upd[`poker_tables/${tableId}/currentBet`] = currBet;
                    // Reset hasActed for others
                    active.forEach(id => {
                        if (id !== user.id) upd[`poker_tables/${tableId}/players/${id}/hasActed`] = false;
                    });
                }
                else if (action === 'all-in') {
                    if ((me.chips || 0) <= 0) return;
                    const myChips = me.chips || 0;
                    const total = myChips + (me.currentBet || 0);
                    upd[`${path}/currentBet`] = total;
                    upd[`${path}/chips`] = 0;
                    upd[`${path}/lastAction`] = 'all-in';
                    upd[`${path}/isAllIn`] = true;
                    upd[`${path}/hasActed`] = true;
                    pot += myChips;
                    upd[`poker_tables/${tableId}/pot`] = pot;
                    if (total > currBet) {
                        upd[`poker_tables/${tableId}/currentBet`] = total;
                        active.forEach(id => {
                            if (id !== user.id) upd[`poker_tables/${tableId}/players/${id}/hasActed`] = false;
                        });
                    }
                }
                
                // Check if only one player left
                const remaining = active.filter(id => action !== 'fold' || id !== user.id);
                if (remaining.length === 1) {
                    await endHand(remaining[0], upd);
                    return;
                }
                
                // Find next player
                const myIdx = active.indexOf(user.id);
                let nextIdx = (myIdx + 1) % active.length;
                let nextP = active[nextIdx];
                let tries = 0;
                while (tries < active.length && (p[nextP]?.folded || p[nextP]?.isAllIn)) {
                    nextIdx = (nextIdx + 1) % active.length;
                    nextP = active[nextIdx];
                    tries++;
                }
                
                // Check if round is complete
                const newBet = action === 'raise' ? amt : (action === 'all-in' ? ((me.chips || 0) + (me.currentBet || 0)) : currBet);
                
                const allActed = remaining.every(id => {
                    const pl = id === user.id ? { ...p[id], hasActed: true } : p[id];
                    return pl.hasActed || pl.isAllIn || pl.folded;
                });
                
                const allMatched = remaining.every(id => {
                    const pl = id === user.id ? { ...p[id], currentBet: upd[`${path}/currentBet`] || p[id].currentBet } : p[id];
                    return (pl.currentBet || 0) >= newBet || pl.isAllIn || (pl.chips || 0) === 0;
                });
                
                if (allActed && allMatched && action !== 'raise' && action !== 'all-in') {
                    await nextPhase(upd, remaining);
                } else {
                    upd[`poker_tables/${tableId}/currentPlayer`] = nextP;
                    await window.FB.update(window.FB.ref(window.FB.db), upd);
                }
            };
            
            // ==========================================
            // NEXT PHASE
            // ==========================================
            const nextPhase = async (pending, active) => {
                const upd = { ...pending };
                const phase = game.phase;
                const deck = game.deck || [];
                const cc = game.communityCards || [];
                
                // Reset player states
                Object.keys(game.players).forEach(id => {
                    upd[`poker_tables/${tableId}/players/${id}/currentBet`] = 0;
                    upd[`poker_tables/${tableId}/players/${id}/hasActed`] = false;
                    upd[`poker_tables/${tableId}/players/${id}/lastAction`] = null;
                });
                upd[`poker_tables/${tableId}/currentBet`] = 0;
                
                // Play card sound
                setTimeout(() => soundManager.play('flip'), 100);
                
                // Advance phase
                if (phase === 'preflop') {
                    upd[`poker_tables/${tableId}/communityCards`] = deck.slice(0, 3);
                    upd[`poker_tables/${tableId}/deck`] = deck.slice(3);
                    upd[`poker_tables/${tableId}/phase`] = 'flop';
                }
                else if (phase === 'flop') {
                    upd[`poker_tables/${tableId}/communityCards`] = [...cc, deck[0]];
                    upd[`poker_tables/${tableId}/deck`] = deck.slice(1);
                    upd[`poker_tables/${tableId}/phase`] = 'turn';
                }
                else if (phase === 'turn') {
                    upd[`poker_tables/${tableId}/communityCards`] = [...cc, deck[0]];
                    upd[`poker_tables/${tableId}/deck`] = deck.slice(1);
                    upd[`poker_tables/${tableId}/phase`] = 'river';
                }
                else if (phase === 'river') {
                    await showdown(upd, active);
                    return;
                }
                
                // Set next player
                const canAct = active.filter(id => !game.players[id].isAllIn && (game.players[id].chips || 0) > 0);
                if (canAct.length > 0) {
                    const dIdx = canAct.indexOf(game.dealer);
                    upd[`poker_tables/${tableId}/currentPlayer`] = canAct[(dIdx + 1) % canAct.length] || canAct[0];
                } else if (active.length > 0) {
                    await showdown(upd, active);
                    return;
                }
                
                await window.FB.update(window.FB.ref(window.FB.db), upd);
            };
            
            // ==========================================
            // SHOWDOWN
            // ==========================================
            const showdown = async (pending, active) => {
                const upd = { ...pending };
                const cc = game.communityCards || [];
                
                // Show all cards
                active.forEach(id => upd[`poker_tables/${tableId}/players/${id}/showCards`] = true);
                upd[`poker_tables/${tableId}/phase`] = 'showdown';
                
                // Find winner
                let best = null;
                let winnerId = null;
                
                active.forEach(id => {
                    const pl = game.players[id];
                    if (pl.cards?.length === 2) {
                        const h = evalHand([...pl.cards, ...cc]);
                        if (!best || h.rank > best.rank || (h.rank === best.rank && cmpHigh(h.high, best.high) > 0)) {
                            best = h;
                            winnerId = id;
                        }
                    }
                });
                
                if (winnerId) {
                    await endHand(winnerId, upd, best);
                }
            };
            
            // ==========================================
            // END HAND
            // ==========================================
            const endHand = async (winnerId, pending = {}, hand = null) => {
                const upd = { ...pending };
                const pot = game.pot || 0;
                const w = game.players[winnerId];
                
                upd[`poker_tables/${tableId}/players/${winnerId}/chips`] = (w?.chips || 0) + pot;
                upd[`poker_tables/${tableId}/players/${winnerId}/showCards`] = true;
                upd[`poker_tables/${tableId}/winnerId`] = winnerId;
                upd[`poker_tables/${tableId}/winnerHand`] = hand;
                upd[`poker_tables/${tableId}/showWinner`] = true;
                upd[`poker_tables/${tableId}/lastPot`] = pot;
                upd[`poker_tables/${tableId}/status`] = 'ended';
                
                await window.FB.update(window.FB.ref(window.FB.db), upd);
            };
            
            // ==========================================
            // CLOSE WINNER MODAL
            // ==========================================
            const closeWinner = async () => {
                setWinner(null);
                
                const upd = {};
                upd[`poker_tables/${tableId}/showWinner`] = false;
                upd[`poker_tables/${tableId}/winnerId`] = null;
                upd[`poker_tables/${tableId}/winnerHand`] = null;
                upd[`poker_tables/${tableId}/status`] = 'waiting';
                upd[`poker_tables/${tableId}/phase`] = 'waiting';
                upd[`poker_tables/${tableId}/pot`] = 0;
                upd[`poker_tables/${tableId}/currentBet`] = 0;
                upd[`poker_tables/${tableId}/communityCards`] = [];
                upd[`poker_tables/${tableId}/currentPlayer`] = null;
                
                Object.keys(game.players || {}).forEach(id => {
                    upd[`poker_tables/${tableId}/players/${id}/cards`] = null;
                    upd[`poker_tables/${tableId}/players/${id}/folded`] = false;
                    upd[`poker_tables/${tableId}/players/${id}/currentBet`] = 0;
                    upd[`poker_tables/${tableId}/players/${id}/lastAction`] = null;
                    upd[`poker_tables/${tableId}/players/${id}/hasActed`] = false;
                    upd[`poker_tables/${tableId}/players/${id}/isAllIn`] = false;
                    upd[`poker_tables/${tableId}/players/${id}/showCards`] = false;
                });
                
                await window.FB.update(window.FB.ref(window.FB.db), upd);
            };
            
            // ==========================================
            // START GAME
            // ==========================================
            const startGame = async () => {
                const ids = Object.keys(game.players).filter(id => (game.players[id].chips || 0) > 0);
                if (ids.length < MIN_P) return;
                
                const deck = makeDeck();
                let idx = 0;
                const upd = {};
                
                soundManager.play('deal');
                
                // Deal cards
                ids.forEach(id => {
                    upd[`poker_tables/${tableId}/players/${id}/cards`] = [deck[idx++], deck[idx++]];
                    upd[`poker_tables/${tableId}/players/${id}/folded`] = false;
                    upd[`poker_tables/${tableId}/players/${id}/currentBet`] = 0;
                    upd[`poker_tables/${tableId}/players/${id}/lastAction`] = null;
                    upd[`poker_tables/${tableId}/players/${id}/hasActed`] = false;
                    upd[`poker_tables/${tableId}/players/${id}/isAllIn`] = false;
                    upd[`poker_tables/${tableId}/players/${id}/showCards`] = false;
                });
                
                // Set blinds
                const sbIdx = ids.length > 2 ? 1 : 0;
                const bbIdx = ids.length > 2 ? 2 : 1;
                const firstIdx = ids.length > 2 ? 3 : 0;
                
                const sb = ids[sbIdx % ids.length];
                const bb = ids[bbIdx % ids.length];
                const pl = game.players;
                
                const sbAmt = Math.min(BLINDS.sb, pl[sb].chips || 0);
                const bbAmt = Math.min(BLINDS.bb, pl[bb].chips || 0);
                
                upd[`poker_tables/${tableId}/players/${sb}/currentBet`] = sbAmt;
                upd[`poker_tables/${tableId}/players/${sb}/chips`] = (pl[sb].chips || 0) - sbAmt;
                upd[`poker_tables/${tableId}/players/${bb}/currentBet`] = bbAmt;
                upd[`poker_tables/${tableId}/players/${bb}/chips`] = (pl[bb].chips || 0) - bbAmt;
                
                upd[`poker_tables/${tableId}/deck`] = deck.slice(idx);
                upd[`poker_tables/${tableId}/communityCards`] = [];
                upd[`poker_tables/${tableId}/pot`] = sbAmt + bbAmt;
                upd[`poker_tables/${tableId}/currentBet`] = bbAmt;
                upd[`poker_tables/${tableId}/dealer`] = ids[0];
                upd[`poker_tables/${tableId}/smallBlind`] = sb;
                upd[`poker_tables/${tableId}/bigBlind`] = bb;
                upd[`poker_tables/${tableId}/currentPlayer`] = ids[firstIdx % ids.length];
                upd[`poker_tables/${tableId}/status`] = 'playing';
                upd[`poker_tables/${tableId}/phase`] = 'preflop';
                upd[`poker_tables/${tableId}/showWinner`] = false;
                upd[`poker_tables/${tableId}/winnerId`] = null;
                
                await window.FB.update(window.FB.ref(window.FB.db), upd);
            };
            
            // ==========================================
            // RENDER
            // ==========================================
            if (!game) {
                return (
                    <div className="h-screen flex items-center justify-center bg-black">
                        <i className="fa-solid fa-spinner fa-spin text-5xl text-red-500"></i>
                    </div>
                );
            }
            
            const players = game.players || {};
            const ids = Object.keys(players);
            const myTurn = game.currentPlayer === user.id && game.status === 'playing';
            const me = players[user.id];
            const myChips = me?.chips || 0;
            const canCheck = me && (me.currentBet || 0) >= (game.currentBet || 0);
            const callAmt = Math.max(0, (game.currentBet || 0) - (me?.currentBet || 0));
            const minR = Math.max(BLINDS.bb * 2, (game.currentBet || 0) * 2);
            const maxR = myChips;
            const design = game.cardDesign || 'classic';
            
            // Reorder players so current user is at position 0
            const myIdx = ids.indexOf(user.id);
            const ordered = myIdx >= 0 ? [...ids.slice(myIdx), ...ids.slice(0, myIdx)] : ids;
            
            return (
                <div className="game-container">
                    <Confetti on={confetti} />
                    <SoundToggle muted={muted} onToggle={toggleSound} />
                    
                    {winner && (
                        <WinnerModal 
                            winner={winner.player} 
                            hand={winner.hand} 
                            pot={winner.pot} 
                            onClose={closeWinner} 
                        />
                    )}
                    
                    {/* Header */}
                    <div className="header">
                        <button onClick={onLeave} className="text-gray-400 hover:text-white text-sm">
                            <i className="fa-solid fa-arrow-left mr-2"></i>Quitter
                        </button>
                        <div className="font-display text-white text-lg">{game.name}</div>
                        {game.status === 'playing' && (
                            <div className="bg-yellow-500/20 text-yellow-400 px-5 py-1.5 rounded-full text-sm font-display uppercase">
                                {game.phase}
                            </div>
                        )}
                        {game.status !== 'playing' && (
                            <div className="text-gray-500">Blinds {BLINDS.sb}/{BLINDS.bb}</div>
                        )}
                    </div>
                    
                    {/* Poker Table */}
                    <div className="poker-table">
                        <div className="felt">
                            <DeckStack design={design} />
                            
                            {/* Center Area */}
                            <div className="center-area">
                                <div className="pot-box">
                                    <div className="text-gray-400 text-sm mb-1">POT</div>
                                    <div className="text-yellow-400 font-display text-3xl">
                                        <i className="fa-solid fa-coins mr-2"></i>
                                        {(game.pot || 0).toLocaleString()}
                                    </div>
                                </div>
                                
                                <div className="community-cards">
                                    {(game.communityCards || []).map((c, i) => (
                                        <Card 
                                            key={c.id} 
                                            card={c} 
                                            size="xl" 
                                            design={design} 
                                            dealType="community" 
                                            dealDelay={i * 220} 
                                        />
                                    ))}
                                    {Array.from({ length: 5 - (game.communityCards?.length || 0) }).map((_, i) => (
                                        <div key={i} className="card-empty"></div>
                                    ))}
                                </div>
                            </div>
                            
                            {/* Player Positions */}
                            <div className="player-positions">
                                {ordered.map((id, i) => {
                                    const pl = players[id];
                                    const isMe = id === user.id;
                                    const canSeeCards = isMe || pl?.showCards === true || game.phase === 'showdown';
                                    
                                    return (
                                        <div key={id} className={`player-slot pos-${i}`}>
                                            <Player 
                                                p={pl} 
                                                isTurn={game.currentPlayer === id} 
                                                isD={game.dealer === id} 
                                                isSB={game.smallBlind === id} 
                                                isBB={game.bigBlind === id} 
                                                isMe={isMe} 
                                                showCards={canSeeCards} 
                                                isWinner={game.winnerId === id} 
                                                design={design} 
                                            />
                                            {pl && (pl.currentBet || 0) > 0 && (
                                                <div className="player-bet">
                                                    <i className="fa-solid fa-coins text-xs mr-1"></i>
                                                    {pl.currentBet}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                                
                                {/* Empty slots */}
                                {Array.from({ length: MAX_P - ids.length }).map((_, i) => (
                                    <div key={`e${i}`} className={`player-slot pos-${ids.length + i}`}>
                                        <Player p={null} design={design} />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    {/* Actions Bar - When it's my turn */}
                    {myTurn && me && !me.folded && (
                        <div className="actions-bar">
                            <div className="text-center mb-4">
                                <span className="text-yellow-400 font-display text-lg">
                                    <i className="fa-solid fa-hand-pointer mr-2"></i>VOTRE TOUR
                                </span>
                            </div>
                            
                            {myChips > 0 && (
                                <div className="mb-5">
                                    <div className="flex justify-between text-sm text-gray-400 mb-2">
                                        <span>Relance</span>
                                        <span className="text-yellow-400 font-bold text-lg">
                                            {Math.min(raise, maxR)}
                                        </span>
                                    </div>
                                    <input 
                                        type="range" 
                                        min={minR} 
                                        max={maxR} 
                                        value={Math.min(raise, maxR)} 
                                        onChange={e => setRaise(+e.target.value)} 
                                        className="slider w-full" 
                                        disabled={maxR < minR} 
                                    />
                                </div>
                            )}
                            
                            <div className="grid grid-cols-4 gap-3">
                                <button onClick={() => act('fold')} className="btn btn-fold">
                                    FOLD
                                </button>
                                {canCheck ? (
                                    <button onClick={() => act('check')} className="btn btn-check">
                                        CHECK
                                    </button>
                                ) : (
                                    <button 
                                        onClick={() => act('call')} 
                                        disabled={callAmt > myChips || myChips <= 0} 
                                        className="btn btn-call"
                                    >
                                        CALL {Math.min(callAmt, myChips)}
                                    </button>
                                )}
                                <button 
                                    onClick={() => act('raise', Math.min(raise, maxR))} 
                                    disabled={maxR < minR || myChips <= 0} 
                                    className="btn btn-raise"
                                >
                                    RAISE
                                </button>
                                <button 
                                    onClick={() => act('all-in')} 
                                    disabled={myChips <= 0} 
                                    className="btn btn-allin"
                                >
                                    ALL-IN
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {/* Actions Bar - Waiting to start */}
                    {game.status !== 'playing' && !winner && (
                        <div className="actions-bar">
                            {ids.filter(id => (players[id]?.chips || 0) > 0).length >= MIN_P ? (
                                <button onClick={startGame} className="btn btn-raise px-12 py-5 text-xl">
                                    <i className="fa-solid fa-play mr-3"></i>DÉMARRER
                                </button>
                            ) : (
                                <div className="text-gray-400 text-lg">
                                    <i className="fa-solid fa-hourglass-half mr-2"></i>
                                    En attente ({ids.filter(id => (players[id]?.chips || 0) > 0).length}/{MIN_P})
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };
        
        // ==========================================
        // APP COMPONENT
        // ==========================================
        const App = () => {
            const [user, setUser] = useState(null);
            const [table, setTable] = useState(null);
            const [tables, setTables] = useState({});
            const [loading, setLoading] = useState(true);
            
            useEffect(() => {
                const init = () => {
                    // Auth listener
                    window.FB.onAuth(window.FB.auth, async u => {
                        if (u) {
                            const snap = await window.FB.get(window.FB.ref(window.FB.db, `users/${u.uid}`));
                            const d = snap.exists() ? snap.val() : {};
                            setUser({
                                id: u.uid,
                                name: d.username || u.displayName || 'Joueur',
                                avatar: d.avatar || u.photoURL,
                                chips: d.pokerChips || START_CHIPS
                            });
                        } else {
                            setUser(null);
                        }
                        setLoading(false);
                    });
                    
                    // Tables listener
                    window.FB.onValue(window.FB.ref(window.FB.db, 'poker_tables'), snap => {
                        const d = snap.val() || {};
                        // Clean empty tables
                        Object.entries(d).forEach(([id, t]) => {
                            if (Object.keys(t.players || {}).length === 0) {
                                window.FB.remove(window.FB.ref(window.FB.db, `poker_tables/${id}`));
                            }
                        });
                        setTables(d);
                    });
                };
                
                if (window.FB) init();
                else window.addEventListener('fb-ready', init);
            }, []);
            
            const create = async (name, buyIn, cardDesign) => {
                const r = window.FB.push(window.FB.ref(window.FB.db, 'poker_tables'));
                await window.FB.set(r, {
                    name,
                    buyIn,
                    cardDesign,
                    status: 'waiting',
                    pot: 0,
                    currentBet: 0,
                    phase: 'waiting',
                    players: {
                        [user.id]: {
                            name: user.name,
                            avatar: user.avatar,
                            chips: buyIn,
                            seat: 0
                        }
                    }
                });
                setTable(r.key);
            };
            
            const join = async id => {
                const t = tables[id];
                if (!t) return;
                
                const cnt = Object.keys(t.players || {}).length;
                if (cnt >= MAX_P) return;
                
                if (t.players?.[user.id]) {
                    setTable(id);
                    return;
                }
                
                await window.FB.update(window.FB.ref(window.FB.db), {
                    [`poker_tables/${id}/players/${user.id}`]: {
                        name: user.name,
                        avatar: user.avatar,
                        chips: t.buyIn,
                        seat: cnt
                    }
                });
                setTable(id);
            };
            
            const leave = async () => {
                if (table) {
                    await window.FB.remove(
                        window.FB.ref(window.FB.db, `poker_tables/${table}/players/${user.id}`)
                    );
                }
                setTable(null);
            };
            
            // Loading
            if (loading) {
                return (
                    <div className="h-screen flex items-center justify-center bg-black">
                        <i className="fa-solid fa-crown text-6xl text-red-500 animate-pulse"></i>
                    </div>
                );
            }
            
            // Not logged in
            if (!user) {
                return (
                    <div className="h-screen flex items-center justify-center bg-black p-4">
                        <div className="glass rounded-3xl p-12 text-center max-w-md">
                            <i className="fa-solid fa-crown text-red-500 text-6xl mb-5"></i>
                            <h1 className="font-display text-4xl text-white mb-2">RED POKER</h1>
                            <p className="text-gray-400 mb-10 text-lg">Texas Hold'em</p>
                            <button 
                                onClick={() => { soundManager.init(); window.FB.signIn(); }} 
                                className="w-full btn btn-raise py-5 text-xl"
                            >
                                <i className="fa-brands fa-google mr-3"></i>Connexion
                            </button>
                            <a href="games.html" className="block mt-8 text-gray-500 hover:text-white text-lg">
                                <i className="fa-solid fa-arrow-left mr-2"></i>Retour
                            </a>
                        </div>
                    </div>
                );
            }
            
            // In a table
            if (table) {
                return <Table tableId={table} user={user} onLeave={leave} />;
            }
            
            // Lobby
            return <Lobby user={user} tables={tables} onCreate={create} onJoin={join} />;
        };
        
        // ==========================================
        // RENDER
        // ==========================================
        ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
