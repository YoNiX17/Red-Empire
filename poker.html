<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Red Empire | Texas Hold'em</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@500;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    
    <!-- MOTEUR DE POKER (POKERSOLVER) -->
    <script src="https://cdn.jsdelivr.net/npm/pokersolver@2.1.4/pokersolver.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        empire: { 500: '#ff3333', 600: '#e60000', 700: '#cc0000', 800: '#990000', 900: '#4d0000', black: '#030303' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
                        felt: '#0d1f12'
                    },
                    fontFamily: {
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Rajdhani', 'sans-serif'],
                        poker: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #030303 0%, #0a0a0a 50%, #050505 100%);
            color: #e5e5e5; 
            overflow: hidden; 
            user-select: none;
            min-height: 100vh;
        }
        
        /* TABLE */
        .poker-table-container { 
            perspective: 1200px; 
            width: 100%; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding-top: 60px;
        }
        
        .poker-table {
            width: 95%; 
            max-width: 1100px; 
            aspect-ratio: 2/1;
            background: 
                radial-gradient(ellipse at 50% 50%, #1a3d1a 0%, #0d2810 40%, #071a09 80%, #030a04 100%);
            border-radius: 50%;
            position: relative;
            transform: rotateX(15deg) translateY(30px);
            border: 16px solid #1a1a1a;
            box-shadow: 
                0 60px 120px rgba(0,0,0,0.9),
                0 0 0 4px #2a2a2a,
                0 0 0 8px #111,
                inset 0 0 150px rgba(0,0,0,0.6),
                inset 0 0 50px rgba(0,0,0,0.4);
        }
        
        .table-felt-pattern {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="4" height="4" fill="%23ffffff" fill-opacity="0.02"/></svg>');
            pointer-events: none;
        }
        
        .table-rim-glow {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            box-shadow: 
                0 0 60px rgba(255, 51, 51, 0.1),
                inset 0 0 60px rgba(255, 51, 51, 0.05);
            pointer-events: none;
        }
        
        .table-center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: rgba(255, 51, 51, 0.06);
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 0.3em;
            text-shadow: 0 0 40px rgba(255, 51, 51, 0.1);
            pointer-events: none;
        }

        /* CARDS */
        .card-slot { 
            width: 70px; 
            height: 100px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            position: relative;
        }
        
        @media (min-width: 768px) { 
            .card-slot { width: 85px; height: 120px; }
        }
        
        @media (min-width: 1024px) { 
            .card-slot { width: 95px; height: 135px; }
        }
        
        .card { 
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d; 
            border-radius: 10px; 
            box-shadow: 
                0 8px 25px rgba(0,0,0,0.6),
                0 2px 10px rgba(0,0,0,0.4);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: default;
        }
        
        .card:hover {
            transform: translateY(-5px) rotateY(var(--rot, 0deg));
        }
        
        .card.flipped { 
            --rot: 180deg;
            transform: rotateY(180deg); 
        }
        
        .card.flipped:hover {
            transform: translateY(-5px) rotateY(180deg);
        }
        
        .card-face { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
        }

        .card-front { 
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #ffffff 0%, #f5f5f5 50%, #e8e8e8 100%);
            border: 1px solid #ccc;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }
        
        .card-back { 
            background: 
                repeating-linear-gradient(
                    45deg,
                    #8b0000 0px,
                    #8b0000 10px,
                    #6b0000 10px,
                    #6b0000 20px
                );
            border: 4px solid #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card-back::before {
            content: '';
            position: absolute;
            inset: 8px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 6px;
        }
        
        .card-back::after { 
            content: 'RE'; 
            font-family: 'Orbitron', sans-serif; 
            font-weight: 900; 
            color: #8b0000; 
            background: #f5f5f5; 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.9rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .suit-red { color: #dc2626; }
        .suit-black { color: #1f2937; }
        
        .card-corner { 
            position: absolute; 
            font-size: 1rem; 
            font-weight: 700; 
            line-height: 1;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        
        .card-corner-tl { top: 6px; left: 8px; }
        .card-corner-br { bottom: 6px; right: 8px; transform: rotate(180deg); }
        
        .card-center-suit { 
            font-size: 2.5rem;
        }
        
        @media (min-width: 768px) {
            .card-corner { font-size: 1.2rem; }
            .card-center-suit { font-size: 3rem; }
        }

        /* PLAYER HUD */
        .player-hud { 
            background: rgba(0,0,0,0.85); 
            border: 2px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(12px); 
            padding: 12px 20px; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-width: 140px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        
        .player-hud.active { 
            border-color: #fbbf24; 
            box-shadow: 
                0 0 30px rgba(251, 191, 36, 0.3),
                0 15px 40px rgba(0,0,0,0.5);
            transform: scale(1.05);
        }
        
        .player-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid #333;
            overflow: hidden;
            margin-bottom: 8px;
            transition: all 0.3s;
        }
        
        .player-hud.active .player-avatar {
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }
        
        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .dealer-chip {
            position: absolute;
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            background: linear-gradient(145deg, #ffffff, #e0e0e0);
            color: #111;
            border-radius: 50%;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            border: 2px solid #ccc;
        }

        /* ACTION BUBBLE */
        .action-bubble {
            position: absolute;
            right: -100px;
            top: 0;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            color: #111;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            font-family: 'Rajdhani', sans-serif;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateX(-10px) scale(0.8);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
        }
        
        .action-bubble.show {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
        
        .action-bubble::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            border: 8px solid transparent;
            border-right-color: #ffffff;
        }

        /* CONTROLS */
        .action-bar { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(15,15,15,0.98); 
            border: 1px solid #333; 
            padding: 16px 20px; 
            border-radius: 24px; 
            display: flex; 
            gap: 12px; 
            z-index: 50; 
            box-shadow: 
                0 25px 60px rgba(0,0,0,0.8),
                0 0 0 1px rgba(255,255,255,0.05);
            width: 95%; 
            max-width: 650px; 
            align-items: center;
        }
        
        .bet-controls {
            flex: 0 0 30%;
            padding-right: 16px;
            border-right: 1px solid #333;
        }
        
        .btn-game { 
            flex: 1; 
            padding: 14px 8px; 
            font-family: 'Orbitron', sans-serif; 
            font-weight: 700; 
            text-transform: uppercase; 
            border-radius: 12px; 
            transition: all 0.15s ease;
            position: relative; 
            overflow: hidden; 
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            border: none;
            cursor: pointer;
        }
        
        .btn-game:active:not(:disabled) { 
            transform: scale(0.95);
        }
        
        .btn-game:disabled { 
            opacity: 0.3; 
            filter: grayscale(1); 
            cursor: not-allowed;
        }
        
        .btn-fold { 
            background: linear-gradient(145deg, #4b5563, #374151);
            color: #d1d5db;
            box-shadow: 0 4px 0 #1f2937, 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .btn-fold:hover:not(:disabled) {
            background: linear-gradient(145deg, #6b7280, #4b5563);
        }
        
        .btn-check { 
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            color: #bfdbfe;
            box-shadow: 0 4px 0 #1e3a8a, 0 6px 20px rgba(37,99,235,0.3);
        }
        
        .btn-check:hover:not(:disabled) {
            background: linear-gradient(145deg, #3b82f6, #2563eb);
        }
        
        .btn-raise { 
            background: linear-gradient(145deg, #dc2626, #b91c1c);
            color: #fecaca;
            box-shadow: 0 4px 0 #7f1d1d, 0 6px 20px rgba(220,38,38,0.3);
        }
        
        .btn-raise:hover:not(:disabled) {
            background: linear-gradient(145deg, #ef4444, #dc2626);
        }
        
        /* SLIDER */
        input[type=range] { 
            -webkit-appearance: none; 
            width: 100%; 
            background: transparent;
            margin: 8px 0;
        }
        
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            height: 22px; 
            width: 22px; 
            border-radius: 50%; 
            background: linear-gradient(145deg, #ff4444, #cc0000);
            cursor: pointer; 
            margin-top: -9px;
            box-shadow: 0 0 15px rgba(255,51,51,0.5), 0 2px 5px rgba(0,0,0,0.3);
            border: 2px solid #fff;
        }
        
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; 
            height: 4px; 
            cursor: pointer; 
            background: linear-gradient(90deg, #333 0%, #555 100%);
            border-radius: 3px;
        }

        /* POT DISPLAY */
        .pot-display {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }
        
        .pot-label {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Rajdhani', sans-serif;
            margin-bottom: 4px;
        }
        
        .pot-amount {
            background: rgba(0,0,0,0.6);
            padding: 8px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .pot-amount i {
            color: #fbbf24;
        }
        
        .pot-amount span {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #fff;
        }

        /* COMMUNITY CARDS */
        .community-area {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 10px;
            padding: 15px 25px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* GAME STATUS */
        .game-status {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #fbbf24;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(251,191,36,0.5);
        }

        /* TOAST */
        .toast { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) scale(0.8); 
            background: rgba(0,0,0,0.95);
            border: 3px solid #ff3333;
            padding: 40px 60px;
            border-radius: 20px;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            box-shadow: 
                0 0 80px rgba(255, 51, 51, 0.4),
                0 30px 60px rgba(0,0,0,0.8);
        }
        
        .toast.show { 
            opacity: 1; 
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        
        .toast-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
        }
        
        .toast-title.win { color: #22c55e; }
        .toast-title.lose { color: #ef4444; }
        
        .toast-msg {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            color: #fbbf24;
        }

        /* LOBBY */
        #lobby-overlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.97);
            z-index: 100; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            backdrop-filter: blur(20px);
        }
        
        .lobby-box { 
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border: 2px solid #333;
            padding: 50px;
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 
                0 0 80px rgba(255, 51, 51, 0.15),
                0 30px 60px rgba(0,0,0,0.8);
        }
        
        .lobby-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: #ff3333;
            margin-bottom: 5px;
            text-shadow: 0 0 30px rgba(255,51,51,0.5);
        }
        
        .lobby-subtitle {
            font-family: 'Rajdhani', sans-serif;
            color: #666;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }
        
        .lobby-input {
            width: 100%;
            background: #111;
            border: 2px solid #333;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 16px;
        }
        
        .lobby-input:focus {
            border-color: #ff3333;
            box-shadow: 0 0 20px rgba(255,51,51,0.2);
        }
        
        .lobby-btn {
            width: 100%;
            background: linear-gradient(145deg, #cc0000, #990000);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            padding: 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #660000, 0 8px 30px rgba(204,0,0,0.3);
        }
        
        .lobby-btn:hover {
            background: linear-gradient(145deg, #e60000, #aa0000);
            transform: translateY(-2px);
        }
        
        .lobby-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #660000;
        }
        
        .lobby-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .lobby-status {
            margin-top: 20px;
            font-family: 'Rajdhani', sans-serif;
            color: #fbbf24;
            min-height: 24px;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid rgba(255,51,51,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 50;
            backdrop-filter: blur(10px);
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .nav-brand i {
            color: #ff3333;
            font-size: 1.3rem;
        }
        
        .nav-brand span {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        
        .nav-room {
            font-family: 'Rajdhani', sans-serif;
            color: #666;
            font-size: 0.85rem;
        }
        
        .nav-room span {
            color: #fff;
        }
        
        .nav-leave {
            font-family: 'Rajdhani', sans-serif;
            color: #666;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.2s;
            background: none;
            border: none;
        }
        
        .nav-leave:hover {
            color: #ff3333;
        }

        /* CARD DEAL ANIMATION */
        @keyframes cardDeal {
            0% {
                opacity: 0;
                transform: translate(-50%, -200%) rotateZ(-20deg) scale(0.5);
            }
            60% {
                opacity: 1;
                transform: translate(0, 0) rotateZ(5deg) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: translate(0, 0) rotateZ(0) scale(1);
            }
        }
        
        .card.dealing {
            animation: cardDeal 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* CHIP ANIMATION */
        @keyframes chipToPot {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.5);
            }
        }
        
        .chip-anim {
            position: absolute;
            width: 30px;
            height: 30px;
            background: linear-gradient(145deg, #fbbf24, #d97706);
            border-radius: 50%;
            border: 3px dashed #fff;
            animation: chipToPot 0.6s ease-out forwards;
            z-index: 100;
        }

        /* PULSE ANIMATION */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <!-- LOBBY -->
    <div id="lobby-overlay">
        <div class="lobby-box">
            <h1 class="lobby-title">RED EMPIRE</h1>
            <p class="lobby-subtitle">POKER ROOM</p>
            
            <input type="text" id="room-input" class="lobby-input" 
                   placeholder="Nom de la table" maxlength="20">
            
            <button id="btn-join" class="lobby-btn">S'ASSEOIR</button>
            
            <p id="lobby-status" class="lobby-status"></p>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav>
        <div class="nav-brand">
            <i class="fa-solid fa-crown"></i>
            <span>RED EMPIRE <span style="color: #ff3333;">POKER</span></span>
        </div>
        <div class="nav-room" id="room-display">TABLE: <span>---</span></div>
        <button class="nav-leave" onclick="window.leaveMatch()">QUITTER</button>
    </nav>

    <!-- GAME -->
    <div class="poker-table-container">
        <div class="poker-table">
            <div class="table-felt-pattern"></div>
            <div class="table-rim-glow"></div>
            <div class="table-center-logo">♠</div>
            
            <!-- POT -->
            <div class="pot-display">
                <div class="pot-label">Pot Total</div>
                <div class="pot-amount">
                    <i class="fa-solid fa-coins"></i>
                    <span id="pot-display">0</span>
                </div>
            </div>
            
            <!-- COMMUNITY CARDS -->
            <div class="community-area" id="community-area">
                <div class="card-slot" id="community-0"></div>
                <div class="card-slot" id="community-1"></div>
                <div class="card-slot" id="community-2"></div>
                <div class="card-slot" id="community-3"></div>
                <div class="card-slot" id="community-4"></div>
            </div>
            
            <!-- GAME STATUS -->
            <div class="game-status" id="game-status">EN ATTENTE...</div>
            
            <!-- OPPONENT (TOP) -->

    <!-- SFX -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        const sfx = {
            deal: () => playTone(800, 'sine', 0.08),
            chip: () => { playTone(1200, 'triangle', 0.05); setTimeout(() => playTone(1400, 'triangle', 0.03), 30); },
            turn: () => playTone(500, 'sine', 0.15),
            win: () => { 
                playTone(523, 'square', 0.1); 
                setTimeout(() => playTone(659, 'square', 0.1), 100);
                setTimeout(() => playTone(784, 'square', 0.2), 200);
            },
            lose: () => { playTone(300, 'sawtooth', 0.3); },
            fold: () => playTone(200, 'sawtooth', 0.2)
        };
    </script>

    <!-- GAME LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue, update, remove, child, runTransaction, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",

        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ============ CARD & DECK ============
        const SUITS = ['s', 'h', 'c', 'd'];
        const VALUES = ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A'];
        
        function toSolverCard(card) {
            return card.value + card.suit;
        }
        
        function getSymbol(suit) {
            const symbols = { s: '♠', h: '♥', c: '♣', d: '♦' };
            return symbols[suit] || '?';
        }
        
        function getColor(suit) {
            return (suit === 'h' || suit === 'd') ? 'suit-red' : 'suit-black';
        }
        
        function createDeck() {
            const cards = [];
            for (let s of SUITS) {
                for (let v of VALUES) {
                    cards.push({ suit: s, value: v, id: Math.random().toString(36).substr(2, 9) });
                }
            }
            // Fisher-Yates shuffle
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            return cards;
        }

        // ============ STATE ============
        let currentUser = null;
        let gameId = null;
        let isHost = false;
        let localState = {
            boardLength: 0,
            myHandDealt: false,
            oppHandDealt: false,
            lastHandId: null
        };
        let processedShowdown = false;

        // ============ DOM ELEMENTS ============
        const els = {
            lobby: document.getElementById('lobby-overlay'),
            roomInput: document.getElementById('room-input'),
            btnJoin: document.getElementById('btn-join'),
            status: document.getElementById('lobby-status'),
            roomDisplay: document.getElementById('room-display'),
            pHand: document.getElementById('player-hand-container'),
            oHand: document.getElementById('opp-hand-container'),
            board: [0,1,2,3,4].map(i => document.getElementById(`community-${i}`)),
            pot: document.getElementById('pot-display'),
            pChips: document.getElementById('player-chips'),
            oChips: document.getElementById('opp-chips'),
            gStatus: document.getElementById('game-status'),
            controls: {
                fold: document.getElementById('btn-fold'),
                check: document.getElementById('btn-check'),
                raise: document.getElementById('btn-raise'),
                slider: document.getElementById('bet-slider'),
                val: document.getElementById('bet-val-display')
            },
            oppBubble: document.getElementById('opp-bubble'),
            dPlayer: document.getElementById('dealer-player'),
            dOpp: document.getElementById('dealer-opp'),
            pHud: document.getElementById('player-hud'),
            oHud: document.getElementById('opp-hud'),
            myAvatar: document.getElementById('my-avatar'),
            oppAvatar: document.getElementById('opp-avatar'),
            oppName: document.getElementById('opp-name'),
            toast: document.getElementById('toast'),
            toastTitle: document.getElementById('toast-title'),
            toastMsg: document.getElementById('toast-msg')
        };

        // ============ AUTH ============
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                els.status.innerText = "Connecté ! Entrez un nom de table.";
                const name = user.displayName || 'Joueur';
                els.myAvatar.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=cc0000&color=fff`;
            } else {
                signInAnonymously(auth);
            }
        });

        // ============ JOIN GAME ============
        els.btnJoin.onclick = async () => {
            const roomName = els.roomInput.value.trim().toUpperCase();
            if (!roomName) {
                els.status.innerText = "Entrez un nom de table !";
                return;
            }
            if (!currentUser) {
                els.status.innerText = "Connexion en cours...";
                return;
            }
            els.status.innerText = "Connexion à la table...";
            els.btnJoin.disabled = true;
            await joinGame(roomName);
        };

        async function joinGame(roomName) {
            const roomRef = ref(db, `poker/rooms/${roomName}`);
            try {
                const snap = await get(roomRef);
                
                if (!snap.exists()) {
                    // Create new room
                    isHost = true;
                    const initialData = {
                        created: Date.now(),
                        handId: 0,
                        players: {
                            [currentUser.uid]: {
                                chips: 5000,
                                hand: [],
                                isDealer: true,
                                name: currentUser.displayName || "Joueur 1",
                                avatar: els.myAvatar.src,
                                currentRoundBet: 0
                            }
                        },
                        board: [],
                        pot: 0,
                        currentBet: 0,
                        deck: [],
                        state: 'waiting_for_player',
                        turn: null,
                        lastAction: { type: 'create' }
                    };
                    await set(roomRef, initialData);
                } else {
                    const data = snap.val();
                    const players = data.players || {};
                    const playerIds = Object.keys(players);
                    
                    if (playerIds.includes(currentUser.uid)) {
                        // Already in room
                        isHost = playerIds[0] === currentUser.uid;
                    } else if (playerIds.length < 2) {
                        // Join as second player
                        isHost = false;
                        await update(child(roomRef, `players/${currentUser.uid}`), {
                            chips: 5000,
                            hand: [],
                            isDealer: false,
                            name: currentUser.displayName || "Joueur 2",
                            avatar: els.myAvatar.src,
                            currentRoundBet: 0
                        });
                        await update(roomRef, { state: 'ready_to_start' });
                    } else {
                        els.status.innerText = "Table pleine !";
                        els.btnJoin.disabled = false;
                        return;
                    }
                }
                
                gameId = roomName;
                els.lobby.style.display = 'none';
                els.roomDisplay.innerHTML = `TABLE: <span>${roomName}</span>`;
                
                // Setup disconnect cleanup
                const myPlayerRef = child(roomRef, `players/${currentUser.uid}`);
                onDisconnect(myPlayerRef).remove();
                
                startGameListener(roomRef);
                
            } catch (e) {
                console.error(e);
                els.status.innerText = "Erreur de connexion.";
                els.btnJoin.disabled = false;
            }
        }

        window.leaveMatch = async () => {
            if (!gameId || !currentUser) {
                location.reload();
                return;
            }
            const roomRef = ref(db, `poker/rooms/${gameId}`);
            await remove(child(roomRef, `players/${currentUser.uid}`));
            const snap = await get(child(roomRef, 'players'));
            if (!snap.exists()) await remove(roomRef);
            location.reload();
        };

        // ============ GAME LISTENER ============
        function startGameListener(roomRef) {
            onValue(roomRef, (snap) => {
                const data = snap.val();
                if (!data) {
                    els.gStatus.innerText = "Table fermée";
                    return;
                }
                
                // Update host status
                const pIds = Object.keys(data.players || {});
                isHost = pIds[0] === currentUser.uid;
                
                renderGame(data);
                
                // Auto-start new hand
                if (data.state === 'ready_to_start' && isHost) {
                    setTimeout(() => startNewHand(roomRef, data), 500);
                }
                
                if (data.state === 'waiting_for_new_hand' && isHost) {
                    setTimeout(() => startNewHand(roomRef, data), 3000);
                }
                
                // Handle showdown
                if (data.state === 'showdown' && isHost && !processedShowdown) {
                    processedShowdown = true;
                    setTimeout(() => resolveShowdown(data), 2500);
                }
                if (data.state !== 'showdown') {
                    processedShowdown = false;
                }
            });
        }

        // ============ START NEW HAND ============
        async function startNewHand(roomRef, data) {
            const deck = createDeck();
            const pIds = Object.keys(data.players);
            if (pIds.length < 2) return;

            const p1Id = pIds[0];
            const p2Id = pIds[1];
            const p1 = data.players[p1Id];
            const p2 = data.players[p2Id];
            
            // Alternate dealer
            const newP1Dealer = data.handId > 0 ? !p1.isDealer : p1.isDealer;
            
            // Deal cards
            const h1 = [deck.pop(), deck.pop()];
            const h2 = [deck.pop(), deck.pop()];
            
            // Blinds: Small Blind = Dealer (button), Big Blind = other player
            const SB = 50, BB = 100;
            let p1Chips = Math.max(0, p1.chips);
            let p2Chips = Math.max(0, p2.chips);
            
            let sbPlayerId, bbPlayerId;
            let p1Bet = 0, p2Bet = 0;
            
            if (newP1Dealer) {
                // P1 is dealer/SB, P2 is BB
                sbPlayerId = p1Id;
                bbPlayerId = p2Id;
                p1Bet = Math.min(SB, p1Chips);
                p2Bet = Math.min(BB, p2Chips);
                p1Chips -= p1Bet;
                p2Chips -= p2Bet;
            } else {
                // P2 is dealer/SB, P1 is BB
                sbPlayerId = p2Id;
                bbPlayerId = p1Id;
                p2Bet = Math.min(SB, p2Chips);
                p1Bet = Math.min(BB, p1Chips);
                p2Chips -= p2Bet;
                p1Chips -= p1Bet;
            }
            
            // In heads-up, SB (dealer) acts first preflop
            const firstToAct = sbPlayerId;
            
            const updates = {
                deck: deck,
                board: [],
                pot: p1Bet + p2Bet,
                currentBet: BB, // Amount needed to call
                state: 'preflop',
                turn: firstToAct,
                handId: (data.handId || 0) + 1,
                lastAction: { type: 'new_hand' },
                [`players/${p1Id}/hand`]: h1,
                [`players/${p1Id}/isDealer`]: newP1Dealer,
                [`players/${p1Id}/chips`]: p1Chips,
                [`players/${p1Id}/currentRoundBet`]: p1Bet,
                [`players/${p2Id}/hand`]: h2,
                [`players/${p2Id}/isDealer`]: !newP1Dealer,
                [`players/${p2Id}/chips`]: p2Chips,
                [`players/${p2Id}/currentRoundBet`]: p2Bet
            };

            await update(roomRef, updates);
        }

        // ============ RENDER GAME ============
        function renderGame(data) {
            const pIds = Object.keys(data.players || {});
            const myId = currentUser.uid;
            const oppId = pIds.find(id => id !== myId);
            
            if (!data.players[myId]) return;
            const me = data.players[myId];
            const opp = oppId ? data.players[oppId] : null;

            // Pot & Chips
            els.pot.innerText = data.pot || 0;
            els.pChips.innerText = me.chips;
            
            // Active player highlight
            els.pHud.classList.toggle('active', data.turn === myId);
            
            if (opp) {
                els.oChips.innerText = opp.chips;
                els.oHud.classList.toggle('active', data.turn === oppId);
                els.oppName.innerText = opp.name || 'ADVERSAIRE';
                els.oppAvatar.src = opp.avatar || `https://ui-avatars.com/api/?name=Opp`;
                
                // Dealer button
                if (me.isDealer) {
                    els.dPlayer.style.display = 'flex';
                    els.dOpp.style.display = 'none';
                } else {
                    els.dPlayer.style.display = 'none';
                    els.dOpp.style.display = 'flex';
                }
            } else {
                els.oChips.innerText = "---";
                els.gStatus.innerText = "EN ATTENTE D'UN JOUEUR...";
                els.gStatus.classList.add('pulse');
                disableControls();
                return;
            }

            // Game status text
            els.gStatus.classList.remove('pulse');
            if (data.state === 'showdown') {
                els.gStatus.innerText = "SHOWDOWN !";
            } else if (data.state === 'waiting_for_new_hand') {
                els.gStatus.innerText = "NOUVELLE MAIN...";
            } else if (data.turn === myId) {
                els.gStatus.innerText = "À VOUS DE JOUER";
                sfx.turn();
            } else {
                els.gStatus.innerText = "ADVERSAIRE RÉFLÉCHIT...";
            }

            // Render cards
            renderHands(data, me, opp, oppId);
            renderBoard(data);

            // Show opponent action bubble
            if (data.lastAction && data.lastAction.actor === oppId && data.lastAction.type !== 'new_hand' && data.lastAction.type !== 'win') {
                showBubble(data.lastAction);
            }
            
            // Winner toast
            if (data.lastAction && data.lastAction.type === 'win') {
                const winnerId = data.lastAction.actor;
                const isWin = winnerId === myId;
                els.toastTitle.innerText = isWin ? "VICTOIRE" : "DÉFAITE";
                els.toastTitle.className = `toast-title ${isWin ? 'win' : 'lose'}`;
                els.toastMsg.innerText = data.lastAction.desc || (isWin ? "Vous remportez le pot !" : "L'adversaire gagne...");
                els.toast.classList.add('show');
                if (isWin) sfx.win(); else sfx.lose();
                setTimeout(() => els.toast.classList.remove('show'), 3000);
            }

            // Update controls
            updateControls(data, me);
        }

        function renderHands(data, me, opp, oppId) {
            const currentHandId = data.handId || 0;
            const isNewHand = currentHandId !== localState.lastHandId;
            
            if (isNewHand) {
                // Clear old cards
                els.pHand.innerHTML = '';
                els.oHand.innerHTML = '';
                localState.myHandDealt = false;
                localState.oppHandDealt = false;
                localState.lastHandId = currentHandId;
            }

            // My hand
            const myHand = me.hand || [];
            if (myHand.length === 2 && !localState.myHandDealt) {
                localState.myHandDealt = true;
                myHand.forEach((card, i) => {
                    setTimeout(() => {
                        createCard(els.pHand, card, true);
                        sfx.deal();
                    }, i * 200);
                });
            }

            // Opponent hand
            const oppHand = opp?.hand || [];
            const showOpp = data.state === 'showdown' || data.state === 'waiting_for_new_hand';
            
            if (oppHand.length === 2 && !localState.oppHandDealt) {
                localState.oppHandDealt = true;
                oppHand.forEach((card, i) => {
                    setTimeout(() => {
                        createCard(els.oHand, card, showOpp);
                        sfx.deal();
                    }, i * 200 + 100);
                });
            }
            
            // Flip opponent cards on showdown
            if (showOpp && localState.oppHandDealt) {
                els.oHand.querySelectorAll('.card').forEach(c => c.classList.add('flipped'));
            }
        }

        function renderBoard(data) {
            const board = data.board || [];
            
            // Reset if new hand
            if (board.length === 0 && localState.boardLength > 0) {
                els.board.forEach(slot => slot.innerHTML = '');
                localState.boardLength = 0;
            }
            
            // Deal new community cards
            if (board.length > localState.boardLength) {
                const newCards = board.slice(localState.boardLength);
                newCards.forEach((card, i) => {
                    const idx = localState.boardLength + i;
                    setTimeout(() => {
                        createCard(els.board[idx], card, true);
                        sfx.deal();
                    }, i * 150);
                });
                localState.boardLength = board.length;
            }
        }

        function createCard(container, cardData, faceUp) {
            const el = document.createElement('div');
            el.className = 'card-slot';
            
            const card = document.createElement('div');
            card.className = 'card dealing';
            if (faceUp) card.classList.add('flipped');
            
            const colorClass = getColor(cardData.suit);
            const symbol = getSymbol(cardData.suit);
            
            card.innerHTML = `
                <div class="card-face card-front">
                    <div class="card-corner card-corner-tl ${colorClass}">
                        <span>${cardData.value}</span>
                        <span>${symbol}</span>
                    </div>
                    <div class="card-center-suit ${colorClass}">${symbol}</div>
                    <div class="card-corner card-corner-br ${colorClass}">
                        <span>${cardData.value}</span>
                        <span>${symbol}</span>
                    </div>
                </div>
                <div class="card-face card-back"></div>
            `;
            
            el.appendChild(card);
            container.appendChild(el);
            
            // Remove animation class after completion
            setTimeout(() => card.classList.remove('dealing'), 500);
        }

        function showBubble(action) {
            let text = '';
            switch(action.type) {
                case 'fold': text = 'PASSE'; sfx.fold(); break;
                case 'check': text = 'CHECK'; sfx.chip(); break;
                case 'call': text = `SUIT ${action.amount}`; sfx.chip(); break;
                case 'raise': text = `RELANCE ${action.amount}`; sfx.chip(); break;
                default: return;
            }
            
            els.oppBubble.innerText = text;
            els.oppBubble.classList.add('show');
            setTimeout(() => els.oppBubble.classList.remove('show'), 2000);
        }

        function disableControls() {
            els.controls.fold.disabled = true;
            els.controls.check.disabled = true;
            els.controls.raise.disabled = true;
            els.controls.slider.disabled = true;
        }

        function updateControls(data, me) {
            const myTurn = data.turn === currentUser.uid && 
                          data.state !== 'showdown' && 
                          data.state !== 'waiting_for_new_hand' &&
                          data.state !== 'waiting_for_player';
            
            if (!myTurn) {
                disableControls();
                return;
            }

            els.controls.fold.disabled = false;
            els.controls.slider.disabled = false;
            
            // Calculate how much we need to call
            const myCurrentBet = me.currentRoundBet || 0;
            const toCall = Math.max(0, data.currentBet - myCurrentBet);
            
            // Check/Call button
            if (toCall === 0) {
                els.controls.check.innerText = "CHECK";
                els.controls.check.disabled = false;
            } else {
                const callAmount = Math.min(toCall, me.chips);
                els.controls.check.innerText = `SUIVRE ${callAmount}`;
                els.controls.check.disabled = false;
            }
            
            // Raise button & slider
            const minRaise = Math.max(data.currentBet * 2, 100);
            const effectiveMin = Math.min(minRaise, me.chips + myCurrentBet);
            const effectiveMax = me.chips + myCurrentBet;
            
            if (me.chips > 0) {
                els.controls.raise.disabled = false;
                els.controls.slider.min = effectiveMin;
                els.controls.slider.max = effectiveMax;
                els.controls.slider.value = effectiveMin;
                els.controls.val.innerText = effectiveMin;
                els.controls.raise.innerText = `MISER ${effectiveMin}`;
            } else {
                els.controls.raise.disabled = true;
            }
        }

        // ============ CONTROL HANDLERS ============
        els.controls.fold.onclick = () => sendMove('fold');
        
        els.controls.check.onclick = () => {
            const isCall = els.controls.check.innerText.includes("SUIVRE");
            sendMove(isCall ? 'call' : 'check');
        };
        
        els.controls.raise.onclick = () => {
            const amt = parseInt(els.controls.slider.value);
            sendMove('raise', amt);
        };
        
        els.controls.slider.oninput = (e) => {
            els.controls.val.innerText = e.target.value;
            els.controls.raise.innerText = `MISER ${e.target.value}`;
        };

        // ============ SEND MOVE ============
        async function sendMove(type, amount = 0) {
            disableControls();
            const roomRef = ref(db, `poker/rooms/${gameId}`);
            
            await runTransaction(roomRef, (data) => {
                if (!data) return;
                if (data.turn !== currentUser.uid) return;
                
                const pIds = Object.keys(data.players);
                const oppId = pIds.find(id => id !== currentUser.uid);
                const me = data.players[currentUser.uid];
                const opp = data.players[oppId];
                
                const myCurrentBet = me.currentRoundBet || 0;
                const oppCurrentBet = opp.currentRoundBet || 0;

                // ========== FOLD ==========
                if (type === 'fold') {
                    data.lastAction = { type: 'fold', actor: currentUser.uid };
                    // Opponent wins the pot
                    data.players[oppId].chips += data.pot;
                    data.pot = 0;
                    data.state = 'waiting_for_new_hand';
                    data.lastAction = { type: 'win', actor: oppId, desc: 'Adversaire se couche' };
                    return data;
                }

                // ========== CHECK ==========
                if (type === 'check') {
                    data.lastAction = { type: 'check', actor: currentUser.uid };
                    
                    // Check if round ends (opponent already checked or it's postflop and we're closing)
                    const oppActed = data.lastAction?.actor === oppId;
                    
                    if (data.state === 'preflop') {
                        // In preflop, BB can check if SB just called
                        // Round ends, go to flop
                        advanceStreet(data);
                    } else {
                        // Postflop: if both checked, advance
                        // First to act checks, turn goes to opponent
                        // If opponent already checked, we advance
                        if (oppCurrentBet === 0 && myCurrentBet === 0) {
                            // We're the second to check
                            if (data.lastAction?.type === 'check' || data.lastAction?.type === 'new_street') {
                                advanceStreet(data);
                            } else {
                                data.turn = oppId;
                            }
                        } else {
                            advanceStreet(data);
                        }
                    }
                    return data;
                }

                // ========== CALL ==========
                if (type === 'call') {
                    const toCall = Math.max(0, data.currentBet - myCurrentBet);
                    const actualCall = Math.min(toCall, me.chips);
                    
                    me.chips -= actualCall;
                    me.currentRoundBet += actualCall;
                    data.pot += actualCall;
                    
                    data.lastAction = { type: 'call', actor: currentUser.uid, amount: actualCall };
                    
                    // After a call, round ends
                    advanceStreet(data);
                    return data;
                }

                // ========== RAISE ==========
                if (type === 'raise') {
                    const totalBet = Math.min(amount, me.chips + myCurrentBet);
                    const additionalChips = totalBet - myCurrentBet;
                    
                    me.chips -= additionalChips;
                    me.currentRoundBet = totalBet;
                    data.pot += additionalChips;
                    data.currentBet = totalBet;
                    
                    data.lastAction = { type: 'raise', actor: currentUser.uid, amount: totalBet };
                    data.turn = oppId;
                    return data;
                }

                return data;
            });
        }

        function advanceStreet(data) {
            const pIds = Object.keys(data.players);
            const oppId = pIds.find(id => id !== currentUser.uid);
            
            // Reset round bets
            pIds.forEach(id => {
                data.players[id].currentRoundBet = 0;
            });
            data.currentBet = 0;
            
            // Find BB player (non-dealer) - they act first postflop
            const bbPlayer = pIds.find(id => !data.players[id].isDealer);
            
            if (data.state === 'preflop') {
                data.state = 'flop';
                const flop = [data.deck.pop(), data.deck.pop(), data.deck.pop()];
                data.board = flop;
                data.turn = bbPlayer;
                data.lastAction = { type: 'new_street', street: 'flop' };
            } else if (data.state === 'flop') {
                data.state = 'turn';
                data.board.push(data.deck.pop());
                data.turn = bbPlayer;
                data.lastAction = { type: 'new_street', street: 'turn' };
            } else if (data.state === 'turn') {
                data.state = 'river';
                data.board.push(data.deck.pop());
                data.turn = bbPlayer;
                data.lastAction = { type: 'new_street', street: 'river' };
            } else if (data.state === 'river') {
                data.state = 'showdown';
                data.turn = null;
            }
        }

        // ============ SHOWDOWN ============
        async function resolveShowdown(data) {
            const pIds = Object.keys(data.players);
            
            const hands = pIds.map(id => {
                const p = data.players[id];
                const allCards = [...p.hand, ...data.board].map(c => toSolverCard(c));
                return { id: id, hand: Hand.solve(allCards) };
            });
            
            const winners = Hand.winners(hands.map(h => h.hand));
            const winnerHand = winners[0];
            const winner = hands.find(h => h.hand === winnerHand);
            
            const roomRef = ref(db, `poker/rooms/${gameId}`);
            const updates = {
                [`players/${winner.id}/chips`]: data.players[winner.id].chips + data.pot,
                pot: 0,
                state: 'waiting_for_new_hand',
                lastAction: { 
                    type: 'win', 
                    actor: winner.id, 
                    desc: winnerHand.descr 
                }
            };
            
            await update(roomRef, updates);
        }

    </script>
