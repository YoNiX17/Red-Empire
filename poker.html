<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RED EMPIRE | Cyber Poker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/pokersolver@2.1.4/pokersolver.js"></script>

    <style>
        :root {
            --neon-red: #ff2a6d;
            --neon-cyan: #05d9e8;
            --neon-purple: #9d4edd;
            --neon-gold: #f0c040;
            --dark-bg: #010a13;
            --panel-bg: rgba(5, 20, 35, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
            color: #e0e0e0;
            overflow: hidden;
            user-select: none;
            min-height: 100vh;
        }

        /* ========== BACKGROUND EFFECTS ========== */
        .cyber-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(5, 217, 232, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(5, 217, 232, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0.3;
            animation: scanMove 4s linear infinite;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes scanMove {
            0% { top: -10px; }
            100% { top: 100vh; }
        }

        /* ========== NAVBAR ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(180deg, rgba(0,10,20,0.95) 0%, rgba(0,5,15,0.9) 100%);
            border-bottom: 1px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(5, 217, 232, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .navbar::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 30px;
            height: 30px;
            background: var(--neon-red);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px var(--neon-red); }
            50% { box-shadow: 0 0 25px var(--neon-red), 0 0 40px var(--neon-red); }
        }

        .brand-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(5, 217, 232, 0.5);
        }

        .room-info {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--neon-cyan);
            opacity: 0.8;
        }

        .btn-leave {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: #666;
            background: transparent;
            border: 1px solid #333;
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .btn-leave:hover {
            color: var(--neon-red);
            border-color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.3);
        }

        /* ========== GAME LAYOUT ========== */
        .game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 60px 15px 15px;
            gap: 10px;
        }

        /* ========== OPPONENT AREA ========== */
        .opponent-area {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 10px;
            min-height: 140px;
        }

        .player-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(5, 217, 232, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .player-panel::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 12px;
            padding: 1px;
            background: linear-gradient(135deg, transparent 40%, rgba(5, 217, 232, 0.3) 50%, transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .player-panel.active {
            border-color: var(--neon-gold);
            box-shadow: 0 0 30px rgba(240, 192, 64, 0.2), inset 0 0 30px rgba(240, 192, 64, 0.05);
        }

        .player-panel.active::after {
            content: 'EN JEU';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            color: var(--neon-gold);
            background: var(--dark-bg);
            padding: 2px 10px;
            letter-spacing: 2px;
            border: 1px solid var(--neon-gold);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            border: 2px solid var(--neon-cyan);
            overflow: hidden;
            position: relative;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 50%, rgba(5, 217, 232, 0.2) 100%);
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .player-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        .player-chips {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: var(--neon-gold);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .player-chips i {
            font-size: 0.7rem;
        }

        .hand-container {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }

        .dealer-badge {
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, #fff 0%, #ccc 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 900;
            color: #111;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        .action-bubble {
            position: absolute;
            left: -90px;
            top: 50%;
            transform: translateY(-50%) scale(0.8);
            background: var(--neon-cyan);
            color: var(--dark-bg);
            padding: 6px 14px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .action-bubble.show {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        .action-bubble::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            border: 6px solid transparent;
            border-left-color: var(--neon-cyan);
        }

        /* ========== TABLE AREA ========== */
        .table-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .cyber-table {
            width: 95%;
            max-width: 800px;
            aspect-ratio: 2.5/1;
            background: 
                radial-gradient(ellipse at 50% 50%, rgba(5, 30, 50, 0.9) 0%, rgba(2, 15, 30, 0.95) 70%, rgba(0, 5, 15, 1) 100%);
            border-radius: 120px;
            position: relative;
            border: 3px solid rgba(5, 217, 232, 0.4);
            box-shadow: 
                0 0 60px rgba(5, 217, 232, 0.15),
                inset 0 0 100px rgba(0,0,0,0.5),
                inset 0 0 30px rgba(5, 217, 232, 0.05);
        }

        .cyber-table::before {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(5, 217, 232, 0.15);
            border-radius: 110px;
            pointer-events: none;
        }

        .cyber-table::after {
            content: '';
            position: absolute;
            inset: 20px;
            border: 1px dashed rgba(5, 217, 232, 0.1);
            border-radius: 100px;
            pointer-events: none;
        }

        .table-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            color: rgba(5, 217, 232, 0.08);
            text-shadow: 0 0 30px rgba(5, 217, 232, 0.1);
            pointer-events: none;
        }

        /* POT */
        .pot-display {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .pot-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 3px;
            margin-bottom: 4px;
        }

        .pot-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--neon-gold);
            text-shadow: 0 0 20px rgba(240, 192, 64, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pot-value i {
            font-size: 1.2rem;
        }

        /* COMMUNITY CARDS */
        .community-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 1px solid rgba(5, 217, 232, 0.2);
        }

        /* GAME STATUS */
        .game-status {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px var(--neon-cyan);
            white-space: nowrap;
        }

        .game-status.waiting {
            animation: pulse-text 1.5s ease-in-out infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ========== PLAYER AREA ========== */
        .player-area {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            min-height: 140px;
        }

        .my-panel {
            border-color: var(--neon-red);
        }

        .my-panel .avatar {
            border-color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.3);
        }

        .my-panel.active {
            border-color: var(--neon-gold);
        }

        /* ========== CARDS ========== */
        .card-slot {
            width: 55px;
            height: 77px;
            position: relative;
        }

        @media (min-width: 640px) {
            .card-slot { width: 65px; height: 91px; }
        }

        @media (min-width: 1024px) {
            .card-slot { width: 75px; height: 105px; }
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: default;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card.flipped:hover {
            transform: rotateY(180deg) translateY(-5px);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            overflow: hidden;
        }

        /* FUTURISTIC CARD FRONT */
        .card-front {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #0a1520 0%, #050d15 100%);
            border: 1px solid rgba(5, 217, 232, 0.5);
            box-shadow: 
                0 0 15px rgba(5, 217, 232, 0.2),
                inset 0 0 20px rgba(5, 217, 232, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-front::before {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(5, 217, 232, 0.2);
            border-radius: 6px;
            pointer-events: none;
        }

        .card-front::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: card-shine 3s ease-in-out infinite;
        }

        @keyframes card-shine {
            0%, 100% { left: -100%; }
            50% { left: 150%; }
        }

        .card-corner {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            line-height: 1;
        }

        .card-corner-tl { top: 5px; left: 6px; }
        .card-corner-br { bottom: 5px; right: 6px; transform: rotate(180deg); }

        .card-value {
            font-size: 0.9rem;
        }

        .card-suit-small {
            font-size: 0.75rem;
        }

        .card-suit-center {
            font-size: 2rem;
            filter: drop-shadow(0 0 10px currentColor);
        }

        @media (min-width: 640px) {
            .card-value { font-size: 1rem; }
            .card-suit-small { font-size: 0.85rem; }
            .card-suit-center { font-size: 2.5rem; }
        }

        .suit-red { 
            color: var(--neon-red); 
            text-shadow: 0 0 10px var(--neon-red);
        }
        
        .suit-black { 
            color: var(--neon-cyan); 
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        /* CARD BACK */
        .card-back {
            background: linear-gradient(135deg, #1a0a15 0%, #0a0510 100%);
            border: 2px solid var(--neon-red);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 42, 109, 0.3);
        }

        .card-back::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(255, 42, 109, 0.3);
            border-radius: 4px;
            background: 
                repeating-linear-gradient(
                    45deg,
                    transparent 0px,
                    transparent 8px,
                    rgba(255, 42, 109, 0.1) 8px,
                    rgba(255, 42, 109, 0.1) 16px
                );
        }

        .card-back::after {
            content: '♦';
            font-size: 1.5rem;
            color: var(--neon-red);
            text-shadow: 0 0 15px var(--neon-red);
            z-index: 1;
        }

        /* CARD ANIMATIONS */
        @keyframes dealCard {
            0% {
                opacity: 0;
                transform: translateY(-50px) rotateZ(-15deg) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotateZ(0) scale(1);
            }
        }

        .card.dealing {
            animation: dealCard 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* ========== CONTROLS ========== */
        .controls-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, rgba(0,5,15,0.95) 0%, rgba(0,10,20,0.98) 100%);
            border-top: 1px solid var(--neon-cyan);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5), 0 0 30px rgba(5, 217, 232, 0.1);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .bet-section {
            flex: 0 0 30%;
            max-width: 180px;
            padding-right: 12px;
            border-right: 1px solid rgba(5, 217, 232, 0.2);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .bet-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.65rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px;
        }

        .bet-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--neon-gold);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, rgba(5, 217, 232, 0.2) 0%, rgba(5, 217, 232, 0.4) 100%);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--neon-gold);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-gold);
            border: 2px solid #fff;
        }

        .buttons-section {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 14px 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-action:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(0.8);
        }

        .btn-action:not(:disabled):hover {
            transform: translateY(-2px);
        }

        .btn-action:not(:disabled):active {
            transform: translateY(1px);
        }

        .btn-fold {
            background: linear-gradient(135deg, #2a2a3a 0%, #1a1a25 100%);
            color: #888;
            border: 1px solid #444;
        }

        .btn-fold:not(:disabled):hover {
            border-color: #666;
            color: #aaa;
        }

        .btn-check {
            background: linear-gradient(135deg, #0a3050 0%, #051a30 100%);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(5, 217, 232, 0.2);
        }

        .btn-check:not(:disabled):hover {
            background: linear-gradient(135deg, #0a4060 0%, #052540 100%);
            box-shadow: 0 0 25px rgba(5, 217, 232, 0.4);
        }

        .btn-raise {
            background: linear-gradient(135deg, #4a1030 0%, #2a0820 100%);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.2);
        }

        .btn-raise:not(:disabled):hover {
            background: linear-gradient(135deg, #5a1540 0%, #3a0a28 100%);
            box-shadow: 0 0 25px rgba(255, 42, 109, 0.4);
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(5, 15, 25, 0.98);
            padding: 40px 60px;
            border-radius: 16px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200;
        }

        .toast.win {
            border: 2px solid var(--neon-gold);
            box-shadow: 0 0 60px rgba(240, 192, 64, 0.4);
        }

        .toast.lose {
            border: 2px solid var(--neon-red);
            box-shadow: 0 0 60px rgba(255, 42, 109, 0.4);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .toast-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .toast.win .toast-title { color: var(--neon-gold); text-shadow: 0 0 30px var(--neon-gold); }
        .toast.lose .toast-title { color: var(--neon-red); text-shadow: 0 0 30px var(--neon-red); }

        .toast-msg {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            color: #aaa;
        }

        /* ========== LOBBY ========== */
        .lobby-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 5, 15, 0.98);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
        }

        .lobby-box {

    <!-- SFX -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, dur, vol = 0.08) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }
        const sfx = {
            deal: () => { playTone(1200, 'sine', 0.06); },
            chip: () => { playTone(800, 'triangle', 0.04); setTimeout(() => playTone(1000, 'triangle', 0.03), 40); },
            turn: () => { playTone(600, 'sine', 0.1); playTone(800, 'sine', 0.1); },
            win: () => { playTone(523, 'square', 0.1); setTimeout(() => playTone(659, 'square', 0.1), 80); setTimeout(() => playTone(784, 'square', 0.15), 160); },
            lose: () => { playTone(300, 'sawtooth', 0.25); },
            fold: () => playTone(200, 'sawtooth', 0.15)
        };
    </script>

    <!-- GAME LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue, update, remove, child, runTransaction, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ========== CARD UTILITIES ==========
        const SUITS = ['s', 'h', 'c', 'd'];
        const VALUES = ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A'];
        
        const SUIT_SYMBOLS = { s: '♠', h: '♥', c: '♣', d: '♦' };
        const getSymbol = suit => SUIT_SYMBOLS[suit] || '?';
        const getColor = suit => (suit === 'h' || suit === 'd') ? 'suit-red' : 'suit-black';
        const toSolverCard = card => card.value + card.suit;

        function createDeck() {
            const cards = [];
            for (const s of SUITS) {
                for (const v of VALUES) {
                    cards.push({ suit: s, value: v, id: Math.random().toString(36).substr(2, 9) });
                }
            }
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            return cards;
        }

        // ========== STATE ==========
        let currentUser = null;
        let gameId = null;
        let isHost = false;
        let localState = {
            handId: null,
            boardLength: 0,
            myHandDealt: false,
            oppHandDealt: false
        };
        let showdownProcessed = false;

        // ========== DOM ==========
        const $ = id => document.getElementById(id);
        const els = {
            lobby: $('lobby-overlay'),
            roomInput: $('room-input'),
            btnJoin: $('btn-join'),
            lobbyStatus: $('lobby-status'),
            roomDisplay: $('room-display'),
            playerHand: $('player-hand'),
            oppHand: $('opp-hand'),
            community: [0,1,2,3,4].map(i => $(`community-${i}`)),
            pot: $('pot-display'),
            playerChips: $('player-chips'),
            oppChips: $('opp-chips'),
            gameStatus: $('game-status'),
            btnFold: $('btn-fold'),
            btnCheck: $('btn-check'),
            btnRaise: $('btn-raise'),
            slider: $('bet-slider'),
            betVal: $('bet-val-display'),
            oppBubble: $('opp-bubble'),
            dealerPlayer: $('dealer-player'),
            dealerOpp: $('dealer-opp'),
            playerHud: $('player-hud'),
            oppHud: $('opp-hud'),
            myAvatar: $('my-avatar'),
            oppAvatar: $('opp-avatar'),
            oppName: $('opp-name'),
            toast: $('toast'),
            toastTitle: $('toast-title'),
            toastMsg: $('toast-msg')
        };

        // ========== AUTH ==========
        onAuthStateChanged(auth, user => {
            if (user) {
                currentUser = user;
                els.lobbyStatus.textContent = "Connecté. Entrez un nom de table.";
                const name = user.displayName || 'Player';
                els.myAvatar.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=2a0820&color=ff2a6d`;
            } else {
                signInAnonymously(auth);
            }
        });

        // ========== JOIN GAME ==========
        els.btnJoin.onclick = async () => {
            const roomName = els.roomInput.value.trim().toUpperCase();
            if (!roomName) { els.lobbyStatus.textContent = "Entrez un nom de table !"; return; }
            if (!currentUser) { els.lobbyStatus.textContent = "Connexion..."; return; }
            els.lobbyStatus.textContent = "Connexion à la table...";
            els.btnJoin.disabled = true;
            await joinGame(roomName);
        };

        async function joinGame(roomName) {
            const roomRef = ref(db, `poker/rooms/${roomName}`);
            try {
                const snap = await get(roomRef);
                if (!snap.exists()) {
                    isHost = true;
                    await set(roomRef, {
                        created: Date.now(),
                        handId: 0,
                        players: {
                            [currentUser.uid]: {
                                chips: 5000, hand: [], isDealer: true, betThisRound: 0, hasActed: false,
                                name: currentUser.displayName || "Joueur 1",
                                avatar: els.myAvatar.src
                            }
                        },
                        board: [], pot: 0, currentBet: 0, deck: [],
                        state: 'waiting_for_player', turn: null,
                        lastAction: { type: 'create' }
                    });
                } else {
                    const data = snap.val();
                    const pIds = Object.keys(data.players || {});
                    if (pIds.includes(currentUser.uid)) {
                        isHost = pIds[0] === currentUser.uid;
                    } else if (pIds.length < 2) {
                        isHost = false;
                        await update(child(roomRef, `players/${currentUser.uid}`), {
                            chips: 5000, hand: [], isDealer: false, betThisRound: 0, hasActed: false,
                            name: currentUser.displayName || "Joueur 2",
                            avatar: els.myAvatar.src
                        });
                        await update(roomRef, { state: 'ready_to_start' });
                    } else {
                        els.lobbyStatus.textContent = "Table pleine !";
                        els.btnJoin.disabled = false;
                        return;
                    }
                }
                gameId = roomName;
                els.lobby.style.display = 'none';
                els.roomDisplay.textContent = `TABLE: ${roomName}`;
                onDisconnect(child(roomRef, `players/${currentUser.uid}`)).remove();
                startGameListener(roomRef);
            } catch (e) {
                console.error(e);
                els.lobbyStatus.textContent = "Erreur de connexion.";
                els.btnJoin.disabled = false;
            }
        }

        window.leaveMatch = async () => {
            if (!gameId || !currentUser) { location.reload(); return; }
            const roomRef = ref(db, `poker/rooms/${gameId}`);
            await remove(child(roomRef, `players/${currentUser.uid}`));
            const snap = await get(child(roomRef, 'players'));
            if (!snap.exists()) await remove(roomRef);
            location.reload();
        };

        // ========== GAME LISTENER ==========
        function startGameListener(roomRef) {
            onValue(roomRef, snap => {
                const data = snap.val();
                if (!data) { els.gameStatus.textContent = "Table fermée"; return; }
                
                const pIds = Object.keys(data.players || {});
                isHost = pIds[0] === currentUser.uid;
                
                renderGame(data);
                
                if (data.state === 'ready_to_start' && isHost) {
                    setTimeout(() => startNewHand(roomRef, data), 800);
                }
                if (data.state === 'waiting_for_new_hand' && isHost) {
                    setTimeout(() => startNewHand(roomRef, data), 3500);
                }
                if (data.state === 'showdown' && isHost && !showdownProcessed) {
                    showdownProcessed = true;
                    setTimeout(() => resolveShowdown(data), 2500);
                }
                if (data.state !== 'showdown') showdownProcessed = false;
            });
        }

        // ========== START NEW HAND ==========
        /*
         * TEXAS HOLD'EM HEADS-UP RULES:
         * - Dealer (Button) posts Small Blind
         * - Non-dealer posts Big Blind
         * - PREFLOP: Dealer acts FIRST (can fold, call, raise)
         * - POSTFLOP: Non-dealer (BB) acts FIRST
         * - Round ends when bets are equal AND both players have acted after any raise
         */
        async function startNewHand(roomRef, data) {
            const deck = createDeck();
            const pIds = Object.keys(data.players);
            if (pIds.length < 2) return;

            const [p1Id, p2Id] = pIds;
            const p1 = data.players[p1Id];
            const p2 = data.players[p2Id];
            
            // Alternate dealer each hand
            const newHandId = (data.handId || 0) + 1;
            const p1IsDealer = newHandId % 2 === 1 ? p1.isDealer : !p1.isDealer;
            
            // Deal cards
            const h1 = [deck.pop(), deck.pop()];
            const h2 = [deck.pop(), deck.pop()];
            
            // Blinds
            const SB = 50, BB = 100;
            let p1Chips = p1.chips, p2Chips = p2.chips;
            let p1Bet = 0, p2Bet = 0;
            let dealerUid, bbUid;

            if (p1IsDealer) {
                dealerUid = p1Id; bbUid = p2Id;
                p1Bet = Math.min(SB, p1Chips); p1Chips -= p1Bet;
                p2Bet = Math.min(BB, p2Chips); p2Chips -= p2Bet;
            } else {
                dealerUid = p2Id; bbUid = p1Id;
                p2Bet = Math.min(SB, p2Chips); p2Chips -= p2Bet;
                p1Bet = Math.min(BB, p1Chips); p1Chips -= p1Bet;
            }

            // Preflop: Dealer (SB) acts first
            const updates = {
                handId: newHandId,
                deck, board: [],
                pot: p1Bet + p2Bet,
                currentBet: BB,
                state: 'preflop',
                turn: dealerUid,
                lastAction: { type: 'new_hand' },
                [`players/${p1Id}/hand`]: h1,
                [`players/${p1Id}/chips`]: p1Chips,
                [`players/${p1Id}/isDealer`]: p1IsDealer,
                [`players/${p1Id}/betThisRound`]: p1Bet,
                [`players/${p1Id}/hasActed`]: false,
                [`players/${p2Id}/hand`]: h2,
                [`players/${p2Id}/chips`]: p2Chips,
                [`players/${p2Id}/isDealer`]: !p1IsDealer,
                [`players/${p2Id}/betThisRound`]: p2Bet,
                [`players/${p2Id}/hasActed`]: false
            };
            await update(roomRef, updates);
        }

        // ========== RENDER ==========
        function renderGame(data) {
            const pIds = Object.keys(data.players || {});
            const myId = currentUser.uid;
            const oppId = pIds.find(id => id !== myId);
            
            if (!data.players[myId]) return;
            const me = data.players[myId];
            const opp = oppId ? data.players[oppId] : null;

            // Display chips & pot
            els.pot.textContent = data.pot || 0;
            els.playerChips.textContent = me.chips;
            els.playerHud.classList.toggle('active', data.turn === myId);

            if (!opp) {
                els.oppChips.textContent = "---";
                els.gameStatus.textContent = "EN ATTENTE D'UN JOUEUR...";
                els.gameStatus.classList.add('waiting');
                disableControls();
                return;
            }

            els.oppChips.textContent = opp.chips;
            els.oppHud.classList.toggle('active', data.turn === oppId);
            els.oppName.textContent = opp.name || 'ADVERSAIRE';
            els.oppAvatar.src = opp.avatar || `https://ui-avatars.com/api/?name=Opp&background=051a30&color=05d9e8`;

            // Dealer badge
            els.dealerPlayer.style.display = me.isDealer ? 'flex' : 'none';
            els.dealerOpp.style.display = opp.isDealer ? 'flex' : 'none';

            // Status
            els.gameStatus.classList.remove('waiting');
            if (data.state === 'showdown') {
                els.gameStatus.textContent = "SHOWDOWN";
            } else if (data.state === 'waiting_for_new_hand') {
                els.gameStatus.textContent = "NOUVELLE MAIN...";
            } else if (data.turn === myId) {
                els.gameStatus.textContent = "À VOUS DE JOUER";
                sfx.turn();
            } else {
                els.gameStatus.textContent = "ADVERSAIRE...";
            }

            // Render cards
            const newHand = data.handId !== localState.handId;
            if (newHand) {
                els.playerHand.innerHTML = '';
                els.oppHand.innerHTML = '';
                els.community.forEach(el => el.innerHTML = '');
                localState = { handId: data.handId, boardLength: 0, myHandDealt: false, oppHandDealt: false };
            }

            const myHand = me.hand || [];
            if (myHand.length === 2 && !localState.myHandDealt) {
                localState.myHandDealt = true;
                myHand.forEach((c, i) => setTimeout(() => { createCard(els.playerHand, c, true); sfx.deal(); }, i * 150));
            }

            const oppHand = opp.hand || [];
            const showOpp = data.state === 'showdown' || data.state === 'waiting_for_new_hand';
            if (oppHand.length === 2 && !localState.oppHandDealt) {
                localState.oppHandDealt = true;
                oppHand.forEach((c, i) => setTimeout(() => { createCard(els.oppHand, c, showOpp); sfx.deal(); }, i * 150 + 100));
            }
            if (showOpp) els.oppHand.querySelectorAll('.card').forEach(c => c.classList.add('flipped'));

            const board = data.board || [];
            if (board.length > localState.boardLength) {
                board.slice(localState.boardLength).forEach((c, i) => {
                    setTimeout(() => { createCard(els.community[localState.boardLength + i], c, true); sfx.deal(); }, i * 120);
                });
                localState.boardLength = board.length;
            }

            // Opponent bubble
            if (data.lastAction && data.lastAction.actor === oppId && !['new_hand', 'win', 'new_street'].includes(data.lastAction.type)) {
                showBubble(data.lastAction);
            }

            // Winner toast
            if (data.lastAction?.type === 'win') {
                const isWin = data.lastAction.actor === myId;
                els.toast.className = `toast ${isWin ? 'win' : 'lose'} show`;
                els.toastTitle.textContent = isWin ? "VICTOIRE" : "DÉFAITE";
                els.toastMsg.textContent = data.lastAction.desc || '';
                if (isWin) sfx.win(); else sfx.lose();
                setTimeout(() => els.toast.classList.remove('show'), 3500);
            }

            updateControls(data, me);
        }

        function createCard(container, cardData, faceUp) {
            const slot = document.createElement('div');
            slot.className = 'card-slot';
            
            const card = document.createElement('div');
            card.className = `card dealing${faceUp ? ' flipped' : ''}`;
            
            const color = getColor(cardData.suit);
            const symbol = getSymbol(cardData.suit);
            
            card.innerHTML = `
                <div class="card-face card-front">
                    <div class="card-corner card-corner-tl ${color}">
                        <span class="card-value">${cardData.value}</span>
                        <span class="card-suit-small">${symbol}</span>
                    </div>
                    <div class="card-suit-center ${color}">${symbol}</div>
                    <div class="card-corner card-corner-br ${color}">
                        <span class="card-value">${cardData.value}</span>
                        <span class="card-suit-small">${symbol}</span>
                    </div>
                </div>
                <div class="card-face card-back"></div>
            `;
            
            slot.appendChild(card);
            container.appendChild(slot);
            setTimeout(() => card.classList.remove('dealing'), 400);
        }

        function showBubble(action) {
            const texts = { fold: 'PASSE', check: 'CHECK', call: `SUIT ${action.amount || ''}`, raise: `RELANCE ${action.amount || ''}` };
            const text = texts[action.type];
            if (!text) return;
            if (action.type === 'fold') sfx.fold(); else sfx.chip();
            els.oppBubble.textContent = text;
            els.oppBubble.classList.add('show');
            setTimeout(() => els.oppBubble.classList.remove('show'), 2000);
        }

        function disableControls() {
            els.btnFold.disabled = els.btnCheck.disabled = els.btnRaise.disabled = els.slider.disabled = true;
        }

        function updateControls(data, me) {
            const myTurn = data.turn === currentUser.uid && !['showdown', 'waiting_for_new_hand', 'waiting_for_player'].includes(data.state);
            if (!myTurn) { disableControls(); return; }

            els.btnFold.disabled = false;
            els.slider.disabled = false;

            const myBet = me.betThisRound || 0;
            const toCall = Math.max(0, data.currentBet - myBet);

            if (toCall === 0) {
                els.btnCheck.textContent = "CHECK";
            } else {
                els.btnCheck.textContent = `SUIVRE ${Math.min(toCall, me.chips)}`;
            }
            els.btnCheck.disabled = false;

            // Raise
            const minRaise = Math.max(data.currentBet * 2, 100);
            const maxBet = me.chips + myBet;
            
            if (me.chips > toCall) {
                els.btnRaise.disabled = false;
                els.slider.min = Math.min(minRaise, maxBet);
                els.slider.max = maxBet;
                els.slider.value = els.slider.min;
                els.betVal.textContent = els.slider.value;
                els.btnRaise.textContent = `MISER ${els.slider.value}`;
            } else {
                els.btnRaise.disabled = true;
            }
        }

        // ========== CONTROLS ==========
        els.btnFold.onclick = () => sendMove('fold');
        els.btnCheck.onclick = () => sendMove(els.btnCheck.textContent.includes('SUIVRE') ? 'call' : 'check');
        els.btnRaise.onclick = () => sendMove('raise', parseInt(els.slider.value));
        els.slider.oninput = e => {
            els.betVal.textContent = e.target.value;
            els.btnRaise.textContent = `MISER ${e.target.value}`;
        };

        // ========== SEND MOVE ==========
        async function sendMove(type, amount = 0) {
            disableControls();
            const roomRef = ref(db, `poker/rooms/${gameId}`);
            
            await runTransaction(roomRef, data => {
                if (!data || data.turn !== currentUser.uid) return;
                
                const pIds = Object.keys(data.players);
                const oppId = pIds.find(id => id !== currentUser.uid);
                const me = data.players[currentUser.uid];
                const opp = data.players[oppId];

                // FOLD
                if (type === 'fold') {
                    data.players[oppId].chips += data.pot;
                    data.pot = 0;
                    data.state = 'waiting_for_new_hand';
                    data.lastAction = { type: 'win', actor: oppId, desc: 'Adversaire se couche' };
                    return data;
                }

                // CHECK
                if (type === 'check') {
                    me.hasActed = true;
                    data.lastAction = { type: 'check', actor: currentUser.uid };
                    
                    // If both have acted and bets equal -> advance
                    if (opp.hasActed && me.betThisRound === opp.betThisRound) {
                        advanceStreet(data);
                    } else {
                        data.turn = oppId;
                    }
                    return data;
                }

                // CALL
                if (type === 'call') {
                    const toCall = Math.min(data.currentBet - me.betThisRound, me.chips);
                    me.chips -= toCall;
                    me.betThisRound += toCall;
                    data.pot += toCall;
                    me.hasActed = true;
                    data.lastAction = { type: 'call', actor: currentUser.uid, amount: toCall };
                    
                    // After call, if bets equal and opp acted -> advance
                    if (me.betThisRound === opp.betThisRound) {
                        advanceStreet(data);
                    } else {
                        data.turn = oppId;
                    }
                    return data;
                }

                // RAISE
                if (type === 'raise') {
                    const totalBet = Math.min(amount, me.chips + me.betThisRound);
                    const additional = totalBet - me.betThisRound;
                    me.chips -= additional;
                    me.betThisRound = totalBet;
                    data.pot += additional;
                    data.currentBet = totalBet;
                    me.hasActed = true;
                    opp.hasActed = false; // Opponent must act again after raise
                    data.lastAction = { type: 'raise', actor: currentUser.uid, amount: totalBet };
                    data.turn = oppId;
                    return data;
                }

                return data;
            });
        }

        function advanceStreet(data) {
            const pIds = Object.keys(data.players);
            const bbUid = pIds.find(id => !data.players[id].isDealer);

            // Reset for new street
            pIds.forEach(id => {
                data.players[id].betThisRound = 0;
                data.players[id].hasActed = false;
            });
            data.currentBet = 0;

            const streets = ['preflop', 'flop', 'turn', 'river'];
            const idx = streets.indexOf(data.state);

            if (data.state === 'preflop') {
                data.state = 'flop';
                data.board = [data.deck.pop(), data.deck.pop(), data.deck.pop()];
            } else if (data.state === 'flop') {
                data.state = 'turn';
                data.board.push(data.deck.pop());
            } else if (data.state === 'turn') {
                data.state = 'river';
                data.board.push(data.deck.pop());
            } else {
                data.state = 'showdown';
                data.turn = null;
                data.lastAction = { type: 'showdown' };
                return;
            }

            // Postflop: BB acts first
            data.turn = bbUid;
            data.lastAction = { type: 'new_street', street: data.state };
        }

        // ========== SHOWDOWN ==========
        async function resolveShowdown(data) {
            const pIds = Object.keys(data.players);
            const hands = pIds.map(id => {
                const cards = [...data.players[id].hand, ...data.board].map(toSolverCard);
                return { id, solved: Hand.solve(cards) };
            });
            
            const winners = Hand.winners(hands.map(h => h.solved));
            const winner = hands.find(h => h.solved === winners[0]);

            await update(ref(db, `poker/rooms/${gameId}`), {
                [`players/${winner.id}/chips`]: data.players[winner.id].chips + data.pot,
                pot: 0,
                state: 'waiting_for_new_hand',
                lastAction: { type: 'win', actor: winner.id, desc: winner.solved.descr }
            });
        }
    </script>
