    <style>
        :root {
            --gold: #fbbf24;
            --gold-dark: #b45309;
            --dark-bg: #0f0f0f;
            --panel-bg: #141414;
            --text-main: #eeeeee;
            --border-color: #fbbf24;
        }

        body { 
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Roboto Condensed', sans-serif;
            overflow: hidden;
            background-image: radial-gradient(#333 10%, transparent 10%);
            background-size: 20px 20px;
        }
        
        .font-manga { font-family: 'Bangers', cursive; letter-spacing: 1.5px; }

        .manga-panel {
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            box-shadow: 8px 8px 0px var(--gold-dark);
            position: relative;
            overflow: hidden;
        }
        
        .speed-lines::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(251, 191, 36, 0.05) 10px, rgba(251, 191, 36, 0.05) 20px);
            pointer-events: none;
        }

        .btn-pop {
            background: #222;
            color: var(--gold);
            font-family: 'Bangers', cursive;
            text-transform: uppercase;
            border: 2px solid var(--gold);
            transition: all 0.1s ease;
            box-shadow: 4px 4px 0px var(--gold-dark);
        }
        .btn-pop:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--gold-dark);
            background: var(--gold);
            color: black;
        }
        .btn-pop:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px; }
        .btn-pop:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        
        .timer-container { width: 100%; height: 12px; background: #333; border: 2px solid white; border-radius: 99px; overflow: hidden; }
        .timer-fill { height: 100%; background: var(--gold); width: 100%; }
        .timer-running { animation: shrink linear forwards; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .disk-spin { animation: spin 3s linear infinite; }
        .disk-paused { animation-play-state: paused !important; }

        .input-manga {
            border: 3px solid var(--border-color);
            background: #222;
            color: white;
            font-family: 'Bangers', cursive;
            letter-spacing: 1px;
            box-shadow: inset 4px 4px 0px #000;
        }
        .input-manga:focus { outline: none; border-color: white; color: white; }

        .loader-ring { display: inline-block; width: 64px; height: 64px; }
        .loader-ring:after {
            content: " "; display: block; width: 46px; height: 46px; margin: 8px; border-radius: 50%;
            border: 5px solid #fff; border-color: var(--gold) transparent var(--gold) transparent;
            animation: loader-ring 1.2s linear infinite;
        }
        @keyframes loader-ring { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .vs-text { text-shadow: 4px 4px 0px #000; animation: pulse-vs 1s infinite alternate; }
        @keyframes pulse-vs { from { transform: scale(1); } to { transform: scale(1.1); } }
        
        .points-popup {
            position: absolute;
            z-index: 100;
            animation: floatUp 1.5s ease-out forwards;
            pointer-events: none;
            text-shadow: 2px 2px 0 #000;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -20px) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -100px) scale(1); opacity: 0; }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue, update, remove, push, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { OP_DATABASE } from "./op_database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const RANKED_SETTINGS = { duration: 20, rounds: 15, suddenDeath: false, teamCount: 2 };

        let currentUser = null;
        let currentRoomId = null;
        let isHost = false;
        let roundTimer = null;
        let matchmakingTimeout = null;
        
        let animeFound = false, songFound = false, opFound = false;
        let currentSongData = null;
        let lastPhase = '';
        let lastStartTime = 0;
        let onPlayListener = null;
        let userVolume = 0.5;
        let hasTriggeredStart = false;

        const videoEl = document.getElementById('game-video');
        const diskEl = document.getElementById('disk');

        // Volume
        const savedVol = localStorage.getItem('userVolume');
        if(savedVol) userVolume = parseFloat(savedVol);
        document.getElementById('volume-slider').value = userVolume;
        window.updateVolume = (val) => { userVolume = val; localStorage.setItem('userVolume', val); if(videoEl) videoEl.volume = userVolume; }

        // Auth & Start
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                get(child(ref(db), `users/${user.uid}`)).then(snapshot => {
                    if (snapshot.exists() && snapshot.val().username) document.querySelector('#user-badge span:last-child').innerText = snapshot.val().username;
                    else document.querySelector('#user-badge span:last-child').innerText = user.displayName;
                    findMatch();
                });
            } else { window.location.href = "index.html"; }
        });

        // Utils
        function shuffleArray(array) {
            let i = array.length, r;
            while (i != 0) { r = Math.floor(Math.random() * i); i--; [array[i], array[r]] = [array[r], array[i]]; }
            return array;
        }

        function isCloseMatch(input, target) {
            if (!target) return false;
            const nI = input.toLowerCase().trim(); const nT = target.toLowerCase().trim();
            if (nI === nT) return true; if (nT.includes(nI) && nI.length > 3) return true; 
            
            // Levenshtein basic
            if(nI.length === 0) return false;
            var m = []; for(var i = 0; i <= nT.length; i++) m[i] = [i]; for(var j = 0; j <= nI.length; j++) m[0][j] = j;
            for(var i = 1; i <= nT.length; i++) for(var j = 1; j <= nI.length; j++) {
                m[i][j] = (nT.charAt(i-1) == nI.charAt(j-1)) ? m[i-1][j-1] : Math.min(m[i-1][j-1]+1, Math.min(m[i][j-1]+1, m[i-1][j]+1));
            }
            const dist = m[nT.length][nI.length];
            return (1 - dist/Math.max(nI.length, nT.length)) > 0.75; 
        }

        async function getUserProfile(uid) {
            try { const snap = await get(child(ref(db), `users/${uid}`)); if(snap.exists()) return { name: snap.val().username || currentUser.displayName, avatar: snap.val().avatar || currentUser.photoURL }; } catch(e){}
            return { name: currentUser.displayName, avatar: currentUser.photoURL };
        }

        // MATCHMAKING
        window.findMatch = async () => {
            const roomsRef = ref(db, 'blindtest/rooms');
            const snapshot = await get(roomsRef);
            let joined = false;

            if (snapshot.exists()) {
                const rooms = snapshot.val();
                for (const [key, room] of Object.entries(rooms)) {
                    if (room.type === 'ranked_1v1' && room.status === 'lobby' && room.players && Object.keys(room.players).length < 2) {
                        await joinRoom(key);
                        joined = true;
                        break;
                    }
                }
            }
            if (!joined) await createRoom();
        };

        async function createRoom() {
            const code = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoomId = code;
            isHost = true;
            const profile = await getUserProfile(currentUser.uid);
            const deck = shuffleArray(Array.from({length: OP_DATABASE.length}, (_, i) => i));

            await set(ref(db, `blindtest/rooms/${code}`), {
                host: currentUser.uid,
                createdAt: Date.now(),
                status: 'lobby',
                type: 'ranked_1v1',
                players: { [currentUser.uid]: { name: profile.name, team: 1, score: 0, avatar: profile.avatar } },
                gameState: { currentRound: 0, songIndex: 0, startTime: 0, phase: 'lobby', deck: deck, seekTime: 0 }
            });
            enterLobby(code);
        }

        async function joinRoom(code) {
            currentRoomId = code;
            isHost = false;
            const profile = await getUserProfile(currentUser.uid);
            await update(ref(db, `blindtest/rooms/${code}/players/${currentUser.uid}`), { 
                name: profile.name, team: 2, score: 0, avatar: profile.avatar 
            });
            enterLobby(code);
        }

        function enterLobby(code) {
            document.getElementById('screen-lobby').classList.remove('hidden');
            document.getElementById('lobby-code').innerText = code;

            // Timeout 2min safety
            if (matchmakingTimeout) clearTimeout(matchmakingTimeout);
            matchmakingTimeout = setTimeout(() => {
                get(ref(db, `blindtest/rooms/${code}`)).then(snap => {
                    if(snap.exists() && snap.val().status === 'lobby' && Object.keys(snap.val().players).length < 2) {
                        if(isHost) remove(ref(db, `blindtest/rooms/${code}`));
                        alert("Aucun adversaire trouvé. Réessayez.");
                        window.location.href = "blindtest_ranked.html";
                    }
                });
            }, 120000);

            onValue(ref(db, `blindtest/rooms/${code}`), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const players = Object.values(data.players || {});
                updateLobbyDisplay(players);

                if (data.status === 'lobby' && players.length === 2) {
                    if (matchmakingTimeout) clearTimeout(matchmakingTimeout);
                    document.getElementById('lobby-status').innerText = "ADVERSAIRE TROUVÉ !";
                    document.getElementById('lobby-status').classList.add('text-green-500');
                    document.getElementById('lobby-info').innerText = "Lancement imminent...";
                    
                    if (isHost && !hasTriggeredStart) {
                        hasTriggeredStart = true;
                        setTimeout(() => startGame(data.gameState.deck), 3000);
                    }
                } else if (data.status === 'playing') {
                    document.getElementById('screen-lobby').classList.add('hidden');
                    document.getElementById('screen-game').classList.remove('hidden');
                    handleGameSync(data.gameState, data.players);
                }
            });
        }

        function updateLobbyDisplay(players) {
            const p1 = players.find(p => p.team === 1);
            const p2 = players.find(p => p.team === 2);
            if(p1) {
                document.getElementById('lobby-p1-img').src = p1.avatar || 'https://ui-avatars.com/api/?name='+p1.name;
                document.getElementById('lobby-p1-img').classList.remove('opacity-50');
                document.getElementById('lobby-p1-name').innerText = p1.name;
            }
            if(p2) {
                document.getElementById('lobby-p2-img').src = p2.avatar || 'https://ui-avatars.com/api/?name='+p2.name;
                document.getElementById('lobby-p2-img').classList.remove('hidden');
                document.getElementById('lobby-p2-placeholder').classList.add('hidden');
                document.getElementById('lobby-p2-name').innerText = p2.name;
                document.getElementById('lobby-p2-name').classList.replace('bg-gray-800', 'bg-red-600');
                document.getElementById('lobby-p2-name').classList.remove('text-gray-500');
                document.getElementById('lobby-p2-name').classList.add('text-white');
            }
        }

        window.startGame = (deck) => {
            const firstIndex = deck[0];
            const seek = Math.floor(Math.random() * 11) + 40;
            update(ref(db, `blindtest/rooms/${currentRoomId}`), {
                status: 'playing',
                gameState: { currentRound: 1, songIndex: firstIndex, startTime: Date.now() + 3000, phase: 'guessing', deck: deck, seekTime: seek }
            });
        };

        // --- MOTEUR DE JEU ---
        function handleGameSync(gameState, players) {
            const p1 = Object.values(players).find(p => p.team === 1);
            const p2 = Object.values(players).find(p => p.team === 2);
            if(p1) { document.getElementById('score-p1').innerText = p1.score; document.getElementById('game-p1-name').innerText = p1.name; }
            if(p2) { document.getElementById('score-p2').innerText = p2.score; document.getElementById('game-p2-name').innerText = p2.name; }

            if (gameState.phase === lastPhase && gameState.startTime === lastStartTime) return;
            if (isHost) clearTimeout(roundTimer);
            lastPhase = gameState.phase;
            lastStartTime = gameState.startTime;
            
            currentSongData = OP_DATABASE[gameState.songIndex];
            document.getElementById('current-round-display').innerText = gameState.currentRound;

            if (gameState.phase === 'guessing') {
                // RESET
                animeFound = false; songFound = false; opFound = false;
                document.getElementById('status-anime').classList.add('hidden');
                document.getElementById('status-song').classList.add('hidden');
                document.getElementById('status-op').classList.add('hidden');
                document.getElementById('result-display').classList.add('hidden');
                document.getElementById('video-wrapper').classList.add('hidden');
                document.getElementById('vinyl-wrapper').classList.remove('hidden');
                document.getElementById('input-guess').value = "";
                document.getElementById('input-guess').disabled = false;
                document.getElementById('input-guess').focus();
                document.getElementById('loader-overlay').classList.remove('hidden');

                const bar = document.getElementById('game-timer-bar');
                bar.classList.remove('timer-running');
                bar.style.width = '100%';
                diskEl.classList.add('disk-paused');

                if(onPlayListener) { videoEl.removeEventListener('playing', onPlayListener); onPlayListener = null; }

                videoEl.src = currentSongData.url;
                videoEl.currentTime = gameState.seekTime || 0;
                videoEl.volume = userVolume;

                onPlayListener = () => {
                    document.getElementById('loader-overlay').classList.add('hidden');
                    diskEl.classList.remove('disk-paused');
                    bar.style.animationDuration = RANKED_SETTINGS.duration + 's';
                    bar.classList.add('timer-running');

                    if (isHost) {
                        clearTimeout(roundTimer);
                        roundTimer = setTimeout(() => {
                            update(ref(db, `blindtest/rooms/${currentRoomId}/gameState`), { phase: 'reveal', startTime: Date.now() });
                        }, RANKED_SETTINGS.duration * 1000);
                    }
                };
                videoEl.addEventListener('playing', onPlayListener, { once: true });
                videoEl.play().catch(e => {});
                
                if(isHost) { videoEl.onerror = () => onPlayListener(); }

            } else if (gameState.phase === 'reveal') {
                document.getElementById('loader-overlay').classList.add('hidden');
                document.getElementById('result-display').classList.remove('hidden');
                document.getElementById('res-anime').innerText = currentSongData.anime;
                document.getElementById('res-song').innerText = currentSongData.song;
                document.getElementById('res-op-num').innerText = "OP " + (currentSongData.num || "?");
                document.getElementById('video-wrapper').classList.remove('hidden');
                document.getElementById('vinyl-wrapper').classList.add('hidden');
                diskEl.classList.add('disk-paused');
                document.getElementById('input-guess').disabled = true;

                if (isHost) {
                    setTimeout(() => {
                        if (gameState.currentRound >= RANKED_SETTINGS.rounds) {
                            update(ref(db, `blindtest/rooms/${currentRoomId}/gameState`), { phase: 'finished' });
                        } else {
                            const nextIndex = gameState.deck[gameState.currentRound];
                            const nextSeek = Math.floor(Math.random() * 11) + 40;
                            update(ref(db, `blindtest/rooms/${currentRoomId}/gameState`), {
                                currentRound: gameState.currentRound + 1,
                                songIndex: nextIndex,
                                startTime: Date.now(),
                                phase: 'guessing',
                                seekTime: nextSeek
                            });
                        }
                    }, 8000);
                }
            } else if (gameState.phase === 'finished') {
                showEndScreen(players);
            }
        }

        function showEndScreen(players) {
            document.getElementById('screen-game').classList.add('blur-md');
            document.getElementById('screen-end').classList.remove('hidden');
            
            const p1 = Object.values(players).find(p => p.team === 1) || {score:0};
            const p2 = Object.values(players).find(p => p.team === 2) || {score:0};
            document.getElementById('end-score-p1').innerText = p1.score;
            document.getElementById('end-score-p2').innerText = p2.score;
            
            const myTeam = Object.values(players).find(p => p.name === (currentUser.displayName || "Joueur"))?.team;
            const myScore = myTeam === 1 ? p1.score : p2.score;
            const oppScore = myTeam === 1 ? p2.score : p1.score;
            
            const title = document.getElementById('end-title');
            if (myScore > oppScore) { title.innerText = "VICTOIRE !"; title.classList.add('text-green-500'); }
            else if (myScore < oppScore) { title.innerText = "DÉFAITE..."; title.classList.add('text-red-500'); }
            else { title.innerText = "ÉGALITÉ"; title.classList.add('text-white'); }
        }

        window.submitGuess = () => {
            if (!currentSongData || document.getElementById('input-guess').disabled) return;
            const input = document.getElementById('input-guess');
            const guess = input.value;
            if (!guess) return;

            let pointsEarned = 0;
            if (!animeFound) {
                let match = isCloseMatch(guess, currentSongData.anime);
                if (!match && currentSongData.alt) for(let a of currentSongData.alt) if(isCloseMatch(guess, a)) match=true;
                if (match) { animeFound=true; pointsEarned+=1; document.getElementById('status-anime').classList.remove('hidden'); }
            }
            if (!songFound && isCloseMatch(guess, currentSongData.song)) { songFound=true; pointsEarned+=1; document.getElementById('status-song').classList.remove('hidden'); }
            if (!opFound && currentSongData.num) {
                const nums = guess.match(/\d+/g);
                if (nums && nums.includes(currentSongData.num.toString())) { opFound=true; pointsEarned+=0.5; document.getElementById('status-op').classList.remove('hidden'); }
            }
            
            if(pointsEarned > 0) {
                get(ref(db, `blindtest/rooms/${currentRoomId}/players/${currentUser.uid}/score`)).then((snap) => {
                    update(ref(db, `blindtest/rooms/${currentRoomId}/players/${currentUser.uid}`), { score: (snap.val()||0) + pointsEarned });
                });
                const popup = document.createElement('div');
                popup.className = 'points-popup text-4xl text-yellow-400 font-bold fixed z-50 animate-bounce';
                popup.style.left='50%'; popup.style.top='40%'; popup.style.transform='translate(-50%, -50%)';
                popup.innerText = `+${pointsEarned}`; document.body.appendChild(popup); setTimeout(()=>popup.remove(), 1000);
            }
            input.value = "";
        };
    </script>
</body>
</html>
