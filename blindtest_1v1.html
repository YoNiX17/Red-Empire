<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 DUEL | Red Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --red: #ff2e2e; --dark-bg: #050505; }
        body { background-color: var(--dark-bg); color: #fff; font-family: 'Roboto Condensed', sans-serif; overflow: hidden; }
        .font-manga { font-family: 'Bangers', cursive; letter-spacing: 1.5px; }
        
        /* VS Screen Overlay */
        #vs-screen {
            position: fixed; inset: 0; z-index: 100; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.5s cubic-bezier(0.7, 0, 0.3, 1);
        }
        .vs-slide-up { transform: translateY(-100%); }
        
        /* Player Cards */
        .player-card { background: #111; border: 2px solid #333; padding: 10px; display: flex; align-items: center; gap: 10px; min-width: 200px; transition: all 0.3s; }
        .player-card.active { border-color: #ff2e2e; box-shadow: 0 0 15px rgba(255, 46, 46, 0.3); }
        
        /* Result Pop */
        @keyframes pop-in { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .pop-anim { animation: pop-in 0.4s ease-out forwards; }

        /* Loading Spinner */
        .loader { width: 48px; height: 48px; border: 5px solid #FFF; border-bottom-color: #ff2e2e; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- ECRAN DE MATCHMAKING / VS -->
    <div id="vs-screen">
        <!-- ETAPE 1 : RECHERCHE -->
        <div id="matchmaking-ui" class="text-center">
            <div class="loader mb-6"></div>
            <h1 class="text-4xl font-manga text-white mb-2 animate-pulse">RECHERCHE D'ADVERSAIRE...</h1>
            <p class="text-gray-500 font-mono text-sm">NE QUITTEZ PAS LA PAGE</p>
            <button onclick="window.location.href='blindtest_ranked.html'" class="mt-8 text-red-500 border border-red-500 px-4 py-1 rounded hover:bg-red-500 hover:text-white transition text-xs font-bold">ANNULER</button>
        </div>

        <!-- ETAPE 2 : VERSUS (Données chargées) -->
        <div id="game-ready-ui" class="hidden text-center w-full max-w-4xl">
            <h1 class="text-6xl font-manga text-yellow-500 mb-12">DUEL TROUVÉ</h1>
            <div class="flex items-center justify-center gap-12 md:gap-32">
                <!-- J1 -->
                <div class="text-center transform transition hover:scale-110">
                    <img id="p1-avatar" src="" class="w-32 h-32 rounded-full border-4 border-blue-500 mb-4 shadow-[0_0_30px_#3b82f6] object-cover bg-gray-900">
                    <h2 id="p1-name" class="font-black text-2xl text-blue-400 uppercase">...</h2>
                </div>
                <div class="text-6xl font-black italic text-white animate-pulse">VS</div>
                <!-- J2 -->
                <div class="text-center transform transition hover:scale-110">
                    <img id="p2-avatar" src="" class="w-32 h-32 rounded-full border-4 border-red-600 mb-4 shadow-[0_0_30px_#dc2626] object-cover bg-gray-900">
                    <h2 id="p2-name" class="font-black text-2xl text-red-500 uppercase">...</h2>
                </div>
            </div>
            <p id="countdown-text" class="mt-12 text-white font-mono text-xl">DÉMARRAGE DANS <span id="start-timer" class="text-yellow-500 font-bold text-3xl">...</span></p>
        </div>
    </div>

    <!-- HUD JEU -->
    <div class="absolute top-0 w-full flex justify-between p-4 z-20">
        <div id="hud-p1" class="player-card border-blue-600 rounded-r-xl">
            <span id="score-p1" class="text-4xl font-manga text-blue-500">0</span>
            <div class="flex flex-col">
                <span class="font-black text-sm uppercase" id="name-p1">J1</span>
                <span class="text-[10px] text-gray-500">CHALLENGER</span>
            </div>
        </div>
        
        <div class="flex flex-col items-center">
            <div class="bg-black px-6 py-2 border-2 border-white rounded-lg font-manga text-2xl shadow-[0_0_20px_rgba(255,255,255,0.2)] transform skew-x-[-10deg]">
                ROUND <span id="round-display" class="text-yellow-500">1</span> / 15
            </div>
            <div class="w-80 h-3 bg-gray-800 mt-2 rounded-full overflow-hidden border border-gray-600">
                <div id="timer-fill" class="h-full bg-gradient-to-r from-green-500 to-red-500 w-full"></div>
            </div>
        </div>

        <div id="hud-p2" class="player-card border-red-600 flex-row-reverse text-right rounded-l-xl">
            <span id="score-p2" class="text-4xl font-manga text-red-500">0</span>
            <div class="flex flex-col">
                <span class="font-black text-sm uppercase" id="name-p2">J2</span>
                <span class="text-[10px] text-gray-500">CHALLENGER</span>
            </div>
        </div>
    </div>

    <!-- ZONE VINYLE -->
    <div class="h-screen flex items-center justify-center relative">
        <div id="vinyl-container" class="relative w-80 h-80 animate-spin-slow transition-all duration-500">
            <div class="absolute inset-0 bg-black rounded-full border-[10px] border-gray-800 flex items-center justify-center shadow-[0_0_80px_rgba(255,255,255,0.1)]">
                <div class="absolute inset-0 rounded-full border border-white/10"></div>
                <div class="w-32 h-32 bg-gradient-to-br from-red-600 to-red-900 rounded-full flex items-center justify-center border-4 border-white z-10">
                    <i class="fa-solid fa-music text-5xl text-white drop-shadow-md"></i>
                </div>
            </div>
        </div>
        
        <div id="video-container" class="absolute inset-0 bg-black z-10 hidden flex items-center justify-center">
            <video id="game-video" class="w-full h-full object-contain max-w-5xl"></video>
            <div class="absolute bottom-32 text-center bg-black/90 px-10 py-6 rounded-xl border-2 border-yellow-500 shadow-[0_0_50px_rgba(234,179,8,0.4)]">
                <h2 id="reveal-anime" class="text-5xl font-manga text-white mb-2 text-shadow-lg">ANIME</h2>
                <p id="reveal-song" class="text-yellow-400 font-bold text-xl uppercase tracking-widest">Song</p>
            </div>
        </div>
    </div>

    <!-- INPUT -->
    <div class="absolute bottom-0 w-full p-8 bg-gradient-to-t from-black via-black/90 to-transparent z-30 flex justify-center pb-12">
        <div class="relative w-full max-w-2xl">
            <input type="text" id="input-guess" class="w-full bg-gray-900/80 border-2 border-white/30 text-white p-5 text-center text-2xl font-bold uppercase tracking-widest rounded-lg shadow-2xl focus:border-yellow-500 focus:bg-black outline-none transition-all" placeholder="ÉCOUTEZ ET DEVINEZ..." autocomplete="off" autofocus>
            <div id="feedback-msg" class="absolute -top-24 left-0 right-0 text-center font-manga text-6xl text-green-400 drop-shadow-[0_0_10px_rgba(74,222,128,0.8)] pop-anim hidden">CORRECT !</div>
        </div>
    </div>

    <audio id="game-audio" style="display:none;"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue, update, remove, runTransaction, child, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { OP_DATABASE } from "./op_database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let roomId = null;
        let isHost = false;
        let currentSong = null;
        let roundTimer = null;
        let hasGuessed = false;
        let countdownInterval = null;

        // --- UTILS ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function isCloseMatch(input, target) {
            if (!target) return false;
            const clean = str => str.toLowerCase().replace(/[^a-z0-9]/g, "");
            const a = clean(input);
            const b = clean(target);
            if (a === b) return true;
            if (b.includes(a) && a.length > 3) return true;
            return false;
        }

        // --- MATCHMAKING ---
        auth.onAuthStateChanged(async (user) => {
            if (!user) return window.location.href = 'index.html';
            currentUser = user;
            startMatchmaking();
        });

        async function startMatchmaking() {
            const queueRef = ref(db, 'blindtest/queue_1v1');
            
            // Transaction pour gérer l'accès concurrentiel
            const result = await runTransaction(queueRef, (currentData) => {
                if (currentData === null) {
                    // Personne ? On s'inscrit (On devient J1)
                    return { uid: currentUser.uid, roomId: Math.random().toString(36).substr(2, 9) };
                } else if (currentData.uid !== currentUser.uid) {
                    // Quelqu'un est là ? On "réserve" sa room
                    return currentData; // On ne touche pas, on lit juste (lecture via snapshot après)
                }
                return currentData;
            });

            if (result.committed) {
                const val = result.snapshot.val();

                if (val && val.uid === currentUser.uid) {
                    // --- CAS 1 : ON EST HÔTE (J1) ---
                    roomId = val.roomId;
                    isHost = true;
                    
                    // On crée la salle immédiatement
                    const profile = await getUserProfile(currentUser.uid);
                    await set(ref(db, `blindtest/rooms/${roomId}`), {
                        host: currentUser.uid,
                        players: { [currentUser.uid]: { ...profile, team: 1, score: 0 } },
                        status: 'waiting', // Attente de J2
                        settings: { rounds: 15, duration: 15 }
                    });

                    // On écoute la salle pour voir quand J2 arrive
                    listenToRoom();

                    // Sécurité déconnexion
                    onDisconnect(queueRef).remove();
                    onDisconnect(ref(db, `blindtest/rooms/${roomId}`)).remove();

                } else if (val) {
                    // --- CAS 2 : ON EST INVITÉ (J2) ---
                    // On a trouvé quelqu'un (val contient les infos de J1)
                    roomId = val.roomId;
                    isHost = false;

                    // On supprime la file d'attente pour dire "C'est pris"
                    // ATTENTION : On ne supprime que si c'est bien l'ID qu'on a vu
                    // Pour éviter les conflits, on tente de rejoindre la salle direct.
                    // Mais on doit nettoyer la queue.
                    await remove(queueRef); 

                    const profile = await getUserProfile(currentUser.uid);
                    
                    // On s'ajoute dans la salle de J1
                    await update(ref(db, `blindtest/rooms/${roomId}/players/${currentUser.uid}`), {
                        ...profile, team: 2, score: 0
                    });

                    listenToRoom();
                }
            }
        }

        async function getUserProfile(uid) {
            try {
                const s = await get(child(ref(db), `users/${uid}`));
                if(s.exists()) return { name: s.val().username || "Joueur", avatar: s.val().avatar || "" };
            } catch(e){}
            return { name: currentUser.displayName, avatar: currentUser.photoURL };
        }

        // --- SYNCHRONISATION DE LA SALLE ---
        function listenToRoom() {
            const roomRef = ref(db, `blindtest/rooms/${roomId}`);
            
            onValue(roomRef, (snap) => {
                const data = snap.val();
                if (!data) return; // Salle détruite

                // 1. Mise à jour de l'interface des joueurs
                if (data.players) {
                    const players = Object.values(data.players);
                    
                    // Si on a 2 joueurs, on prépare l'écran VS
                    if (players.length === 2) {
                        // On remplit les infos
                        const p1 = players.find(p => p.team === 1);
                        const p2 = players.find(p => p.team === 2);
                        
                        if (p1 && p2) {
                            document.getElementById('matchmaking-ui').classList.add('hidden');
                            document.getElementById('game-ready-ui').classList.remove('hidden');
                            
                            // VS Screen Info
                            document.getElementById('p1-name').innerText = p1.name;
                            document.getElementById('p1-avatar').src = p1.avatar || 'https://ui-avatars.com/api/?name='+p1.name;
                            document.getElementById('p2-name').innerText = p2.name;
                            document.getElementById('p2-avatar').src = p2.avatar || 'https://ui-avatars.com/api/?name='+p2.name;
                            
                            // HUD Info
                            document.getElementById('name-p1').innerText = p1.name;
                            document.getElementById('score-p1').innerText = p1.score;
                            document.getElementById('name-p2').innerText = p2.name;
                            document.getElementById('score-p2').innerText = p2.score;

                            // LOGIQUE DE DÉPART (Host Only)
                            // Si on est encore en "waiting", l'hôte lance le compte à rebours GLOBAL
                            if (isHost && data.status === 'waiting') {
                                // On définit une heure de départ dans le futur (5s)
                                const launchTime = Date.now() + 5000; 
                                update(ref(db, `blindtest/rooms/${roomId}`), {
                                    status: 'starting',
                                    launchTime: launchTime
                                });
                            }
                        }
                    }
                }

                // 2. Gestion du Compte à Rebours (SYNCHRONISÉ)
                if (data.status === 'starting' && data.launchTime) {
                    const now = Date.now();
                    const diff = Math.ceil((data.launchTime - now) / 1000);
                    
                    if (diff > 0) {
                        document.getElementById('start-timer').innerText = diff;
                    } else {
                        document.getElementById('start-timer').innerText = "GO !";
                        // Quand le temps est écoulé, l'hôte initialise le jeu
                        if (isHost && !data.gameState) {
                            const deck = shuffleArray(Array.from({length: OP_DATABASE.length}, (_, i) => i));
                            update(ref(db, `blindtest/rooms/${roomId}`), {
                                status: 'playing',
                                gameState: {
                                    phase: 'guessing',
                                    currentRound: 1,
                                    songIndex: deck[0],
                                    startTime: Date.now(), // Temps référence
                                    deck: deck,
                                    seekTime: Math.floor(Math.random() * 11) + 40
                                }
                            });
                        }
                    }
                }

                // 3. Gestion du Jeu (Playing)
                if (data.status === 'playing' && data.gameState) {
                    handleGameState(data.gameState);
                }
            });
        }

        // --- BOUCLE DE JEU ---
        let lastPhase = '';
        let lastTime = 0;

        function handleGameState(state) {
            // Cacher l'écran VS
            document.getElementById('vs-screen').classList.add('vs-slide-up');

            // Vérification changement d'état
            if (state.phase === lastPhase && state.startTime === lastTime) return;
            lastPhase = state.phase;
            lastTime = state.startTime;

            currentSong = OP_DATABASE[state.songIndex];
            document.getElementById('round-display').innerText = state.currentRound;

            const audio = document.getElementById('game-audio');
            const video = document.getElementById('game-video');
            const input = document.getElementById('input-guess');
            const timerBar = document.getElementById('timer-fill');

            if (state.phase === 'guessing') {
                // --- PHASE DEVINER ---
                document.getElementById('video-container').classList.add('hidden');
                document.getElementById('vinyl-container').classList.remove('hidden');
                
                input.disabled = false;
                input.value = "";
                input.focus();
                hasGuessed = false;
                document.getElementById('feedback-msg').classList.add('hidden');

                audio.src = currentSong.url;
                audio.currentTime = state.seekTime;
                audio.volume = 0.5;
                
                // Sync Audio : Si on arrive en retard, on cale l'audio
                const elapsed = (Date.now() - state.startTime) / 1000;
                if (elapsed > 0) audio.currentTime += elapsed;
                
                audio.play().catch(e => console.log("Autoplay blocked"));

                // Sync Timer Visuel
                timerBar.style.transition = 'none';
                timerBar.style.width = '100%';
                // Petit délai pour laisser le CSS prendre en compte le reset
                setTimeout(() => {
                    // On calcule combien de temps il reste sur les 15s
                    const remaining = Math.max(0, 15 - elapsed);
                    timerBar.style.transition = `width ${remaining}s linear`;
                    timerBar.style.width = '0%';
                }, 50);

                // HOST : Gère la fin du timer
                if (isHost) {
                    clearTimeout(roundTimer);
                    // On lance le timeout basé sur le temps réel restant
                    const remainingMs = Math.max(0, 15000 - (Date.now() - state.startTime));
                    roundTimer = setTimeout(() => {
                        update(ref(db, `blindtest/rooms/${roomId}/gameState`), { phase: 'reveal', startTime: Date.now() });
                    }, remainingMs);
                }

            } else if (state.phase === 'reveal') {
                // --- PHASE RÉPONSE ---
                audio.pause();
                document.getElementById('vinyl-container').classList.add('hidden');
                document.getElementById('video-container').classList.remove('hidden');
                
                video.src = currentSong.url;
                video.currentTime = state.seekTime;
                video.volume = 0.5;
                video.play();

                document.getElementById('reveal-anime').innerText = currentSong.anime;
                document.getElementById('reveal-song').innerText = currentSong.song;
                
                input.disabled = true;

                // HOST : Gère le round suivant
                if (isHost) {
                    clearTimeout(roundTimer);
                    setTimeout(() => {
                        if (state.currentRound >= 15) {
                            // Fin de partie -> Retour menu
                            // Idéalement écran de fin, ici simple alert
                            alert("Match terminé !");
                            window.location.href = "blindtest_ranked.html";
                        } else {
                            const nextIdx = state.deck[state.currentRound];
                            update(ref(db, `blindtest/rooms/${roomId}/gameState`), {
                                phase: 'guessing',
                                currentRound: state.currentRound + 1,
                                songIndex: nextIdx,
                                startTime: Date.now(),
                                seekTime: Math.floor(Math.random() * 11) + 40
                            });
                        }
                    }, 8000); // 8s de reveal
                }
            }
        }

        // --- INPUT LOGIC ---
        document.getElementById('input-guess').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !hasGuessed) {
                const val = e.target.value;
                if (!val) return;

                let correct = isCloseMatch(val, currentSong.anime);
                if (!correct && currentSong.alt) {
                    currentSong.alt.forEach(a => { if (isCloseMatch(val, a)) correct = true; });
                }

                if (correct) {
                    hasGuessed = true;
                    document.getElementById('feedback-msg').classList.remove('hidden');
                    
                    // Update Score
                    get(ref(db, `blindtest/rooms/${roomId}/players/${currentUser.uid}/score`)).then(s => {
                        update(ref(db, `blindtest/rooms/${roomId}/players/${currentUser.uid}`), { score: (s.val()||0) + 1 });
                    });

                    // MORT SUBITE : On déclenche le reveal pour tout le monde
                    // On utilise runTransaction sur le gameState pour éviter les conflits si les 2 trouvent en même temps
                    // Mais pour la vitesse, un update direct est souvent acceptable ici
                    update(ref(db, `blindtest/rooms/${roomId}/gameState`), { phase: 'reveal', startTime: Date.now() });
                } else {
                    e.target.classList.add('border-red-500');
                    setTimeout(() => e.target.classList.remove('border-red-500'), 500);
                }
            }
        });

    </script>
</body>
</html>
