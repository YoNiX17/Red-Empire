<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranked Duel 1v1 | Red Empire (DEBUG)</title>
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon"> 
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            mode: 'jit',
            theme: { extend: { colors: { gold: '#fbbf24', 'gold-dark': '#b45309' } } }
        }
    </script>

    <style>
        :root { --gold: #fbbf24; --dark-bg: #0f0f0f; --panel-bg: #141414; }
        body { background-color: var(--dark-bg); color: #eee; font-family: 'Roboto Condensed', sans-serif; overflow: hidden; }
        .font-manga { font-family: 'Bangers', cursive; letter-spacing: 1.5px; }
        .manga-panel { background: var(--panel-bg); border: 3px solid var(--gold); box-shadow: 8px 8px 0px #b45309; }
        .btn-pop { background: #222; color: var(--gold); font-family: 'Bangers', cursive; border: 2px solid var(--gold); box-shadow: 4px 4px 0px #b45309; transition: 0.1s; }
        .btn-pop:active { transform: translate(2px, 2px); box-shadow: 0 0 0; }
        .btn-pop:disabled { opacity: 0.5; filter: grayscale(1); }
        .timer-container { width: 100%; height: 12px; background: #333; border: 2px solid white; border-radius: 99px; overflow: hidden; }
        .timer-fill { height: 100%; background: var(--gold); width: 100%; }
        .timer-running { animation: shrink linear forwards; }
        @keyframes shrink { from { width: 100%; } to { width: 0%; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .disk-spin { animation: spin 3s linear infinite; }
        .disk-paused { animation-play-state: paused !important; }
        .input-manga { border: 3px solid var(--gold); background: #222; color: white; font-family: 'Bangers'; letter-spacing: 1px; }
        .input-manga:focus { outline: none; border-color: white; }
        
        /* DEBUG CONSOLE STYLE */
        #debug-console {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 150px;
            background: rgba(0,0,0,0.9); color: #00ff00; font-family: monospace; font-size: 10px;
            overflow-y: auto; z-index: 9999; padding: 10px; border-top: 2px solid #00ff00;
            pointer-events: none; opacity: 0.8;
        }
        .log-entry { margin-bottom: 2px; border-bottom: 1px solid #003300; }
        .log-time { color: #888; margin-right: 5px; }
        .log-warn { color: yellow; }
        .log-err { color: red; font-weight: bold; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- DEBUG CONSOLE -->
    <div id="debug-console">
        <div class="log-entry">--- DEBUG LOG STARTED ---</div>
    </div>

    <nav class="h-16 bg-black border-b-4 border-yellow-500 flex items-center justify-between px-6 z-50 shadow-lg">
        <a href="blindtest_ranked.html" class="flex items-center gap-2 font-bold text-gray-400 hover:text-white">
            <i class="fa-solid fa-chevron-left"></i> <span class="font-manga text-xl">QUITTER</span>
        </a>
        <div class="absolute left-1/2 transform -translate-x-1/2 bg-yellow-500 text-black px-8 py-1 skew-x-[-15deg] border-2 border-white">
            <h1 class="font-manga text-2xl skew-x-[15deg]">RANKED <span class="text-white drop-shadow-md">DUEL</span></h1>
        </div>
        <div id="user-badge" class="flex items-center gap-2 bg-gray-900 px-4 py-1 rounded-full border border-yellow-500/50">
            <span class="text-yellow-500 text-xs font-bold mr-1">MMR: 1200</span>
            <span class="text-sm font-bold text-white truncate max-w-[100px]">Joueur</span>
        </div>
    </nav>

    <!-- MENU -->
    <div id="screen-menu" class="flex-grow flex items-center justify-center p-4 relative">
        <div class="manga-panel p-8 max-w-md w-full text-center z-10">
            <h2 class="text-5xl font-manga text-white mb-2">DUEL 1v1</h2>
            <div class="space-y-4 mt-8">
                <button onclick="createRoom()" class="btn-pop w-full py-4 text-2xl rounded-lg bg-yellow-600 text-black border-black">CRÉER</button>
                <div class="flex gap-3">
                    <input type="text" id="input-room-code" placeholder="CODE" class="input-manga w-32 text-center text-2xl rounded-lg text-yellow-500">
                    <button onclick="joinRoom()" class="btn-pop flex-1 rounded-lg text-xl border-gray-500 text-gray-300">REJOINDRE</button>
                </div>
            </div>
        </div>
    </div>

    <!-- LOBBY -->
    <div id="screen-lobby" class="hidden flex-grow flex flex-col p-6 gap-6 relative z-10">
        <div class="bg-black/50 p-4 rounded border border-yellow-500/30 text-center">
            <span class="bg-yellow-500 text-black px-4 py-2 font-manga text-2xl rounded">CODE: <span id="lobby-code">----</span></span>
        </div>
        <div class="flex-grow flex items-center justify-center relative gap-8">
            <!-- P1 -->
            <div id="slot-p1" class="w-1/3 max-w-sm manga-panel p-6 flex flex-col items-center bg-blue-900/10 border-blue-500">
                <div class="text-blue-500 font-manga text-2xl mb-4">P1 (HÔTE)</div>
                <h2 id="p1-name" class="text-3xl font-manga text-white">...</h2>
            </div>
            <div class="text-7xl font-manga text-yellow-500">VS</div>
            <!-- P2 -->
            <div id="slot-p2" class="w-1/3 max-w-sm manga-panel p-6 flex flex-col items-center bg-red-900/10 border-red-500 opacity-50">
                <div class="text-red-500 font-manga text-2xl mb-4">P2 (INVITÉ)</div>
                <h2 id="p2-name" class="text-3xl font-manga text-white">RECHERCHE...</h2>
            </div>
        </div>
        <div class="h-20 flex items-center justify-center">
            <div id="host-controls" class="hidden w-full max-w-lg">
                <button id="btn-start" onclick="startGame()" disabled class="btn-pop w-full py-4 text-2xl rounded-lg bg-green-600 text-white">EN ATTENTE...</button>
            </div>
            <div id="guest-controls" class="hidden"><p class="text-yellow-500 font-manga text-xl animate-pulse">PRÊT AU COMBAT...</p></div>
        </div>
    </div>

    <!-- GAME -->
    <div id="screen-game" class="hidden relative flex-grow flex flex-col bg-[#0f0f0f]">
        <!-- Scoreboard -->
        <div class="bg-black border-b-4 border-yellow-500 p-2 flex justify-between items-center px-4 relative z-30">
            <div class="bg-blue-600 text-white font-manga text-3xl px-4 py-1 rounded border-2 border-white" id="score-p1">0</div>
            <div class="flex flex-col items-center w-1/3">
                 <div class="bg-yellow-500 text-black font-bold px-3 rounded-full text-xs mb-1">ROUND <span id="current-round-display">1</span>/15</div>
                 <div class="timer-container w-full max-w-[200px]"><div id="game-timer-bar" class="timer-fill"></div></div>
            </div>
            <div class="bg-red-600 text-white font-manga text-3xl px-4 py-1 rounded border-2 border-white" id="score-p2">0</div>
        </div>

        <!-- Main Area -->
        <div class="flex-grow flex flex-col items-center justify-center relative overflow-hidden p-4">
            <div id="loader-overlay" class="hidden absolute inset-0 z-40 flex flex-col items-center justify-center bg-black/80">
                <div class="loader-ring"></div>
                <p class="text-yellow-500 font-manga mt-4">CHARGEMENT...</p>
            </div>

            <!-- Video (Hidden until reveal) -->
            <div id="video-wrapper" class="absolute inset-0 z-10 flex items-center justify-center bg-black/95 hidden">
                <video id="game-video" class="w-full h-full object-contain" playsinline preload="auto"></video>
            </div>

            <!-- Vinyl -->
            <div id="vinyl-wrapper" class="relative z-20 flex flex-col items-center">
                <div class="w-64 h-64 rounded-full bg-[#111] border-[6px] border-yellow-500 shadow-2xl flex items-center justify-center disk-spin disk-paused" id="disk">
                    <div class="absolute w-28 h-28 bg-yellow-600 rounded-full border-4 border-white"></div>
                </div>
                <div id="status-indicators" class="flex gap-2 mt-8">
                    <div id="status-anime" class="hidden bg-green-600 text-white px-2 py-1 rounded text-xs font-bold">ANIME OK</div>
                    <div id="status-song" class="hidden bg-yellow-500 text-black px-2 py-1 rounded text-xs font-bold">TITRE OK</div>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="bg-[#141414] border-t-4 border-yellow-500 p-6 relative z-30">
            <!-- Result Overlay -->
            <div id="result-display" class="hidden absolute inset-x-0 bottom-full mb-8 z-50 flex justify-center pointer-events-none px-4">
                <div class="bg-yellow-500 border-4 border-white p-4 max-w-xl w-full text-center shadow-lg rotate-1">
                    <h2 id="res-anime" class="text-3xl font-manga text-black mb-1">ANIME</h2>
                    <p id="res-song" class="text-white bg-black text-lg font-bold inline-block px-2">SONG</p>
                </div>
            </div>

            <div class="max-w-3xl mx-auto flex gap-3">
                <input type="text" id="input-guess" placeholder="RÉPONSE..." class="input-manga flex-1 h-16 px-6 text-2xl uppercase rounded-lg" onkeydown="if(event.key === 'Enter') submitGuess()">
                <button onclick="submitGuess()" class="btn-pop w-32 rounded-lg text-xl bg-yellow-600 text-black">GO</button>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue, update, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { OP_DATABASE } from "./op_database.js";

        // --- DEBUGGER ---
        function logDebug(msg, type="info") {
            const consoleDiv = document.getElementById('debug-console');
            const entry = document.createElement('div');
            entry.className = "log-entry " + (type === "error" ? "log-err" : type === "warn" ? "log-warn" : "");
            const time = new Date().toLocaleTimeString().split(' ')[0];
            entry.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(`[DEBUG] ${msg}`);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const RANKED_SETTINGS = { duration: 20, rounds: 15 };

        let currentUser = null;
        let currentRoomId = null;
        let isHost = false;
        let roundTimer = null;
        
        let animeFound = false, songFound = false, opFound = false;
        let currentSongData = null;
        let localPhase = '';
        let localStartTime = 0;

        const videoEl = document.getElementById('game-video');
        const diskEl = document.getElementById('disk');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                logDebug("User logged in: " + user.uid);
                document.querySelector('#user-badge span:last-child').innerText = user.displayName;
            } else {
                window.location.href = "index.html";
            }
        });

        // --- GAME LOGIC ---

        window.createRoom = async () => {
            const roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoomId = roomCode;
            isHost = true;
            
            // Génération d'un Deck Fixe
            const allIndices = Array.from({length: OP_DATABASE.length}, (_, i) => i);
            const deck = shuffleArray(allIndices);
            logDebug(`Creating room ${roomCode} with Deck size: ${deck.length}`);

            const roomData = {
                host: currentUser.uid,
                createdAt: Date.now(),
                status: 'lobby',
                type: 'ranked_1v1',
                settings: RANKED_SETTINGS,
                players: { [currentUser.uid]: { name: currentUser.displayName, team: 1, score: 0 } },
                gameState: { 
                    currentRound: 0, 
                    songIndex: 0, 
                    startTime: 0, 
                    phase: 'lobby', 
                    deck: deck, // Le deck est sauvegardé DANS la DB
                    seekTime: 0 
                }
            };
            await set(ref(db, `blindtest/rooms/${roomCode}`), roomData);
            enterLobby(roomCode);
        };

        window.joinRoom = async () => {
            const code = document.getElementById('input-room-code').value.toUpperCase();
            const roomRef = ref(db, `blindtest/rooms/${code}`);
            const snapshot = await get(roomRef);
            if (snapshot.exists()) {
                currentRoomId = code;
                isHost = false;
                await update(ref(db, `blindtest/rooms/${code}/players/${currentUser.uid}`), { name: currentUser.displayName, team: 2, score: 0 });
                enterLobby(code);
            } else { alert("Salle introuvable"); }
        };

        function enterLobby(code) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-lobby').classList.remove('hidden');
            document.getElementById('lobby-code').innerText = code;
            logDebug("Entered Lobby: " + code);

            if(isHost) {
                document.getElementById('host-controls').classList.remove('hidden');
                document.getElementById('guest-controls').classList.add('hidden');
            } else {
                document.getElementById('host-controls').classList.add('hidden');
                document.getElementById('guest-controls').classList.remove('hidden');
            }

            onValue(ref(db, `blindtest/rooms/${code}`), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                updateLobbyUI(data.players);

                if (data.status === 'playing') {
                    if (document.getElementById('screen-game').classList.contains('hidden')) {
                        document.getElementById('screen-lobby').classList.add('hidden');
                        document.getElementById('screen-game').classList.remove('hidden');
                        logDebug("Game Started! Switching screen.");
                    }
                    handleGameSync(data.gameState, data.players);
                }
            });
        }

        function updateLobbyUI(players) {
            const p2Slot = document.getElementById('slot-p2');
            const p2Name = document.getElementById('p2-name');
            
            let p1 = Object.values(players).find(p => p.team === 1);
            let p2 = Object.values(players).find(p => p.team === 2);

            if(p1) document.getElementById('p1-name').innerText = p1.name;
            
            if(p2) {
                p2Slot.classList.remove('opacity-50');
                p2Name.innerText = p2.name;
                if(isHost) {
                    document.getElementById('btn-start').disabled = false;
                    document.getElementById('btn-start').innerText = "LANCER LE DUEL";
                }
            } else {
                p2Slot.classList.add('opacity-50');
                p2Name.innerText = "RECHERCHE...";
            }
        }

        window.startGame = () => {
            // Au démarrage, on prend le premier index du deck
            get(ref(db, `blindtest/rooms/${currentRoomId}/gameState/deck`)).then(snap => {
                const deck = snap.val();
                if(!deck) return logDebug("CRITICAL: Deck missing in DB", "error");
                
                const firstIndex = deck[0];
                const seek = Math.floor(Math.random() * 11) + 40;
                
                logDebug(`Host Starting Game. Round 1. Song Index: ${firstIndex}`);

                update(ref(db, `blindtest/rooms/${currentRoomId}`), {
                    status: 'playing',
                    gameState: {
                        currentRound: 1,
                        songIndex: firstIndex,
                        startTime: Date.now() + 3000, // 3s de buffer global
                        phase: 'guessing',
                        deck: deck, // On garde le deck
                        seekTime: seek
                    }
                });
            });
        };

        // --- SYNC ENGINE ---

        function handleGameSync(gameState, players) {
            // Score update
            let p1 = Object.values(players).find(p => p.team === 1);
            let p2 = Object.values(players).find(p => p.team === 2);
            if(p1) document.getElementById('score-p1').innerText = p1.score;
            if(p2) document.getElementById('score-p2').innerText = p2.score;

            // Anti-loop check
            if (gameState.phase === localPhase && gameState.startTime === localStartTime) return;
            
            logDebug(`SYNC RECEIVED: Round ${gameState.currentRound} | Phase: ${gameState.phase} | SongIdx: ${gameState.songIndex}`);
            
            if (isHost) clearTimeout(roundTimer);
            localPhase = gameState.phase;
            localStartTime = gameState.startTime;
            
            document.getElementById('current-round-display').innerText = gameState.currentRound;
            currentSongData = OP_DATABASE[gameState.songIndex];

            if (!currentSongData) {
                logDebug(`ERROR: No song data for index ${gameState.songIndex}`, "error");
                return;
            }

            if (gameState.phase === 'guessing') {
                startGuessingPhase(gameState);
            } else if (gameState.phase === 'reveal') {
                startRevealPhase(gameState);
            }
        }

        function startGuessingPhase(gameState) {
            // Reset UI
            resetUI();
            document.getElementById('loader-overlay').classList.remove('hidden');
            
            const targetSeek = gameState.seekTime || 0;
            logDebug(`Loading video: ${currentSongData.anime} (Seek: ${targetSeek}s)`);

            // 1. HARD RESET VIDEO
            videoEl.oncanplay = null;
            videoEl.onloadedmetadata = null;
            videoEl.pause();
            videoEl.removeAttribute('src'); // Important pour clean le buffer
            videoEl.load();

            // 2. LOAD NEW SOURCE
            videoEl.src = currentSongData.url;
            videoEl.volume = 0.5;

            // 3. WAIT FOR METADATA (Durée connue)
            videoEl.onloadedmetadata = () => {
                logDebug("Video Metadata loaded. Setting time...");
                videoEl.currentTime = targetSeek;
            };

            // 4. WAIT FOR ENOUGH DATA (Ready to play)
            videoEl.oncanplay = () => {
                logDebug("Video Can Play. Trying to start...");
                const p = videoEl.play();
                if (p) {
                    p.then(() => {
                        logDebug("Video Playing successfully!");
                        syncVisuals();
                    }).catch(e => {
                        logDebug("Play blocked (Browser policy?): " + e.message, "warn");
                        // Fallback: on force l'utilisateur à interagir ou on retente
                        syncVisuals(); // On lance quand même le timer visuel
                    });
                }
            };

            // Sécurité: Si ça bloque trop longtemps
            videoEl.onerror = (e) => {
                logDebug("Video Error: " + videoEl.error.message, "error");
            };
        }

        function syncVisuals() {
            document.getElementById('loader-overlay').classList.add('hidden');
            diskEl.classList.remove('disk-paused');
            
            const bar = document.getElementById('game-timer-bar');
            bar.classList.remove('timer-running');
            void bar.offsetWidth; // Trigger Reflow
            bar.style.animationDuration = RANKED_SETTINGS.duration + 's';
            bar.classList.add('timer-running');

            document.getElementById('input-guess').focus();

            if (isHost) {
                logDebug("Host Timer Started for next round");
                clearTimeout(roundTimer);
                roundTimer = setTimeout(() => {
                    logDebug("Time's up! Switching to Reveal.");
                    update(ref(db, `blindtest/rooms/${currentRoomId}/gameState`), { 
                        phase: 'reveal', 
                        startTime: Date.now() 
                    });
                }, RANKED_SETTINGS.duration * 1000);
            }
        }

        function startRevealPhase(gameState) {
            logDebug("Phase Reveal Started");
            document.getElementById('loader-overlay').classList.add('hidden');
            document.getElementById('video-wrapper').classList.remove('hidden');
            document.getElementById('vinyl-wrapper').classList.add('hidden');
            document.getElementById('result-display').classList.remove('hidden');
            
            document.getElementById('res-anime').innerText = currentSongData.anime;
            document.getElementById('res-song').innerText = currentSongData.song;
            
            document.getElementById('input-guess').disabled = true;
            diskEl.classList.add('disk-paused');

            if (isHost) {
                setTimeout(() => {
                    const nextRound = gameState.currentRound + 1;
                    if (nextRound > RANKED_SETTINGS.rounds) {
                        logDebug("Game Finished");
                        // Logic fin
                        return;
                    }

                    // CRUCIAL: Récupérer le bon index du deck
                    // deck[0] = Round 1, deck[1] = Round 2...
                    // Index tableau = nextRound - 1
                    const nextSongIndex = gameState.deck[nextRound - 1]; 
                    const nextSeek = Math.floor(Math.random() * 11) + 40;

                    logDebug(`Preparing Round ${nextRound}. Song Index from Deck: ${nextSongIndex}`);

                    if (nextSongIndex === undefined) {
                        logDebug("ERROR: Next song index is UNDEFINED. Deck exhausted?", "error");
                        return;
                    }

                    update(ref(db, `blindtest/rooms/${currentRoomId}/gameState`), {
                        currentRound: nextRound,
                        songIndex: nextSongIndex, // C'est ici que ça change !
                        startTime: Date.now(),
                        phase: 'guessing',
                        seekTime: nextSeek
                    });

                }, 8000);
            }
        }

        function resetUI() {
            animeFound = false; songFound = false; opFound = false;
            document.getElementById('status-anime').classList.add('hidden');
            document.getElementById('status-song').classList.add('hidden');
            document.getElementById('video-wrapper').classList.add('hidden');
            document.getElementById('vinyl-wrapper').classList.remove('hidden');
            document.getElementById('result-display').classList.add('hidden');
            document.getElementById('input-guess').value = "";
            document.getElementById('input-guess').disabled = false;
            const bar = document.getElementById('game-timer-bar');
            bar.classList.remove('timer-running');
            bar.style.width = '100%';
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Algorithmes de réponse (Levenshtein) inchangés...
        function levenshtein(a, b) {
            if(a.length == 0) return b.length; 
            if(b.length == 0) return a.length; 
            var matrix = [];
            for(var i = 0; i <= b.length; i++){ matrix[i] = [i]; }
            for(var j = 0; j <= a.length; j++){ matrix[0][j] = j; }
            for(var i = 1; i <= b.length; i++){
                for(var j = 1; j <= a.length; j++){
                    if(b.charAt(i-1) == a.charAt(j-1)){ matrix[i][j] = matrix[i-1][j-1]; } 
                    else { matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, Math.min(matrix[i][j-1] + 1, matrix[i-1][j] + 1)); }
                }
            }
            return matrix[b.length][a.length];
        }

        function isCloseMatch(input, target) {
            if (!target) return false;
            const normInput = input.toLowerCase().trim();
            const normTarget = target.toLowerCase().trim();
            if (normInput === normTarget) return true;
            if (normTarget.includes(normInput) && normInput.length > 3) return true; 
            const distance = levenshtein(normInput, normTarget);
            const maxLength = Math.max(normInput.length, normTarget.length);
            const similarity = 1 - (distance / maxLength);
            return similarity > 0.75; 
        }

        window.submitGuess = () => {
            if (!currentSongData || document.getElementById('input-guess').disabled) return;
            const input = document.getElementById('input-guess');
            const guess = input.value;
            if (!guess) return;

            logDebug(`Guess submitted: ${guess}`);

            let pointsEarned = 0;
            if (!animeFound) {
                let matchAnime = isCloseMatch(guess, currentSongData.anime);
                if (!matchAnime && currentSongData.alt) {
                    for (let alias of currentSongData.alt) { if (isCloseMatch(guess, alias)) { matchAnime = true; break; } }
                }
                if (matchAnime) {
                    animeFound = true; pointsEarned += 1;
                    document.getElementById('status-anime').classList.remove('hidden');
                    logDebug("Anime Found!");
                }
            }
            
            if(pointsEarned > 0) {
                get(ref(db, `blindtest/rooms/${currentRoomId}/players/${currentUser.uid}/score`)).then((snap) => {
                    const currentScore = snap.val() || 0;
                    update(ref(db, `blindtest/rooms/${currentRoomId}/players/${currentUser.uid}`), { score: currentScore + pointsEarned });
                });
            }
            input.value = "";
        };

    </script>
</body>
</html>
