<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 DUEL | Red Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --red: #ff2e2e; --dark-bg: #050505; }
        body { background-color: var(--dark-bg); color: #fff; font-family: 'Roboto Condensed', sans-serif; overflow: hidden; }
        .font-manga { font-family: 'Bangers', cursive; letter-spacing: 1.5px; }
        
        /* VS Screen Overlay */
        #vs-screen {
            position: fixed; inset: 0; z-index: 100; background: #000;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.5s cubic-bezier(0.7, 0, 0.3, 1);
        }
        .vs-slide-up { transform: translateY(-100%); }
        
        /* Timer */
        .timer-bar { height: 8px; background: #ff2e2e; width: 100%; transition: width 1s linear; }
        
        /* Player Cards */
        .player-card { background: #111; border: 2px solid #333; padding: 10px; display: flex; align-items: center; gap: 10px; min-width: 200px; }
        .player-card.active { border-color: #ff2e2e; box-shadow: 0 0 15px rgba(255, 46, 46, 0.3); }
        
        /* Result Pop */
        @keyframes pop-in { 0% { transform: scale(0); } 80% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .pop-anim { animation: pop-in 0.4s ease-out forwards; }
    </style>
</head>
<body>

    <!-- ECRAN DE CHARGEMENT / VS -->
    <div id="vs-screen">
        <div class="text-center">
            <h1 class="text-6xl font-manga text-yellow-500 mb-8">DUEL 1v1</h1>
            <div class="flex items-center gap-12">
                <div class="text-center">
                    <img id="p1-avatar" src="" class="w-24 h-24 rounded-full border-4 border-blue-600 mb-2">
                    <h2 id="p1-name" class="font-bold text-xl">...</h2>
                </div>
                <div class="text-4xl font-black italic text-red-600">VS</div>
                <div class="text-center">
                    <img id="p2-avatar" src="" class="w-24 h-24 rounded-full border-4 border-red-600 mb-2">
                    <h2 id="p2-name" class="font-bold text-xl">...</h2>
                </div>
            </div>
            <p id="status-text" class="mt-8 text-gray-500 font-mono animate-pulse">CONNEXION...</p>
        </div>
    </div>

    <!-- HUD DU HAUT -->
    <div class="absolute top-0 w-full flex justify-between p-4 z-20">
        <div id="hud-p1" class="player-card border-blue-600">
            <span id="score-p1" class="text-3xl font-manga text-blue-500">0</span>
            <span class="font-bold text-sm" id="name-p1">J1</span>
        </div>
        
        <div class="flex flex-col items-center">
            <div class="bg-black px-4 py-1 border border-gray-700 rounded font-manga text-xl">
                ROUND <span id="round-display" class="text-yellow-500">1</span> / 15
            </div>
            <div class="w-64 h-2 bg-gray-800 mt-1 rounded overflow-hidden">
                <div id="timer-fill" class="h-full bg-yellow-500 w-full"></div>
            </div>
        </div>

        <div id="hud-p2" class="player-card border-red-600 flex-row-reverse text-right">
            <span id="score-p2" class="text-3xl font-manga text-red-500">0</span>
            <span class="font-bold text-sm" id="name-p2">J2</span>
        </div>
    </div>

    <!-- ZONE DE JEU (VIDEO & DISQUE) -->
    <div class="h-screen flex items-center justify-center relative">
        
        <!-- Disque (Mode Guessing) -->
        <div id="vinyl-container" class="relative w-64 h-64 animate-spin-slow">
            <div class="absolute inset-0 bg-black rounded-full border-8 border-gray-800 flex items-center justify-center shadow-[0_0_50px_rgba(255,0,0,0.2)]">
                <div class="w-24 h-24 bg-red-600 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-music text-4xl"></i>
                </div>
            </div>
        </div>

        <!-- Video (Mode Reveal) -->
        <div id="video-container" class="absolute inset-0 bg-black z-10 hidden flex items-center justify-center">
            <video id="game-video" class="max-w-full max-h-full"></video>
            <div class="absolute bottom-20 text-center bg-black/80 p-4 rounded border border-yellow-500">
                <h2 id="reveal-anime" class="text-3xl font-manga text-white">ANIME</h2>
                <p id="reveal-song" class="text-yellow-500 font-bold">Song Name</p>
            </div>
        </div>

    </div>

    <!-- INPUT -->
    <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-black to-transparent z-30 flex justify-center">
        <div class="relative w-full max-w-xl">
            <input type="text" id="input-guess" class="w-full bg-black/80 border-2 border-white p-4 text-center text-xl font-bold uppercase tracking-widest rounded shadow-lg focus:border-yellow-500 outline-none" placeholder="ÉCOUTEZ..." autocomplete="off" autofocus>
            <div id="feedback-msg" class="absolute -top-16 left-0 right-0 text-center font-manga text-4xl text-green-500 drop-shadow-md pop-anim hidden">CORRECT !</div>
        </div>
    </div>

    <!-- AUDIO HIDDEN -->
    <audio id="game-audio" style="display:none;"></audio>

    <!-- SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue, update, remove, push, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { OP_DATABASE } from "./op_database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Params URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        if (!roomId) window.location.href = 'blindtest_hub.html';

        let currentUser = null;
        let currentSong = null;
        let isHost = false;
        let roundTimer = null;
        let hasGuessed = false; // Pour le joueur local

        // --- UTILS ---
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function levenshtein(a, b) {
            if(a.length == 0) return b.length; 
            if(b.length == 0) return a.length; 
            var matrix = [];
            var i;
            for(i = 0; i <= b.length; i++){ matrix[i] = [i]; }
            var j;
            for(j = 0; j <= a.length; j++){ matrix[0][j] = j; }
            for(i = 1; i <= b.length; i++){
                for(j = 1; j <= a.length; j++){
                    if(b.charAt(i-1) == a.charAt(j-1)){
                        matrix[i][j] = matrix[i-1][j-1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, Math.min(matrix[i][j-1] + 1, matrix[i-1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function isCloseMatch(input, target) {
            if (!target) return false;
            const normInput = input.toLowerCase().trim();
            const normTarget = target.toLowerCase().trim();
            if (normInput === normTarget) return true;
            if (normTarget.includes(normInput) && normInput.length > 3) return true; 
            const distance = levenshtein(normInput, normTarget);
            const maxLength = Math.max(normInput.length, normTarget.length);
            return (1 - (distance / maxLength)) > 0.75;
        }

        // --- GAME LOGIC ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                initGame();
            } else {
                window.location.href = 'index.html';
            }
        });

        function initGame() {
            const roomRef = ref(db, `blindtest/rooms/${roomId}`);
            
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return alert("Partie terminée ou inexistante");

                isHost = (data.host === currentUser.uid);

                // 1. GESTION JOUEURS (Affichage VS Screen)
                const players = Object.values(data.players || {});
                
                if (players.length === 2) {
                    // Update HUD
                    document.getElementById('status-text').innerText = "PRÊT AU COMBAT !";
                    document.getElementById('status-text').className = "mt-8 text-green-500 font-bold text-2xl animate-bounce";
                    
                    // Affichage avatars VS
                    const p1 = players.find(p => p.team === 1);
                    const p2 = players.find(p => p.team === 2); // En 1v1 ranked, J1=team1, J2=team2
                    
                    if(p1) {
                        document.getElementById('p1-name').innerText = p1.name;
                        document.getElementById('p1-avatar').src = p1.avatar || 'https://ui-avatars.com/api/?name='+p1.name;
                        document.getElementById('name-p1').innerText = p1.name;
                        document.getElementById('score-p1').innerText = p1.score;
                    }
                    if(p2) {
                        document.getElementById('p2-name').innerText = p2.name;
                        document.getElementById('p2-avatar').src = p2.avatar || 'https://ui-avatars.com/api/?name='+p2.name;
                        document.getElementById('name-p2').innerText = p2.name;
                        document.getElementById('score-p2').innerText = p2.score;
                    }

                    // SI HOTE ET STATUS WAITING -> START
                    if (isHost && data.status === 'waiting') {
                        startGame(data);
                    }
                }

                // 2. GESTION GAME STATE
                if (data.status === 'playing') {
                    handleGameState(data.gameState);
                }
            });
        }

        function startGame(data) {
            // GÉNÉRATION DU DECK
            const allIndices = Array.from({length: OP_DATABASE.length}, (_, i) => i);
            const newDeck = shuffleArray(allIndices);
            
            // DÉMARRAGE
            update(ref(db, `blindtest/rooms/${roomId}`), {
                status: 'playing',
                gameState: {
                    currentRound: 1,
                    songIndex: newDeck[0],
                    startTime: Date.now() + 3000, // 3s delay avant start
                    phase: 'guessing',
                    deck: newDeck,
                    seekTime: Math.floor(Math.random() * 11) + 40
                }
            });
        }

        let lastPhase = '';
        const audioEl = document.getElementById('game-audio');
        const videoEl = document.getElementById('game-video');
        const inputEl = document.getElementById('input-guess');

        function handleGameState(state) {
            // Cache l'écran VS si on joue
            if (state.phase !== 'lobby') {
                document.getElementById('vs-screen').classList.add('vs-slide-up');
            }

            // Nouvelle Manche détectée
            if (state.phase !== lastPhase || (state.phase === 'guessing' && state.startTime !== lastStartTime)) {
                lastPhase = state.phase;
                lastStartTime = state.startTime;
                currentSong = OP_DATABASE[state.songIndex];
                document.getElementById('round-display').innerText = state.currentRound;

                if (state.phase === 'guessing') {
                    // PHASE GUESS
                    document.getElementById('video-container').classList.add('hidden');
                    document.getElementById('vinyl-container').classList.remove('hidden');
                    inputEl.disabled = false;
                    inputEl.value = "";
                    inputEl.focus();
                    inputEl.placeholder = "ÉCOUTEZ...";
                    hasGuessed = false;
                    document.getElementById('feedback-msg').classList.add('hidden');

                    // AUDIO PLAY
                    audioEl.src = currentSong.url;
                    audioEl.currentTime = state.seekTime || 40;
                    audioEl.volume = 0.5;
                    audioEl.play().catch(e => console.log("Autoplay block"));

                    // TIMER VISUEL (15s)
                    const timer = document.getElementById('timer-fill');
                    timer.style.transition = 'none';
                    timer.style.width = '100%';
                    setTimeout(() => {
                        timer.style.transition = 'width 15s linear';
                        timer.style.width = '0%';
                    }, 100);

                    // LOGIQUE HOST : FIN DU ROUND (15s)
                    if (isHost) {
                        clearTimeout(roundTimer);
                        roundTimer = setTimeout(() => {
                            triggerReveal();
                        }, 15000);
                    }

                } else if (state.phase === 'reveal') {
                    // PHASE REVEAL
                    audioEl.pause();
                    document.getElementById('vinyl-container').classList.add('hidden');
                    
                    // VIDEO PLAY
                    videoEl.src = currentSong.url;
                    videoEl.currentTime = state.seekTime || 40;
                    videoEl.volume = 0.5;
                    videoEl.play();
                    document.getElementById('video-container').classList.remove('hidden');
                    
                    document.getElementById('reveal-anime').innerText = currentSong.anime;
                    document.getElementById('reveal-song').innerText = currentSong.song;
                    
                    inputEl.disabled = true;

                    // LOGIQUE HOST : NEXT ROUND
                    if (isHost) {
                        setTimeout(() => {
                            if (state.currentRound >= 15) {
                                alert("FIN DU MATCH !"); // A remplacer par un écran de fin
                                window.location.href = 'blindtest_ranked.html';
                                return;
                            }
                            
                            const nextIndex = state.deck[state.currentRound];
                            update(ref(db, `blindtest/rooms/${roomId}/gameState`), {
                                currentRound: state.currentRound + 1,
                                songIndex: nextIndex,
                                startTime: Date.now(),
                                phase: 'guessing',
                                seekTime: Math.floor(Math.random() * 11) + 40
                            });
                        }, 8000); // 8s de reveal
                    }
                }
            }
        }

        let lastStartTime = 0;

        function triggerReveal() {
            update(ref(db, `blindtest/rooms/${roomId}/gameState`), { 
                phase: 'reveal', 
                startTime: Date.now() 
            });
        }

        // --- INPUT & GUESS ---
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !hasGuessed) {
                const val = inputEl.value;
                if (!val) return;

                let score = 0;
                // Anime Check
                let matchAnime = isCloseMatch(val, currentSong.anime);
                if (!matchAnime && currentSong.alt) {
                    for (let a of currentSong.alt) if (isCloseMatch(val, a)) matchAnime = true;
                }

                if (matchAnime) {
                    score = 1;
                    // Feedback local
                    const fb = document.getElementById('feedback-msg');
                    fb.innerText = "CORRECT !";
                    fb.className = "absolute -top-16 left-0 right-0 text-center font-manga text-4xl text-green-500 drop-shadow-md pop-anim";
                    fb.classList.remove('hidden');
                    inputEl.value = "";
                    hasGuessed = true;

                    // Update Score DB
                    get(ref(db, `blindtest/rooms/${roomId}/players/${currentUser.uid}/score`)).then(snap => {
                        update(ref(db, `blindtest/rooms/${roomId}/players/${currentUser.uid}`), { score: (snap.val()||0) + 1 });
                    });

                    // MORT SUBITE : Si trouvé, on arrête le round pour tout le monde
                    // On vérifie juste si on est le premier à trouver pour éviter double trigger
                    // Dans un vrai système sécurisé, on ferait ça via Cloud Functions.
                    triggerReveal(); 
                } else {
                    // Feedback Fail
                    inputEl.classList.add('border-red-500');
                    setTimeout(() => inputEl.classList.remove('border-red-500'), 500);
                }
            }
        });

    </script>
</body>
</html>
