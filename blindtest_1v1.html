<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 DUEL | Red Empire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --red: #ff2e2e; --dark-bg: #050505; }
        body { background-color: var(--dark-bg); color: #fff; font-family: 'Roboto Condensed', sans-serif; overflow: hidden; }
        .font-manga { font-family: 'Bangers', cursive; letter-spacing: 1.5px; }
        
        /* Ecrans */
        .screen-layer {
            position: fixed; inset: 0; z-index: 50; background: #050505;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        .hidden-layer { opacity: 0; pointer-events: none; z-index: -1; }
        
        /* Player Cards */
        .player-card { background: #111; border: 2px solid #333; padding: 10px; display: flex; align-items: center; gap: 10px; min-width: 200px; transition: all 0.3s; }
        .player-card.active { border-color: #ff2e2e; box-shadow: 0 0 15px rgba(255, 46, 46, 0.3); }
        
        /* Anim */
        @keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .pop-anim { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* Loader */
        .loader { width: 48px; height: 48px; border: 5px solid #FFF; border-bottom-color: #ff2e2e; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Timer & Disk */
        .timer-container { width: 100%; height: 10px; background: #333; border: 1px solid #fff; border-radius: 5px; overflow: hidden; margin-top: 5px; }
        .timer-fill { height: 100%; background: #facc15; width: 100%; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .disk-spin { animation: spin 3s linear infinite; }
        .disk-paused { animation-play-state: paused !important; }
    </style>
</head>
<body>

    <!-- ECRAN 1 : MATCHMAKING -->
    <div id="screen-matchmaking" class="screen-layer">
        <div class="loader mb-6"></div>
        <h1 id="mm-status" class="text-4xl font-manga text-white mb-2 animate-pulse">RECHERCHE D'ADVERSAIRE...</h1>
        <p class="text-gray-500 font-mono text-xs">Système de transaction actif</p>
        <button onclick="window.location.href='blindtest_ranked.html'" class="mt-8 text-red-500 border border-red-500 px-4 py-1 rounded hover:bg-red-500 hover:text-white transition text-xs font-bold">ANNULER</button>
    </div>

    <!-- ECRAN 2 : VERSUS -->
    <div id="screen-vs" class="screen-layer hidden-layer">
        <h1 class="text-6xl font-manga text-yellow-500 mb-12">DUEL TROUVÉ</h1>
        <div class="flex items-center justify-center gap-8 md:gap-20 w-full px-4">
            <!-- J1 -->
            <div class="text-center w-1/3">
                <img id="vs-p1-avatar" src="" class="w-24 h-24 rounded-full border-4 border-blue-500 mb-4 mx-auto object-cover bg-gray-800">
                <h2 id="vs-p1-name" class="font-black text-xl text-blue-400 uppercase truncate">...</h2>
            </div>
            <div class="text-4xl font-black italic text-white animate-pulse">VS</div>
            <!-- J2 -->
            <div class="text-center w-1/3">
                <img id="vs-p2-avatar" src="" class="w-24 h-24 rounded-full border-4 border-red-600 mb-4 mx-auto object-cover bg-gray-800">
                <h2 id="vs-p2-name" class="font-black text-xl text-red-500 uppercase truncate">...</h2>
            </div>
        </div>
        <p class="mt-12 text-white font-mono text-xl">DÉMARRAGE DANS <span id="start-countdown" class="text-yellow-500 font-bold text-3xl">...</span></p>
    </div>

    <!-- HUD (Toujours présent mais caché au début) -->
    <div id="game-hud" class="hidden absolute top-0 w-full flex justify-between p-4 z-40">
        <div class="player-card border-blue-600 rounded-r-xl">
            <span id="hud-p1-score" class="text-4xl font-manga text-blue-500">0</span>
            <div class="flex flex-col ml-2">
                <span id="hud-p1-name" class="font-black text-sm uppercase truncate max-w-[100px]">J1</span>
            </div>
        </div>
        
        <div class="flex flex-col items-center">
            <div class="bg-black px-6 py-2 border-2 border-white rounded-lg font-manga text-2xl shadow-lg transform skew-x-[-10deg]">
                ROUND <span id="round-display" class="text-yellow-500">1</span>
            </div>
            <div class="w-40 md:w-80 timer-container">
                <div id="timer-bar" class="timer-fill"></div>
            </div>
        </div>

        <div class="player-card border-red-600 flex-row-reverse text-right rounded-l-xl">
            <span id="hud-p2-score" class="text-4xl font-manga text-red-500">0</span>
            <div class="flex flex-col mr-2">
                <span id="hud-p2-name" class="font-black text-sm uppercase truncate max-w-[100px]">J2</span>
            </div>
        </div>
    </div>

    <!-- ZONE DE JEU -->
    <div id="game-layer" class="hidden h-screen w-full flex items-center justify-center relative z-10">
        
        <!-- Disque -->
        <div id="view-vinyl" class="relative w-64 h-64 md:w-80 md:h-80 animate-[spin_3s_linear_infinite]">
            <div class="absolute inset-0 bg-black rounded-full border-[10px] border-gray-800 flex items-center justify-center shadow-[0_0_80px_rgba(255,255,255,0.1)]">
                <div class="absolute inset-0 rounded-full border border-white/10"></div>
                <div class="w-24 h-24 md:w-32 md:h-32 bg-gradient-to-br from-red-600 to-red-900 rounded-full flex items-center justify-center border-4 border-white z-10">
                    <i class="fa-solid fa-music text-4xl md:text-5xl text-white"></i>
                </div>
            </div>
        </div>
        
        <!-- Video -->
        <div id="view-video" class="hidden absolute inset-0 bg-black z-20 flex items-center justify-center">
            <video id="game-video" class="w-full h-full object-contain max-w-6xl mx-auto" playsinline></video>
            <div class="absolute bottom-24 md:bottom-32 text-center bg-black/90 px-6 py-4 rounded-xl border-2 border-yellow-500 shadow-2xl max-w-[90%]">
                <h2 id="reveal-anime" class="text-3xl md:text-5xl font-manga text-white mb-2 text-shadow-lg break-words">ANIME</h2>
                <p id="reveal-song" class="text-yellow-400 font-bold text-lg md:text-xl uppercase tracking-widest break-words">Song</p>
            </div>
        </div>

        <!-- Feedback Visuel (Correct/Faux) -->
        <div id="feedback-overlay" class="absolute inset-0 flex items-center justify-center pointer-events-none z-50 hidden">
            <h1 class="font-manga text-6xl md:text-9xl text-green-500 drop-shadow-[0_0_20px_rgba(0,0,0,1)] pop-anim">CORRECT !</h1>
        </div>
    </div>

    <!-- INPUT -->
    <div id="input-area" class="hidden absolute bottom-0 w-full p-6 bg-gradient-to-t from-black via-black/90 to-transparent z-30 flex justify-center pb-8">
        <div class="relative w-full max-w-2xl">
            <input type="text" id="input-guess" class="w-full bg-gray-900/90 border-2 border-white/30 text-white p-4 text-center text-xl md:text-2xl font-bold uppercase tracking-widest rounded-lg shadow-2xl focus:border-yellow-500 focus:bg-black outline-none transition-all placeholder-gray-600" placeholder="NOM DE L'ANIME..." autocomplete="off">
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="game-audio" preload="auto"></audio>

    <!-- LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue, update, remove, runTransaction, child, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { OP_DATABASE } from "./op_database.js";

        // CONFIG PROJET
        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ETAT GLOBAL
        let user = null;
        let roomId = null;
        let isHost = false;
        let currentSong = null;
        let hasGuessed = false;
        let localTimerInterval = null; 
        let currentPhase = 'lobby'; 

        // DOM
        const els = {
            mmStatus: document.getElementById('mm-status'),
            screenMatch: document.getElementById('screen-matchmaking'),
            screenVs: document.getElementById('screen-vs'),
            gameHud: document.getElementById('game-hud'),
            gameLayer: document.getElementById('game-layer'),
            inputArea: document.getElementById('input-area'),
            input: document.getElementById('input-guess'),
            timerBar: document.getElementById('timer-bar'),
            audio: document.getElementById('game-audio'),
            video: document.getElementById('game-video'),
            viewVinyl: document.getElementById('view-vinyl'),
            viewVideo: document.getElementById('view-video'),
            revealAnime: document.getElementById('reveal-anime'),
            revealSong: document.getElementById('reveal-song'),
            feedback: document.getElementById('feedback-overlay')
        };

        // 1. AUTH
        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                joinMatchmaking();
            } else {
                window.location.href = 'index.html';
            }
        });

        // 2. MATCHMAKING (Transaction)
        // C'est ici que ça bloquait avant. Cette méthode est plus sûre.
        async function joinMatchmaking() {
            const queueRef = ref(db, 'blindtest/pending_match');
            
            // On utilise runTransaction pour éviter que 2 personnes prennent la même place
            const result = await runTransaction(queueRef, (current) => {
                if (current === null) {
                    // Personne n'attend, je crée la place (je suis HOST)
                    return { uid: user.uid, roomId: Math.random().toString(36).substr(2, 9) };
                } else {
                    // Quelqu'un attend, je prends la place (je suis GUEST) et je supprime le node
                    return null; // Supprimer = valider le match
                }
            });

            if (result.committed) {
                // Si j'ai écrit (HOST)
                if (result.snapshot.val() && result.snapshot.val().uid === user.uid) {
                    isHost = true;
                    roomId = result.snapshot.val().roomId;
                    els.mmStatus.innerText = "EN ATTENTE D'UN JOUEUR...";
                    
                    // Je crée la salle
                    await createRoom(roomId);
                    
                    // J'écoute la salle pour voir quand le guest arrive
                    listenToRoom();
                    
                    // Nettoyage si je quitte avant
                    onDisconnect(queueRef).remove();
                    onDisconnect(ref(db, `blindtest/rooms/${roomId}`)).remove();
                }
                // Si j'ai supprimé (GUEST) -> J'ai matché avec celui qui était dans snapshot
                else {
                    const hostData = result.snapshot.val(); // Les données avant suppression
                    if (hostData) {
                        isHost = false;
                        roomId = hostData.roomId;
                        els.mmStatus.innerText = "ADVERSAIRE TROUVÉ !";
                        
                        // Je rejoins la salle de l'host
                        await joinRoom(roomId);
                        listenToRoom();
                    } else {
                        // Cas rare (conflit), on réessaie
                        setTimeout(joinMatchmaking, 500);
                    }
                }
            }
        }

        async function createRoom(rid) {
            const p = await getProfile();
            await set(ref(db, `blindtest/rooms/${rid}`), {
                host: user.uid,
                players: { [user.uid]: { ...p, team: 1, score: 0 } },
                status: 'waiting'
            });
        }

        async function joinRoom(rid) {
            const p = await getProfile();
            await update(ref(db, `blindtest/rooms/${rid}/players/${user.uid}`), {
                ...p, team: 2, score: 0
            });
        }

        async function getProfile() {
            try {
                const s = await get(child(ref(db), `users/${user.uid}`));
                if(s.exists()) return { name: s.val().username || user.displayName, avatar: s.val().avatar || "" };
            } catch(e){}
            return { name: user.displayName, avatar: user.photoURL };
        }

        // 3. ECOUTE SALLE & SYNCHRO
        function listenToRoom() {
            onValue(ref(db, `blindtest/rooms/${roomId}`), (snap) => {
                const data = snap.val();
                if (!data) return;

                // UI JOUEURS
                if (data.players) {
                    const list = Object.values(data.players);
                    updatePlayerUI(list);

                    // HOST : Si 2 joueurs, on lance le timer de départ
                    if (isHost && data.status === 'waiting' && list.length === 2) {
                        const launchTime = Date.now() + 5000;
                        update(ref(db, `blindtest/rooms/${roomId}`), { 
                            status: 'starting', 
                            launchTime: launchTime 
                        });
                    }
                }

                // ETATS
                if (data.status === 'starting' && data.launchTime) {
                    startCountdown(data.launchTime);
                }
                else if (data.status === 'playing' && data.gameState) {
                    if(localTimerInterval) clearInterval(localTimerInterval); // Stop countdown
                    handleGameState(data.gameState);
                }
            });
        }

        function updatePlayerUI(list) {
            const p1 = list.find(p => p.team === 1);
            const p2 = list.find(p => p.team === 2);
            
            if(p1) {
                document.getElementById('vs-p1-name').innerText = p1.name;
                document.getElementById('vs-p1-avatar').src = p1.avatar;
                document.getElementById('hud-p1-name').innerText = p1.name;
                document.getElementById('hud-p1-score').innerText = p1.score;
            }
            if(p2) {
                document.getElementById('vs-p2-name').innerText = p2.name;
                document.getElementById('vs-p2-avatar').src = p2.avatar;
                document.getElementById('hud-p2-name').innerText = p2.name;
                document.getElementById('hud-p2-score').innerText = p2.score;
            }
        }

        function startCountdown(targetTime) {
            els.screenMatch.classList.add('hidden-layer');
            els.screenVs.classList.remove('hidden-layer');

            if(localTimerInterval) clearInterval(localTimerInterval);
            
            localTimerInterval = setInterval(() => {
                const diff = Math.ceil((targetTime - Date.now()) / 1000);
                if(diff > 0) {
                    document.getElementById('start-countdown').innerText = diff;
                } else {
                    document.getElementById('start-countdown').innerText = "GO!";
                    clearInterval(localTimerInterval);
                    // HOST : Lance le jeu
                    if(isHost) initGameEngine();
                }
            }, 100);
        }

        // --- MOTEUR DE JEU ---
        function initGameEngine() {
            // Génération Deck
            const deck = [];
            for(let i=0; i<OP_DATABASE.length; i++) deck.push(i);
            deck.sort(() => Math.random() - 0.5); // Shuffle

            update(ref(db, `blindtest/rooms/${roomId}`), {
                status: 'playing',
                gameState: {
                    phase: 'guessing',
                    round: 1,
                    index: deck[0],
                    deck: deck,
                    startTime: Date.now(),
                    seek: Math.floor(Math.random() * 15) + 30
                }
            });
        }

        function handleGameState(state) {
            // Afficher le jeu
            els.screenVs.classList.add('hidden-layer');
            els.gameHud.classList.remove('hidden');
            els.gameLayer.classList.remove('hidden');
            els.inputArea.classList.remove('hidden');

            // Check si état a changé
            const stateKey = `${state.phase}-${state.round}-${state.startTime}`;
            if (currentPhase === stateKey) return;
            currentPhase = stateKey;

            currentSong = OP_DATABASE[state.index];
            document.getElementById('round-display').innerText = state.round;

            if (state.phase === 'guessing') {
                // MODE GUESS
                els.viewVideo.classList.add('hidden');
                els.viewVinyl.classList.remove('hidden');
                els.feedback.classList.add('hidden');
                
                els.input.disabled = false;
                els.input.value = "";
                els.input.focus();
                hasGuessed = false;

                // Audio
                els.audio.src = currentSong.url;
                els.audio.currentTime = state.seek;
                els.audio.volume = 0.5;
                els.audio.play().catch(e => console.log("Autoplay blocked"));

                // Timer
                els.timerBar.style.transition = 'none';
                els.timerBar.style.width = '100%';
                setTimeout(() => {
                    els.timerBar.style.transition = 'width 15s linear';
                    els.timerBar.style.width = '0%';
                }, 50);

                // HOST Timeout
                if(isHost) {
                    setTimeout(() => {
                        // Vérif si toujours le même round (pas de mort subite déjà trigger)
                        update(ref(db, `blindtest/rooms/${roomId}/gameState/phase`), 'reveal');
                    }, 15000);
                }

            } else if (state.phase === 'reveal') {
                // MODE REVEAL
                els.audio.pause();
                els.viewVinyl.classList.add('hidden');
                els.viewVideo.classList.remove('hidden');
                
                els.video.src = currentSong.url;
                els.video.currentTime = state.seek;
                els.video.volume = 0.5;
                els.video.play();

                els.revealAnime.innerText = currentSong.anime;
                els.revealSong.innerText = currentSong.song;
                els.input.disabled = true;

                // HOST Next Round
                if(isHost) {
                    setTimeout(() => {
                        if(state.round >= 15) {
                            alert("FIN !");
                            window.location.href = "blindtest_ranked.html";
                        } else {
                            const nextIndex = state.deck[state.round];
                            update(ref(db, `blindtest/rooms/${roomId}/gameState`), {
                                phase: 'guessing',
                                round: state.round + 1,
                                index: nextIndex,
                                startTime: Date.now(),
                                deck: state.deck, // Keep deck
                                seek: Math.floor(Math.random() * 15) + 30
                            });
                        }
                    }, 8000);
                }
            }
        }

        // --- INPUT ---
        function isCloseMatch(input, target) {
            if (!target) return false;
            const clean = str => str.toLowerCase().replace(/[^a-z0-9]/g, "");
            const a = clean(input);
            const b = clean(target);
            if (a === b) return true;
            if (b.includes(a) && a.length > 3) return true;
            return false;
        }

        els.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !hasGuessed && currentSong) {
                const val = els.input.value;
                if(!val) return;

                let correct = isCloseMatch(val, currentSong.anime);
                if(!correct && currentSong.alt) {
                    currentSong.alt.forEach(a => { if(isCloseMatch(val, a)) correct = true; });
                }

                if(correct) {
                    hasGuessed = true;
                    els.feedback.classList.remove('hidden');
                    
                    // +1 Point
                    get(ref(db, `blindtest/rooms/${roomId}/players/${user.uid}/score`)).then(s => {
                        update(ref(db, `blindtest/rooms/${roomId}/players/${user.uid}`), { score: (s.val()||0) + 1 });
                    });

                    // MORT SUBITE
                    update(ref(db, `blindtest/rooms/${roomId}/gameState/phase`), 'reveal');
                } else {
                    els.input.classList.add('border-red-500');
                    setTimeout(()=>els.input.classList.remove('border-red-500'), 500);
                }
            }
        });

    </script>
</body>
</html>
