<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Empire | Ranked 1v1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' },
                        empire: { red: '#ff2e2e', dark: '#0a0a0a' }
                    },
                    fontFamily: {
                        manga: ['Bangers', 'cursive'],
                        display: ['Orbitron', 'sans-serif'],
                        mono: ['Rajdhani', 'sans-serif'],
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 3s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #eee; overflow: hidden; }
        .manga-panel { border: 2px solid #333; background: #111; position: relative; }
        .glass-hud { background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
        .loader-bar { height: 4px; width: 0%; transition: width 0.2s linear; }
        @keyframes clash {
            0% { transform: scale(3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.1) rotate(5deg); opacity: 1; }
        }
        .vs-text { animation: clash 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .disk-spin { animation: spin 2s linear infinite; }
        .disk-paused { animation-play-state: paused !important; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #facc15; margin-top: -6px; cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #333; }
    </style>
</head>
<body class="h-screen flex flex-col font-mono">

    <!-- TOP BAR (HUD) -->
    <nav class="h-20 bg-black border-b border-gold-600/30 flex items-center justify-between px-6 z-50 relative shadow-[0_0_20px_rgba(234,179,8,0.1)]">
        <button onclick="leaveMatch()" class="text-gray-400 hover:text-white transition-colors flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> <span class="hidden md:inline font-bold">ABANDONNER</span>
        </button>

        <!-- SCOREBOARD -->
        <div class="flex items-center gap-4 md:gap-8 flex-1 justify-center">
            <!-- Player 1 (ME) -->
            <div class="flex items-center gap-3 text-right">
                <div class="hidden md:block">
                    <div id="p1-name" class="font-display font-bold text-gold-400 text-lg leading-none">MOI</div>
                    <div class="text-xs text-gray-500">RANKED</div>
                </div>
                <img id="p1-avatar" src="" class="w-12 h-12 rounded border-2 border-gold-500 object-cover bg-gray-800">
                <div class="font-manga text-4xl text-white w-12 text-center" id="p1-score">0</div>
            </div>

            <div class="font-manga text-2xl text-red-600 italic px-2">VS</div>

            <!-- Player 2 (OPPONENT) -->
            <div class="flex items-center gap-3 flex-row-reverse text-left">
                <div class="hidden md:block">
                    <div id="p2-name" class="font-display font-bold text-gray-400 text-lg leading-none">ADVERSAIRE</div>
                    <div id="p2-status" class="text-xs text-gray-500">CONNEXION...</div>
                </div>
                <img id="p2-avatar" src="https://ui-avatars.com/api/?name=?" class="w-12 h-12 rounded border-2 border-gray-600 object-cover grayscale transition-all duration-500">
                <div class="font-manga text-4xl text-gray-500 w-12 text-center" id="p2-score">0</div>
            </div>
        </div>

        <!-- Round Info -->
        <div class="text-right">
            <div class="font-display font-black text-gold-500 text-2xl" id="round-counter">R1</div>
            <div class="text-xs text-gray-400">/ 10</div>
        </div>
    </nav>

    <!-- MAIN ARENA AREA -->
    <div class="relative flex-grow flex flex-col bg-[#050505]">
        <!-- VIDEO PLAYER -->
        <div id="video-container" class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none opacity-0 transition-opacity duration-500">
            <div class="w-full max-w-4xl aspect-video bg-black border-4 border-gold-500 shadow-[0_0_50px_rgba(234,179,8,0.2)] overflow-hidden relative">
                <video id="game-video" class="w-full h-full object-contain" playsinline preload="auto"></video>
                <div id="result-overlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center text-center hidden backdrop-blur-sm">
                    <h2 id="res-anime" class="font-display text-4xl md:text-5xl text-white font-black mb-2 text-shadow-glow">ANIME NAME</h2>
                    <p id="res-song" class="font-mono text-gold-400 text-xl tracking-widest">SONG TITLE</p>
                    <div id="res-type" class="mt-4 px-3 py-1 bg-white text-black font-bold font-manga skew-x-[-10deg]">OPENING 1</div>
                </div>
            </div>
        </div>

        <!-- VINYL MODE -->
        <div id="vinyl-container" class="absolute inset-0 flex flex-col items-center justify-center z-0 transition-opacity duration-500">
            <div class="relative w-72 h-72 md:w-96 md:h-96">
                <div id="disk" class="w-full h-full rounded-full bg-[#111] border-[8px] border-[#222] shadow-[0_0_30px_#000] flex items-center justify-center disk-spin disk-paused relative">
                    <div class="absolute inset-0 rounded-full border-[30px] border-[#1a1a1a] opacity-50"></div>
                    <div class="w-32 h-32 rounded-full bg-gradient-to-br from-gold-600 to-yellow-800 border-4 border-black flex items-center justify-center shadow-inner z-10">
                        <i class="fa-solid fa-music text-4xl text-black opacity-50"></i>
                    </div>
                </div>
                <div class="absolute -top-10 -right-10 w-40 h-8 bg-gray-400 rotate-[30deg] origin-top-right border-2 border-black rounded-full shadow-xl z-20 pointer-events-none"></div>
            </div>
            <div class="w-full max-w-xl mt-12 px-6">
                <div class="flex justify-between text-xs font-mono text-gray-500 mb-1 uppercase tracking-widest">
                    <span id="status-text">EN ATTENTE...</span>
                    <span id="time-text">00.00</span>
                </div>
                <div class="h-2 bg-gray-800 rounded-full overflow-hidden border border-gray-700">
                    <div id="timer-bar" class="h-full bg-gradient-to-r from-gold-600 to-yellow-400 w-0"></div>
                </div>
            </div>
        </div>

        <!-- INPUT ZONE -->
        <div class="mt-auto bg-[#0a0a0a] border-t border-white/10 p-6 z-20">
            <div class="max-w-3xl mx-auto flex gap-4">
                <input type="text" id="input-guess" placeholder="NOM DE L'ANIME..." class="flex-1 bg-[#151515] border-2 border-[#333] text-white font-manga text-2xl px-6 py-4 uppercase tracking-wider focus:border-gold-500 focus:outline-none transition-colors rounded disabled:opacity-50 disabled:cursor-not-allowed" autocomplete="off">
                <button id="btn-submit" onclick="submitGuess()" class="bg-gold-600 hover:bg-gold-500 text-black font-black font-display text-xl px-8 py-4 rounded transition-transform hover:scale-105 disabled:opacity-50 disabled:scale-100 uppercase">
                    ENVOYER
                </button>
            </div>
            <div id="feedback-zone" class="h-8 mt-2 flex justify-center gap-4 text-xs font-bold font-mono tracking-widest uppercase opacity-0 transition-opacity">
                <span id="fb-anime" class="text-green-500 hidden"><i class="fa-solid fa-check mr-1"></i>ANIME (+1)</span>
                <span id="fb-song" class="text-gold-500 hidden"><i class="fa-solid fa-check mr-1"></i>TITRE (+1)</span>
                <span id="fb-op" class="text-blue-500 hidden"><i class="fa-solid fa-check mr-1"></i>TYPE (+0.5)</span>
            </div>
        </div>
    </div>

    <!-- MATCHMAKING OVERLAY -->
    <div id="lobby-overlay" class="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
        <div id="lobby-step-search" class="text-center max-w-md w-full">
            <h1 class="font-display text-5xl font-black text-white mb-2">RANKED <span class="text-gold-500">ARENA</span></h1>
            <p class="text-gray-400 font-mono mb-10">Duel 1v1 - Synchronisation Parfaite</p>
            <div class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-gold-600 to-red-600 rounded-lg blur opacity-25 group-hover:opacity-75 transition duration-1000 group-hover:duration-200"></div>
                <button onclick="startMatchmaking()" class="relative w-full py-6 bg-black border border-gray-700 rounded-lg text-2xl font-display font-bold text-white group-hover:text-gold-400 transition-colors uppercase tracking-widest">
                    <i class="fa-solid fa-magnifying-glass mr-3"></i> TROUVER UN ADVERSAIRE
                </button>
            </div>
            <div class="mt-6 flex justify-center gap-6 text-sm font-mono text-gray-500">
                <span><i class="fa-solid fa-server text-green-500 mr-2"></i>SERVEUR: EUROPE</span>
                <span><i class="fa-solid fa-user-group text-blue-500 mr-2"></i>EN LIGNE: <span id="online-count">...</span></span>
            </div>
        </div>

        <div id="lobby-step-queue" class="hidden text-center">
            <div class="w-24 h-24 border-4 border-t-gold-500 border-r-transparent border-b-gold-500 border-l-transparent rounded-full animate-spin mx-auto mb-8"></div>
            <h2 class="font-display text-2xl text-white animate-pulse">RECHERCHE EN COURS...</h2>
            <p class="font-mono text-gold-500 mt-2 text-sm tracking-widest">ELO MATCHING</p>
            <button onclick="cancelQueue()" class="mt-8 text-red-500 font-bold hover:underline text-xs uppercase">ANNULER</button>
        </div>

        <div id="lobby-step-found" class="hidden w-full h-full flex items-center justify-center relative bg-black">
            <div class="absolute inset-0 bg-[radial-gradient(circle,rgba(234,179,8,0.1),black)]"></div>
            <div class="flex flex-col md:flex-row items-center gap-12 z-10 scale-150">
                <div class="text-center transform translate-x-10 animate-[slideInLeft_0.5s_forwards]">
                    <img id="found-p1-img" src="" class="w-32 h-32 rounded-full border-4 border-gold-500 shadow-[0_0_30px_#eab308]">
                    <div class="font-display font-bold text-white mt-4 text-xl">VOUS</div>
                </div>
                <div class="font-manga text-8xl text-red-600 italic vs-text z-20 drop-shadow-[0_0_10px_rgba(255,0,0,0.8)]">VS</div>
                <div class="text-center transform -translate-x-10 animate-[slideInRight_0.5s_forwards]">
                    <img id="found-p2-img" src="" class="w-32 h-32 rounded-full border-4 border-gray-500 shadow-[0_0_30px_#6b7280]">
                    <div id="found-p2-name" class="font-display font-bold text-gray-300 mt-4 text-xl">ADVERSAIRE</div>
                </div>
            </div>
        </div>
    </div>

    <audio id="silence" src="data:audio/mp3;base64,//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq" preload="auto"></audio>

    <!-- LOGIQUE JAVASCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue, update, remove, runTransaction, onDisconnect, child, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { OP_DATABASE } from "./op_database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC4wbkceT_vAWdBpYs7KhBQxjgkiDvyG9c",
            authDomain: "red-empire-103d7.firebaseapp.com",
            databaseURL: "https://red-empire-103d7-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "red-empire-103d7",
            storageBucket: "red-empire-103d7.firebasestorage.app",
            messagingSenderId: "1002924043244",
            appId: "1:1002924043244:web:e76002c3dc8810017faec9",
            measurementId: "G-DPG3ZZ68G4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // --- ETAT GLOBAL ---
        let currentUser = null;
        let myProfile = { name: "Joueur", avatar: "" };
        let matchId = null;
        let opponentId = null;
        let isHost = false;
        let currentRound = 0;
        let currentSong = null;
        let roundScore = 0;
        let hasJoinedQueue = false;
        
        // --- ELEMENTS DOM ---
        const videoEl = document.getElementById('game-video');
        const diskEl = document.getElementById('disk');
        const inputGuess = document.getElementById('input-guess');
        const statusText = document.getElementById('status-text');
        
        // --- MATCHMAKING ---
        window.startMatchmaking = async () => {
            if (!currentUser) return alert("Veuillez vous connecter !");
            const silence = document.getElementById('silence');
            silence.play().catch(() => {});
            videoEl.play().catch(() => {}); 
            videoEl.pause();

            document.getElementById('lobby-step-search').classList.add('hidden');
            document.getElementById('lobby-step-queue').classList.remove('hidden');
            
            // Anti-spam clic
            if(hasJoinedQueue) return;
            hasJoinedQueue = true;
            
            checkQueueLoop();
        };

        async function checkQueueLoop() {
            const myEntry = ref(db, `blindtest/ranked/queue/${currentUser.uid}`);
            
            // S'assurer d'avoir un profil propre
            const safeProfile = {
                uid: currentUser.uid,
                name: myProfile.name || "Joueur",
                avatar: myProfile.avatar || "https://ui-avatars.com/api/?name=P",
                joinedAt: serverTimestamp()
            };

            await set(myEntry, safeProfile);
            onDisconnect(myEntry).remove();

            const queueRef = ref(db, 'blindtest/ranked/queue');
            const unsubQueue = onValue(queueRef, async (snap) => {
                const players = snap.val();
                if (!players) return;
                
                const now = Date.now();
                const ZOMBIE_TIMEOUT = 120 * 1000; // 2 minutes

                // 1. Filtrage et nettoyage des zombies
                const validUids = [];
                const updates = {};
                let needsCleanup = false;

                Object.keys(players).forEach(key => {
                    const p = players[key];
                    // Si entrée mal formée ou trop vieille (zombie)
                    if (!p || typeof p !== 'object' || !p.uid || (p.joinedAt && now - p.joinedAt > ZOMBIE_TIMEOUT)) {
                        // Marquer pour suppression
                        updates[`blindtest/ranked/queue/${key}`] = null;
                        needsCleanup = true;
                    } else {
                        validUids.push(key);
                    }
                });

                // Exécuter le nettoyage si je suis le premier valide (pour éviter conflits)
                if (needsCleanup && validUids.length > 0 && validUids[0] === currentUser.uid) {
                    update(ref(db), updates).catch(e => console.log("Cleanup error", e));
                }

                // 2. Tri par ancienneté
                validUids.sort((a, b) => {
                    const tA = players[a]?.joinedAt || 0;
                    const tB = players[b]?.joinedAt || 0;
                    return tA - tB;
                });
                
                // 3. Logique de Match
                if (validUids.length >= 2 && validUids.includes(currentUser.uid)) {
                    const p1 = validUids[0]; // Host (plus ancien)
                    const p2 = validUids[1]; // Guest

                    // Seul le P1 (Host) crée le match pour éviter doublons
                    if (currentUser.uid === p1) {
                        const newMatchId = `ranked_${Date.now()}_${p1}_${p2}`;
                        
                        // Protection contre les données undefined
                        const p1Data = players[p1] || safeProfile;
                        const p2Data = players[p2] || { name: "Adversaire", avatar: "" };

                        const matchData = {
                            host: p1, 
                            players: {
                                [p1]: { name: p1Data.name, avatar: p1Data.avatar, score: 0, status: 'connecting' },
                                [p2]: { name: p2Data.name, avatar: p2Data.avatar, score: 0, status: 'connecting' }
                            },
                            gameState: {
                                phase: 'setup',
                                round: 1,
                                songIndex: 0,
                                startTime: 0,
                                deck: generateDeck()
                            },
                            created: serverTimestamp()
                        };

                        const globalUpdates = {};
                        globalUpdates[`blindtest/ranked/matches/${newMatchId}`] = matchData;
                        globalUpdates[`blindtest/ranked/queue/${p1}`] = null;
                        globalUpdates[`blindtest/ranked/queue/${p2}`] = null;
                        globalUpdates[`users/${p1}/currentMatch`] = newMatchId;
                        globalUpdates[`users/${p2}/currentMatch`] = newMatchId;

                        try {
                            await update(ref(db), globalUpdates);
                        } catch (e) {
                            console.error("ERREUR CREATION MATCH:", e);
                            // En cas d'échec critique, se retirer de la file pour débloquer
                            remove(myEntry);
                            hasJoinedQueue = false;
                            alert("Erreur matchmaking. Veuillez réessayer.");
                            location.reload();
                        }
                    }
                }
            });

            // Ecouteur de départ de match
            const myMatchRef = ref(db, `users/${currentUser.uid}/currentMatch`);
            onValue(myMatchRef, (snap) => {
                const mId = snap.val();
                if (mId) {
                    matchId = mId;
                    unsubQueue();
                    offQueueSelf();
                    set(myMatchRef, null); 
                    startMatchSequence(mId);
                }
            });
        }

        function offQueueSelf() {
             const myEntry = ref(db, `blindtest/ranked/queue/${currentUser.uid}`);
             onDisconnect(myEntry).cancel();
             remove(myEntry);
             hasJoinedQueue = false;
        }

        window.cancelQueue = () => {
            offQueueSelf();
            document.getElementById('lobby-step-queue').classList.add('hidden');
            document.getElementById('lobby-step-search').classList.remove('hidden');
        };

        window.leaveMatch = () => {
            if(matchId) {
                // Simple leave, maybe concede
                window.location.href = 'blindtest_ranked.html';
            } else {
                window.location.href = 'blindtest_ranked.html';
            }
        };

        function generateDeck() {
            const indices = Array.from({length: OP_DATABASE.length}, (_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            return indices.slice(0, 10);
        }

        // --- INITIALISATION MATCH ---
        async function startMatchSequence(mId) {
            // On cache le lobby
            document.getElementById('lobby-step-queue').classList.add('hidden');
            document.getElementById('lobby-step-search').classList.add('hidden');
            document.getElementById('lobby-step-found').classList.remove('hidden');

            const matchRef = ref(db, `blindtest/ranked/matches/${mId}`);
            const snap = await get(matchRef);
            
            if(!snap.exists()) {
                console.log("Match non trouvé, retry...");
                setTimeout(() => {
                     if(!snap.exists()) {
                        alert("Match introuvable ou annulé.");
                        window.location.href = 'blindtest_ranked.html';
                     }
                }, 1000);
                return;
            }

            const data = snap.val();
            const pIds = Object.keys(data.players);
            const enemyId = pIds.find(id => id !== currentUser.uid);
            opponentId = enemyId;
            
            // LOGIQUE HOST ROBUSTE : On utilise le champ 'host' de la DB
            isHost = (data.host === currentUser.uid);
            console.log("Je suis HOST ?", isHost);

            // --- UPDATE HUD IMMEDIAT ---
            // Important pour éviter le "gris"
            document.getElementById('found-p1-img').src = myProfile.avatar || "https://ui-avatars.com/api/?name=Me";
            document.getElementById('found-p2-img').src = data.players[enemyId].avatar || "https://ui-avatars.com/api/?name=Enemy";
            document.getElementById('found-p2-name').innerText = data.players[enemyId].name;
            
            document.getElementById('p2-avatar').src = data.players[enemyId].avatar;
            document.getElementById('p2-avatar').classList.remove('grayscale');
            document.getElementById('p2-name').innerText = data.players[enemyId].name;
            document.getElementById('p2-status').innerText = "EN LIGNE";
            document.getElementById('p2-status').classList.add('text-green-500');

            // Transition vers le jeu
            setTimeout(() => {
                document.getElementById('lobby-overlay').classList.add('hidden');
                initGameSync(mId);
            }, 3000);
        }

        // --- SYNC ENGINE ---
        function initGameSync(mId) {
            const matchRef = ref(db, `blindtest/ranked/matches/${mId}`);
            // Je suis prêt à recevoir les ordres
            update(child(matchRef, `players/${currentUser.uid}`), { status: 'ready' });

            onValue(matchRef, (snap) => {
                const data = snap.val();
                if (!data) return;

                // Update Scores
                const pIds = Object.keys(data.players);
                pIds.forEach(id => {
                    const score = data.players[id].score;
                    if (id === currentUser.uid) document.getElementById('p1-score').innerText = score;
                    else document.getElementById('p2-score').innerText = score;
                });

                handleGameState(data.gameState, data.players);
            });
        }

        let localPhase = null;
        let localSongIndex = -1;

        function handleGameState(gameState, players) {
            document.getElementById('round-counter').innerText = `R${gameState.round}`;
            
            if (gameState.phase !== localPhase || gameState.songIndex !== localSongIndex) {
                localPhase = gameState.phase;
                localSongIndex = gameState.songIndex;
                console.log(`[SYNC] Phase: ${gameState.phase}, Round: ${gameState.round}`);

                if (gameState.phase === 'setup' || gameState.phase === 'loading') {
                    if (gameState.deck && gameState.deck.length > 0) {
                        const songIdx = gameState.deck[gameState.round - 1];
                        setupRound(songIdx);
                    }
                } else if (gameState.phase === 'playing') {
                    startPlayback(gameState.startTime);
                } else if (gameState.phase === 'reveal') {
                    showResult();
                }
            }
        }

        // --- PHASE 1 : CHARGEMENT ---
        function setupRound(songIdx) {
            resetUI();
            currentSong = OP_DATABASE[songIdx];
            if (!currentSong) return;

            statusText.innerText = "CHARGEMENT...";
            statusText.classList.add('animate-pulse');

            videoEl.src = currentSong.url;
            videoEl.currentTime = 0;
            videoEl.volume = 0.5;
            
            let isLoaded = false;
            const markAsLoaded = () => {
                if(isLoaded) return;
                isLoaded = true;
                console.log("[VIDEO] Loaded. Sending status...");
                update(ref(db, `blindtest/ranked/matches/${matchId}/players/${currentUser.uid}`), { status: 'loaded' });
                videoEl.oncanplaythrough = null;
            };

            videoEl.oncanplaythrough = markAsLoaded;
            if (videoEl.readyState >= 3) markAsLoaded();
            else videoEl.load();

            // Fallback de sécurité (5s max)
            setTimeout(() => {
                if(!isLoaded) {
                    console.warn("[VIDEO] Timeout de chargement - Force Start");
                    markAsLoaded();
                }
            }, 5000);

            // --- LOGIQUE HOST ---
            // Seul le host surveille tout le monde
            if (isHost) {
                const checkLoadInterval = setInterval(async () => {
                    const s = await get(ref(db, `blindtest/ranked/matches/${matchId}/players`));
                    const ps = s.val();
                    
                    // Debug : Voir qui n'est pas prêt
                    const notReady = Object.entries(ps).filter(([id, p]) => p.status !== 'loaded');
                    if(notReady.length > 0) {
                        console.log("En attente de :", notReady.map(n => n[1].name));
                    }

                    const allLoaded = notReady.length === 0;
                    if (allLoaded) {
                        clearInterval(checkLoadInterval);
                        console.log("[HOST] Tout le monde prêt. Lancement.");
                        update(ref(db, `blindtest/ranked/matches/${matchId}/gameState`), {
                            phase: 'playing',
                            startTime: Date.now() + 2000 // +2s delay
                        });
                    }
                }, 1000);
            }
        }

        // --- PHASE 2 : LECTURE ---
        function startPlayback(targetStartTime) {
            statusText.innerText = "ÉCOUTEZ !";
            statusText.classList.remove('animate-pulse');
            
            document.getElementById('video-container').classList.add('opacity-0');
            document.getElementById('vinyl-container').classList.remove('opacity-0');
            diskEl.classList.remove('disk-paused');
            inputGuess.disabled = false;
            inputGuess.focus();

            const now = Date.now();
            const delay = targetStartTime - now;
            
            console.log(`[PLAY] Start dans ${delay}ms`);

            if (delay > 0) {
                setTimeout(() => {
                    videoEl.play().catch(e => console.error(e));
                    startTimerBar(targetStartTime, 20000);
                }, delay);
            } else {
                const seekTo = Math.abs(delay) / 1000;
                videoEl.currentTime = seekTo;
                videoEl.play().catch(e => console.error(e));
                startTimerBar(targetStartTime, 20000);
            }

            if (isHost) {
                setTimeout(() => {
                    update(ref(db, `blindtest/ranked/matches/${matchId}/gameState`), {
                        phase: 'reveal',
                        startTime: Date.now()
                    });
                }, 20000 + (delay > 0 ? delay : 0));
            }
        }

        function startTimerBar(startTime, durationMs) {
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';
            const end = startTime + durationMs;
            const updateBar = () => {
                const now = Date.now();
                const remaining = end - now;
                if (remaining <= 0) { bar.style.width = '0%'; return; }
                const pct = (remaining / durationMs) * 100;
                bar.style.width = `${pct}%`;
                const secs = Math.ceil(remaining / 1000);
                document.getElementById('time-text').innerText = `00.${secs.toString().padStart(2,'0')}`;
                requestAnimationFrame(updateBar);
            };
            requestAnimationFrame(updateBar);
        }

        // --- PHASE 3 : RESULTAT ---
        function showResult() {
            document.getElementById('video-container').classList.remove('opacity-0');
            document.getElementById('vinyl-container').classList.add('opacity-0');
            diskEl.classList.add('disk-paused');
            inputGuess.disabled = true;

            document.getElementById('result-overlay').classList.remove('hidden');
            document.getElementById('res-anime').innerText = currentSong.anime;
            document.getElementById('res-song').innerText = currentSong.song;
            document.getElementById('res-type').innerText = `OP ${currentSong.num || 1}`;
            document.getElementById('feedback-zone').style.opacity = '0';

            if (isHost) {
                setTimeout(async () => {
                    const currentState = await get(ref(db, `blindtest/ranked/matches/${matchId}/gameState`));
                    const state = currentState.val();
                    
                    if (state.round >= 10) {
                        alert("PARTIE TERMINÉE !");
                        // Clean queue/match here if needed
                        window.location.href = 'blindtest_ranked.html';
                    } else {
                        // Reset players status to 'loading' before switching phase
                        const updates = {};
                        updates[`blindtest/ranked/matches/${matchId}/gameState/phase`] = 'loading';
                        updates[`blindtest/ranked/matches/${matchId}/gameState/round`] = state.round + 1;
                        updates[`blindtest/ranked/matches/${matchId}/gameState/songIndex`] = state.songIndex + 1;
                        updates[`blindtest/ranked/matches/${matchId}/players/${currentUser.uid}/status`] = 'loading';
                        updates[`blindtest/ranked/matches/${matchId}/players/${opponentId}/status`] = 'loading';
                        
                        // On force le reset status via updates groupés si possible, 
                        // sinon on fait update game state qui trigger setupRound
                        // Mieux : Host reset tout le monde
                        await update(ref(db), updates);
                    }
                }, 8000);
            }
        }

        // --- GAMEPLAY ---
        window.submitGuess = () => {
            const val = inputGuess.value.trim().toLowerCase();
            if (!val || !currentSong) return;
            const isAnime = currentSong.anime.toLowerCase().includes(val);
            const isSong = currentSong.song.toLowerCase().includes(val);

            if (isAnime || isSong) {
                const scoreRef = ref(db, `blindtest/ranked/matches/${matchId}/players/${currentUser.uid}/score`);
                runTransaction(scoreRef, (score) => (score || 0) + 10);
                document.getElementById('feedback-zone').style.opacity = '1';
                if (isAnime) document.getElementById('fb-anime').classList.remove('hidden');
                inputGuess.value = "";
            }
        };

        function resetUI() {
            document.getElementById('result-overlay').classList.add('hidden');
            document.getElementById('fb-anime').classList.add('hidden');
            document.getElementById('fb-song').classList.add('hidden');
            document.getElementById('fb-op').classList.add('hidden');
            document.getElementById('feedback-zone').style.opacity = '0';
        }

        // --- INIT & RECONNEXION AUTO ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                myProfile.name = user.displayName;
                myProfile.avatar = user.photoURL;
                document.getElementById('p1-name').innerText = user.displayName;
                document.getElementById('p1-avatar').src = user.photoURL;
                
                // AUTO-REJOIN : Vérifier si une partie est active
                const currentMatchRef = ref(db, `users/${user.uid}/currentMatch`);
                get(currentMatchRef).then(snap => {
                    if (snap.exists()) {
                        const mId = snap.val();
                        console.log("Match en cours détecté :", mId);
                        matchId = mId;
                        startMatchSequence(mId);
                    }
                });
            } else {
                window.location.href = 'blindtest_ranked.html';
            }
        });

    </script>
</body>
</html>
