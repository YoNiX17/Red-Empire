// --- UTILITAIRES ---

const normalize = (str) => str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

const checkString = (guess, target) => {
  return guess === target ? 'correct' : 'wrong';
};

const checkArray = (guessArr, targetArr) => {
  const sortedGuess = [...guessArr].sort().join(',');
  const sortedTarget = [...targetArr].sort().join(',');
  if (sortedGuess === sortedTarget) return 'correct';
  const intersection = guessArr.filter(item => targetArr.includes(item));
  if (intersection.length > 0) return 'partial';
  return 'wrong';
};

// --- COMPOSANT "WAKFU TILE" (Style Runique) ---
const WakfuTile = ({ content, status, delay, label, isImage, imgUrl, isIdentity, raceColor }) => {
  let bgClass = "";
  let borderStyle = "";
  let shadowEffect = "";
  let animationName = "popIn";
  
  // Styles dynamiques
  if (isIdentity) {
    // CASE IDENTITÉ : Fond transparent, Bordure Race
    bgClass = "bg-transparent";
    borderStyle = `4px solid ${raceColor || '#9E9E9E'}`; // Bordure plus épaisse (4px)
    shadowEffect = `0 0 10px ${raceColor || '#9E9E9E'}66`; // Lueur subtile de la couleur de classe
  } else {
    // CASES TEXTE :
    if (status === 'correct') {
      // Cyan Wakfu (Juste)
      bgClass = "bg-[#00D1E6]"; 
      borderStyle = "3px solid #A5F2F3";
      shadowEffect = "0 4px 0 0 #00A3B4, 0 8px 10px rgba(0,209,230,0.4)"; 
    } else if (status === 'partial') {
      // Orange (Partiel)
      bgClass = "bg-[#FF9900]"; 
      borderStyle = "3px solid #FFD699";
      shadowEffect = "0 4px 0 0 #CC7A00, 0 8px 10px rgba(255,153,0,0.3)";
    } else if (status === 'wrong') {
      // Violet Stasis (Faux)
      bgClass = "bg-[#9C27B0]"; 
      borderStyle = "3px solid #CE93D8";
      shadowEffect = "0 4px 0 0 #6A0080, 0 8px 10px rgba(156,39,176,0.3)";
    } else {
      bgClass = "bg-[#2A3240]"; // Défaut
      borderStyle = "2px solid #4A5568";
      shadowEffect = "none";
    }
  }

  return (
    <div 
      className="relative w-full aspect-square group perspective-500" 
      style={{ 
        animation: `${animationName} 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) ${delay}ms forwards`, 
        opacity: 0, 
        transform: 'scale(0)' 
      }}
    >
      {/* HEADER FLOTTANT (Étiquette) */}
      {label && !isIdentity && (
        <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 z-20 bg-[#1B2435] text-[#00D1E6] text-[9px] md:text-[10px] font-extrabold px-2 py-0.5 rounded shadow-lg border border-[#00D1E6]/30 uppercase tracking-widest whitespace-nowrap">
          {label}
        </div>
      )}

      {/* LE CONTENU DE LA TUILE */}
      <div 
        className={`
          w-full h-full rounded-2xl flex items-center justify-center text-center
          ${isIdentity ? 'p-0' : 'p-2'}
          overflow-hidden transition-transform duration-300 hover:scale-[1.02]
          ${bgClass}
        `}
        style={{ 
          border: borderStyle,
          boxShadow: shadowEffect,
        }}
      >
         {/* CONTENU INTERNE */}
         <div className="relative z-10 w-full h-full flex items-center justify-center">
           {isImage ? (
             // --- IMAGE IDENTITÉ ---
             <div className="w-full h-full flex items-center justify-center">
                 {imgUrl ? (
                    <img 
                      src={imgUrl} 
                      alt={content} 
                      className="w-full h-full object-cover object-top drop-shadow-lg"
                      onError={(e) => {e.target.onerror = null; e.target.src=`https://ui-avatars.com/api/?name=${content}&background=1B2435&color=fff`;}} 
                    />
                 ) : (
                    <div className="w-full h-full flex items-center justify-center bg-[#1B2435]/20 rounded-xl"><ImageIcon size={32} className="text-slate-400"/></div>
                 )}
             </div>
           ) : (
             // --- TEXTE NORMAL ---
             <span className="font-black text-xs md:text-sm uppercase leading-tight drop-shadow-md text-white break-words w-full">
               {content}
             </span>
           )}
         </div>
         
         {/* EFFET DE REFLET (Glossy) - Uniquement pour les cases colorées */}
         {!isIdentity && (
            <div className="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
         )}
      </div>
    </div>
  );
};

export default function Wakfudle() {
  const [target, setTarget] = useState(null);
  const [guesses, setGuesses] = useState([]);
  const [input, setInput] = useState("");
  const [isWon, setIsWon] = useState(false);
  const [showModal, setShowModal] = useState(false);
  const [showHelp, setShowHelp] = useState(false);

  useEffect(() => {
    startNewGame();
  }, []);

  const startNewGame = () => {
    const randomChar = CHARACTERS_DB[Math.floor(Math.random() * CHARACTERS_DB.length)];
    setTarget(randomChar);
    setGuesses([]);
    setIsWon(false);
    setShowModal(false);
    setInput("");
  };

  const suggestions = useMemo(() => {
    if (!input) return [];
    return CHARACTERS_DB
      .filter(c => !guesses.some(g => g.nom === c.nom))
      .filter(c => normalize(c.nom).includes(normalize(input)))
      .slice(0, 5);
  }, [input, guesses]);

  const handleGuess = (character) => {
    if (isWon) return;

    const newGuess = {
      ...character,
      status: {
        nom: checkString(character.nom, target.nom),
        genre: checkString(character.genre, target.genre),
        espece: checkArray(character.espece, target.espece),
        nature: checkArray(character.nature, target.nature),
        affiliation: checkArray(character.affiliation, target.affiliation),
        apparition: checkString(character.apparition, target.apparition),
      }
    };

    setGuesses([newGuess, ...guesses]);
    setInput("");

    if (character.nom === target.nom) {
      setIsWon(true);
      setTimeout(() => setShowModal(true), 800);
    }
  };

  if (!target) return <div className="flex h-screen items-center justify-center bg-[#F4F7FA] text-cyan-500 font-black text-xl tracking-widest">CHARGEMENT...</div>;

  return (
    <div className="min-h-screen bg-[#F0F4F8] text-slate-800 font-sans overflow-x-hidden flex flex-col items-center pb-20">
      
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body { font-family: 'Montserrat', sans-serif; }
        
        @keyframes popIn {
          0% { transform: scale(0); opacity: 0; }
          60% { transform: scale(1.1); opacity: 1; }
          100% { transform: scale(1); opacity: 1; } 
        }
        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }
        @keyframes slideDown {
          0% { transform: translateY(-10px); opacity: 0; }
          100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes shine {
          0% { left: -100%; }
          100% { left: 200%; }
        }
      `}</style>

      <div className="fixed inset-0 pointer-events-none overflow-hidden z-0 bg-gradient-to-b from-white to-[#E3F2FD]">
         <div className="absolute w-full h-full opacity-5 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
      </div>

      <div className="relative z-10 w-full max-w-[1200px] px-4 py-6 flex flex-col items-center flex-grow">
        
        <header className="flex items-center justify-between w-full max-w-4xl mb-10 mt-2">
          <button onClick={() => setShowHelp(!showHelp)} className="bg-white p-3 rounded-2xl shadow-lg hover:scale-110 transition-all border-2 border-cyan-100 text-cyan-600">
            <Info size={24} strokeWidth={3} />
          </button>
          
          <div className="flex flex-col items-center animate-[float_6s_ease-in-out_infinite]">
             <img 
               src={LOGO_URL}
               alt="Wakfu Logo" 
               className="h-28 md:h-40 object-contain drop-shadow-xl"
               onError={(e) => { e.target.onerror = null; if (e.target.parentNode) e.target.parentNode.innerHTML = '<h1 class="text-5xl font-black text-cyan-500 tracking-tighter">WAKFUDLE</h1>'; }}
             />
          </div>

          <div className="w-12"></div> 
        </header>

        <div className="relative w-full max-w-xl mb-12 z-50">
           <div className="relative group">
             <div className="absolute -inset-1 bg-gradient-to-r from-[#00D1E6] to-[#448AFF] rounded-2xl blur opacity-30 group-focus-within:opacity-60 transition duration-500"></div>
             <div className="relative flex items-center bg-white rounded-2xl shadow-xl border border-white p-1">
               <div className="pl-4 text-cyan-500"><Search size={24} strokeWidth={3}/></div>
               <input 
                 type="text" 
                 value={input}
                 onChange={(e) => setInput(e.target.value)}
                 placeholder="Chercher un personnage..." 
                 className="w-full bg-transparent text-slate-800 font-black uppercase tracking-wider p-4 outline-none placeholder-slate-300 text-sm md:text-base"
                 disabled={isWon}
               />
               {input && (
                 <button onClick={() => setInput("")} className="pr-4 text-slate-300 hover:text-red-400 transition-colors"><X size={20} strokeWidth={3}/></button>
               )}
             </div>
           </div>

           {suggestions.length > 0 && (
             <div className="absolute top-[calc(100%+10px)] left-0 right-0 bg-white/95 backdrop-blur-xl border border-cyan-100 rounded-2xl shadow-2xl z-50 overflow-hidden animate-in fade-in zoom-in-95 duration-200">
               {suggestions.map((s, idx) => (
                 <div 
                   key={s.nom} 
                   onClick={() => handleGuess(s)} 
                   className="p-3 hover:bg-gradient-to-r hover:from-cyan-50 hover:to-white cursor-pointer font-bold text-xs md:text-sm text-slate-700 uppercase flex justify-between items-center border-b border-slate-100 last:border-0 transition-colors group"
                   style={{ animation: `slideDown 0.3s ease-out forwards ${idx * 50}ms`, opacity: 0 }}
                 >
                   <div className="flex items-center gap-3">
                      <div className="w-14 h-14 rounded-xl overflow-hidden border border-slate-200 shadow-sm bg-white" style={{borderColor: getRaceColor(s.espece)}}>
                         {s.img ? <img src={s.img} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full bg-slate-100 flex items-center justify-center text-[10px] text-slate-400">{s.nom.substring(0,2)}</div>}
                      </div>
                      <span className="group-hover:text-cyan-600 transition-colors">{s.nom}</span>
                   </div>
                   <ChevronRight size={16} className="text-slate-300 group-hover:text-cyan-500" />
                 </div>
               ))}
             </div>
           )}
        </div>

        <div className="w-full flex flex-col gap-4 max-w-5xl px-2 md:px-0">
           {guesses.map((guess, idx) => (
             <div key={guess.nom} className="grid grid-cols-6 gap-2 md:gap-4 w-full">
                
                <WakfuTile 
                  content={guess.nom} 
                  status={guess.status.nom === 'correct' ? 'correct' : 'wrong'} 
                  delay={0} 
                  isImage={true}
                  imgUrl={guess.img}
                  isIdentity={true}
                  raceColor={getRaceColor(guess.espece)}
                />

                <WakfuTile content={guess.genre} status={guess.status.genre} delay={100} label="Genre" />
                <WakfuTile content={guess.espece.join('\n')} status={guess.status.espece} delay={200} label="Espèce" />
                <WakfuTile content={guess.nature.join('\n')} status={guess.status.nature} delay={300} label="Nature" />
                <WakfuTile content={guess.affiliation.join('\n')} status={guess.status.affiliation} delay={400} label="Affiliation" />
                <WakfuTile content={guess.apparition} status={guess.status.apparition} delay={500} label="Saison" />

             </div>
           ))}

           {guesses.length === 0 && (
             <div className="flex flex-col items-center justify-center py-24 opacity-40">
               <div className="bg-white p-6 rounded-full shadow-xl mb-4 animate-bounce">
                 <Sparkles size={40} className="text-cyan-400" fill="currentColor" />
               </div>
               <p className="text-sm md:text-lg font-black text-slate-400 uppercase tracking-[0.3em]">Le Krosmoz attend...</p>
             </div>
           )}
        </div>

      </div>

      {/* --- MODALE VICTOIRE --- */}
      {showModal && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md transition-all duration-500">
            
            <div className="bg-white p-8 rounded-[2rem] text-center max-w-sm w-full shadow-[0_0_50px_rgba(0,209,230,0.6)] border-4 border-[#00D1E6] animate-[popIn_0.6s_cubic-bezier(0.34,1.56,0.64,1)] relative overflow-hidden flex flex-col items-center">
              
              {/* Background Ray effect */}
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-gradient-radial from-cyan-200/40 to-transparent rounded-full blur-3xl animate-pulse"></div>

              {/* Victory Title */}
              <div className="relative z-10 mb-6">
                 <h2 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#00D1E6] to-blue-600 uppercase italic tracking-tighter drop-shadow-sm">
                   VICTOIRE !
                 </h2>
              </div>

              {/* Character Reveal */}
              <div className="relative z-10 mb-6 group">
                 <div className="w-40 h-40 rounded-2xl overflow-hidden border-4 border-[#00D1E6] shadow-[0_0_30px_rgba(0,209,230,0.4)] relative bg-white transform transition-transform duration-500 hover:scale-105 hover:rotate-2">
                    {target.img ? (
                        <img src={target.img} alt={target.nom} className="w-full h-full object-cover object-top" />
                    ) : (
                        <div className="w-full h-full flex items-center justify-center bg-slate-100">
                            <ImageIcon size={48} className="text-slate-300"/>
                        </div>
                    )}
                    {/* Shine effect */}
                    <div className="absolute -top-[100%] -left-[100%] w-[300%] h-[300%] bg-gradient-to-b from-white/40 to-transparent rotate-45 animate-[shine_3s_infinite_2s] pointer-events-none"></div>
                 </div>
                 <div className="absolute -bottom-4 left-1/2 -translate-x-1/2 bg-[#00D1E6] text-white text-xs font-black px-3 py-1 rounded-full shadow-lg whitespace-nowrap border-2 border-white">
                    {target.nom}
                 </div>
              </div>

              {/* Stats */}
              <p className="text-slate-500 mb-8 font-medium relative z-10">
                Trouvé en <span className="font-black text-[#00D1E6] text-xl">{guesses.length}</span> essai{guesses.length > 1 ? 's' : ''}
              </p>
              
              {/* Replay Button */}
              <button 
                onClick={startNewGame} 
                className="relative z-10 group w-full py-4 bg-gradient-to-r from-[#00D1E6] to-[#0088CC] hover:from-[#33E2F2] hover:to-[#33A6FF] text-white font-black uppercase tracking-widest rounded-2xl shadow-lg shadow-cyan-200/50 transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl active:scale-95 flex items-center justify-center gap-3 text-lg overflow-hidden"
              >
                {/* Button Shine */}
                <div className="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shine_1s_ease-in-out] pointer-events-none"></div>
                
                <RefreshCw size={24} strokeWidth={3} className="group-hover:rotate-180 transition-transform duration-500"/> 
                Rejouer
              </button>
            </div>
        </div>
      )}

      {showHelp && (
        <div className="fixed inset-0 bg-slate-900/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setShowHelp(false)}>
            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden animate-[popIn_0.3s_ease-out]" onClick={e => e.stopPropagation()}>
               <div className="bg-[#00D1E6] p-4 flex justify-between items-center">
                  <h3 className="text-white font-black text-lg uppercase tracking-wide">Règles du Jeu</h3>
                  <button onClick={() => setShowHelp(false)} className="text-white/80 hover:text-white"><X strokeWidth={3}/></button>
               </div>
               <div className="p-6 space-y-4 text-sm">
                  <div className="flex items-center gap-4">
                     <div className="w-10 h-10 bg-[#00D1E6] rounded-lg border-2 border-[#A5F2F3] shadow-[0_4px_0_0_#00A3B4] flex items-center justify-center text-white font-black">V</div>
                     <div><p className="font-bold text-slate-700">CORRECT</p></div>
                  </div>
                  <div className="flex items-center gap-4">
                     <div className="w-10 h-10 bg-[#FF9900] rounded-lg border-2 border-[#FFD699] shadow-[0_4px_0_0_#CC7A00] flex items-center justify-center text-white font-black">~</div>
                     <div><p className="font-bold text-slate-700">PARTIEL</p></div>
                  </div>
                  <div className="flex items-center gap-4">
                     <div className="w-10 h-10 bg-[#9C27B0] rounded-lg border-2 border-[#CE93D8] shadow-[0_4px_0_0_#6A0080] flex items-center justify-center text-white font-black">X</div>
                     <div><p className="font-bold text-slate-700">INCORRECT</p></div>
                  </div>
               </div>
            </div>
        </div>
      )}

    </div>
  );
}

// DÉMARRAGE DE L'APPLICATION
const root = createRoot(document.getElementById('root'));
root.render(<Wakfudle />);

    </script>
</body>
</html>
