    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="referrer" content="no-referrer">
    
    <title>HaikyuuDLE</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* --- ANIMATIONS --- */
        @keyframes flip-in {
          0% { transform: rotateX(-90deg) skewX(-6deg); opacity: 0; }
          100% { transform: rotateX(0) skewX(-6deg); opacity: 1; }
        }
        .animate-flip-in {
          animation: flip-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
          transform-style: preserve-3d;
          backface-visibility: hidden;
        }
        
        @keyframes pop-in {
          0% { transform: scale(0.5); opacity: 0; }
          70% { transform: scale(1.1); }
          100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
          animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes slide-up-fade {
          0% { transform: translateY(20px); opacity: 0; }
          100% { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up-fade {
          animation: slide-up-fade 0.4s ease-out forwards;
        }

        @keyframes bounce-short {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }
        .animate-bounce-short {
           animation: bounce-short 0.4s ease-in-out 2;
        }

        @keyframes spin-slow {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
          animation: spin-slow 3s linear infinite;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out;
        }

        .perspective-1000 { perspective: 1000px; }
        
        /* Design Skewed (Incliné) */
        .skew-container { transform: skewX(-6deg); }
        .skew-child-reverse { transform: skewX(6deg); }
        
        /* Style spécifique pour la modale (inclinaison plus légère) */
        .skew-modal { transform: skewX(-2deg); }
        .skew-modal-reverse { transform: skewX(2deg); }

        /* Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#121212] text-white font-sans selection:bg-orange-500 selection:text-white overflow-x-hidden min-h-screen flex flex-col">

    <!-- FOND -->
    <div class="fixed inset-0 z-0 opacity-5 pointer-events-none" 
         style="background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 20px 20px;">
    </div>

    <!-- HEADER -->
    <header class="bg-black border-b-4 border-orange-500 p-4 sticky top-0 z-50 shadow-xl">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center gap-3 skew-container hover:scale-105 transition-transform cursor-default select-none ml-4">
                <div class="bg-orange-500 px-3 py-1 text-black font-black text-xl tracking-tighter uppercase shadow-md">
                    Haikyuu
                </div>
                <h1 class="text-3xl font-black italic tracking-tighter text-white">
                    DLE <span class="text-orange-500 text-lg not-italic ml-1">v.Ball</span>
                </h1>
            </div>
            <!-- Bouton Info -->
            <button onclick="toggleModal(true)" class="text-white hover:text-orange-500 transition transform hover:scale-110 hover:rotate-12 p-2 mr-2">
                <i data-lucide="info" class="w-8 h-8"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="relative z-10 max-w-6xl mx-auto p-4 flex flex-col items-center w-full flex-grow">

        <!-- ÉCRAN DE VICTOIRE -->
        <div id="victory-screen" class="hidden w-full max-w-2xl skew-container bg-gradient-to-r from-green-900 to-slate-900 border-l-8 border-white p-8 rounded-sm mb-10 text-center animate-pop-in shadow-2xl relative overflow-hidden group mt-8">
            <div class="absolute top-0 right-0 -mt-4 -mr-4 text-white/10 animate-pulse pointer-events-none">
                 <i data-lucide="trophy" class="w-[150px] h-[150px]"></i>
            </div>
            
            <div class="flex flex-col items-center justify-center skew-child-reverse mb-4">
                <div id="victory-avatar-container" class="mb-4 rounded border-4 border-white shadow-xl overflow-hidden bg-slate-800 animate-bounce-short w-24 h-32">
                    <!-- Image injectée ici -->
                </div>
                <h2 class="text-5xl font-black italic uppercase tracking-tighter text-white drop-shadow-lg mb-2 animate-slide-up-fade">Victoire !</h2>
                <p class="text-xl text-green-100 font-bold animate-slide-up-fade" style="animation-delay: 100ms">Personnage : <span id="victory-name" class="text-white uppercase text-2xl ml-2"></span></p>
            </div>
            
            <div class="mt-6 flex flex-col items-center gap-4 skew-child-reverse animate-slide-up-fade" style="animation-delay: 200ms">
                <button onclick="startNewGame()" class="bg-white text-green-900 font-black uppercase py-3 px-10 rounded shadow-lg hover:scale-110 hover:rotate-1 hover:shadow-xl hover:bg-green-50 transition-all duration-300 flex items-center gap-2 border-b-4 border-green-800 active:border-b-0 active:translate-y-1">
                     <i data-lucide="refresh-cw" class="w-5 h-5"></i> Rejouer
                </button>
            </div>
        </div>

        <!-- ZONE DE RECHERCHE -->
        <div id="search-section" class="relative w-full max-w-xl mb-12 mt-8 z-40 group transition-all duration-500">
            <div class="relative skew-container transition-transform duration-300 hover:scale-[1.02]">
                <input
                    id="search-input"
                    type="text"
                    class="w-full bg-gray-900/90 backdrop-blur border-4 border-gray-700 text-white text-xl font-bold uppercase py-4 pl-16 pr-4 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/20 transition-all duration-300 placeholder:text-gray-600 placeholder:normal-case shadow-lg"
                    placeholder="Entrez un joueur..."
                    autocomplete="off"
                />
                <div class="absolute left-0 top-0 bottom-0 w-14 bg-orange-500 flex items-center justify-center text-black border-r-4 border-gray-700 transition-colors duration-300 group-hover:bg-orange-400">
                    <i data-lucide="search" class="w-7 h-7"></i>
                </div>
            </div>

            <!-- SUGGESTIONS (Dropdown) -->
            <div id="suggestions-box" class="absolute top-full left-0 right-0 mt-2 bg-gray-900 border-2 border-gray-700 shadow-2xl max-h-80 overflow-y-auto z-50 custom-scrollbar hidden animate-slide-up-fade rounded-sm">
                <!-- Les suggestions seront injectées ici -->
            </div>
        </div>

        <!-- TABLEAU DES RÉSULTATS -->
        <div id="guesses-container" class="w-full overflow-x-auto pb-8 px-4 custom-scrollbar hidden">
            <!-- En-têtes -->
            <div class="min-w-max mb-4 flex gap-3 pl-20 md:pl-28">
                <div class="w-20 md:w-24 text-center text-gray-500 font-black text-[10px] md:text-xs uppercase tracking-widest">Sexe</div>
                <div class="w-20 md:w-24 text-center text-gray-500 font-black text-[10px] md:text-xs uppercase tracking-widest">Équipe</div>
                <div class="w-20 md:w-24 text-center text-gray-500 font-black text-[10px] md:text-xs uppercase tracking-widest">Poste</div>
                <div class="w-20 md:w-24 text-center text-gray-500 font-black text-[10px] md:text-xs uppercase tracking-widest">Année</div>
                <div class="w-20 md:w-24 text-center text-gray-500 font-black text-[10px] md:text-xs uppercase tracking-widest">Taille</div>
                <div class="w-20 md:w-24 text-center text-gray-500 font-black text-[10px] md:text-xs uppercase tracking-widest">Numéro</div>
            </div>
            <!-- Liste des essais -->
            <div id="guesses-list" class="flex flex-col-reverse gap-3">
                <!-- Les lignes s'ajoutent ici -->
            </div>
        </div>

        <!-- EMPTY STATE -->
        <div id="empty-state" class="text-center mt-12 opacity-40 animate-pulse">
            <i data-lucide="award" class="w-24 h-24 mx-auto mb-4 text-gray-600 hover:text-orange-500 transition-colors duration-500 hover:rotate-12 transform cursor-pointer"></i>
            <p class="font-black uppercase text-2xl text-gray-600 tracking-widest">En attente du service...</p>
        </div>

    </main>

    <!-- MODAL AIDE (STYLE RETROUVÉ MAIS ALIGNÉ) -->
    <div id="help-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-fade-in hidden">
        <div class="bg-black border-4 border-orange-500 max-w-lg w-full p-8 shadow-2xl relative skew-modal animate-pop-in">
            <!-- Bouton Fermer -->
            <button onclick="toggleModal(false)" class="absolute -top-5 -right-5 bg-white text-black p-2 border-4 border-black hover:bg-orange-500 hover:text-white transition shadow-[4px_4px_0px_rgba(0,0,0,1)] hover:scale-110 duration-300 z-50 skew-modal-reverse">
                 <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            
            <!-- Contenu contre-incliné pour rester droit -->
            <div class="skew-modal-reverse">
                <h2 class="text-3xl font-black italic uppercase mb-6 text-white border-b-4 border-orange-500 pb-2 inline-block">
                    Règles du Jeu
                </h2>
                
                <div class="space-y-4 text-gray-300 font-bold">
                    <p class="uppercase tracking-wide text-white text-lg">Trouve le joueur mystère.</p>
                    
                    <div class="grid grid-cols-1 gap-3">
                        <div class="flex items-center gap-4 bg-gray-900 p-4 border-l-4 border-green-500">
                            <div class="w-10 h-10 bg-green-600 flex items-center justify-center font-black text-white text-xs shadow-lg skew-container">OK</div>
                            <span class="uppercase text-sm">Correspondance Parfaite</span>
                        </div>
                        <div class="flex items-center gap-4 bg-gray-900 p-4 border-l-4 border-red-600">
                            <div class="w-10 h-10 bg-red-600 flex items-center justify-center font-black text-white text-xs shadow-lg skew-container">NO</div>
                            <span class="uppercase text-sm">Incorrect</span>
                        </div>
                        <div class="flex items-center gap-4 bg-gray-900 p-4 border-l-4 border-red-600">
                            <div class="w-10 h-10 bg-red-600 flex items-center justify-center font-black text-white text-xs shadow-lg skew-container"><i data-lucide="arrow-up" class="w-5 h-5 skew-child-reverse"></i></div>
                            <span class="uppercase text-sm">C'est Plus</span>
                        </div>
                    </div>
                </div>

                <button 
                    onclick="toggleModal(false)"
                    class="w-full mt-8 bg-orange-500 hover:bg-orange-400 text-black font-black text-xl uppercase py-4 border-b-8 border-orange-700 active:border-b-0 active:translate-y-2 transition-all tracking-widest"
                >
                    Entrer sur le terrain
                </button>
            </div>
        </div>
    </div>

            guessesList.innerHTML = ""; // Vide la liste sans détruire le conteneur
            guessesContainer.classList.add('hidden');
            emptyState.classList.remove('hidden');
            victoryScreen.classList.add('hidden');
            searchSection.classList.remove('hidden');
            
            console.log("Nouveau jeu lancé. Cible:", targetCharacter.name);
        }

        // Gestion de la recherche (Input)
        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            if (!val) {
                suggestionsBox.classList.add('hidden');
                return;
            }

            const suggestions = CHARACTERS.filter(c => 
                c.name.toLowerCase().includes(val) && 
                !guesses.find(g => g.id === c.id)
            );

            if (suggestions.length > 0) {
                suggestionsBox.innerHTML = suggestions.map((char, index) => `
                    <button 
                        class="w-full text-left px-4 py-3 hover:bg-orange-600 hover:text-white transition-colors duration-200 flex items-center gap-4 border-b border-gray-800 group/item"
                        onclick="handleGuess(${char.id})"
                        style="animation: slide-up-fade 0.3s ease-out forwards; animation-delay: ${index * 30}ms; opacity: 0;"
                    >
                        ${getAvatarHTML(char)}
                        <div class="flex flex-col">
                            <span class="font-black uppercase text-lg tracking-tight group-hover/item:translate-x-1 transition-transform">${char.name}</span>
                            <span class="text-xs font-bold uppercase opacity-70 group-hover/item:text-white ${char.schoolColor}">${char.team}</span>
                        </div>
                    </button>
                `).join('');
                suggestionsBox.classList.remove('hidden');
                lucide.createIcons();
            } else {
                suggestionsBox.innerHTML = `<div class="p-4 text-center text-gray-500 font-bold uppercase animate-pulse">Aucun joueur trouvé</div>`;
                suggestionsBox.classList.remove('hidden');
            }
        });

        // Clic en dehors pour fermer
        document.addEventListener('click', (e) => {
            if (!document.getElementById('search-section').contains(e.target)) {
                suggestionsBox.classList.add('hidden');
            }
        });

        // Gestion du choix (Guess)
        window.handleGuess = function(charId) {
            const char = CHARACTERS.find(c => c.id === charId);
            if (!char) return;

            guesses.unshift(char); // Ajoute au début du tableau logique
            
            // Mise à jour UI
            searchInput.value = "";
            suggestionsBox.classList.add('hidden');
            emptyState.classList.add('hidden');
            guessesContainer.classList.remove('hidden');

            // Ajout de la ligne (SANS RECHARGER TOUT LE TABLEAU)
            const rowHTML = createGuessRow(char);
            guessesList.insertAdjacentHTML('afterbegin', rowHTML);
            lucide.createIcons();

            // Vérification victoire
            if (char.id === targetCharacter.id) {
                showVictory();
            }
        };

        function showVictory() {
            // Cache la recherche avec une animation de sortie
            searchSection.style.opacity = '0';
            setTimeout(() => {
                searchSection.classList.add('hidden');
                searchSection.style.opacity = '1';
                
                // Prépare l'écran de victoire
                // On utilise big=true pour l'écran de victoire (grand rectangle incliné)
                victoryAvatarContainer.innerHTML = getAvatarHTML(targetCharacter, true); 
                victoryName.textContent = targetCharacter.name;
                
                victoryScreen.classList.remove('hidden');
                lucide.createIcons();
            }, 500);
        }

        // Helpers HTML
        function getAvatarHTML(char, big = false) {
            // STYLE CARTE HAIKYUU (Rectangulaire incliné)
            // Si big=true (Ecran victoire) ou big=true (Dans les lignes de résultat) -> Rectangle incliné
            // Si big=false (Suggestions recherche) -> Rond
            
            let content = '';
            
            // Classes de base
            let containerClasses = `relative overflow-hidden border-2 border-white/20 shadow-lg flex items-center justify-center bg-gradient-to-br ${char.color}`;
            let imgClasses = "object-cover";
            
            if (big) {
                // STYLE CARTE (Row & Victory)
                containerClasses += " w-20 h-24 md:w-24 md:h-28 skew-container animate-pop-in"; // Dimensions rectangle
                imgClasses += " w-full h-full skew-child-reverse scale-110"; // Contre-inclinaison image
            } else {
                // STYLE ROND (Recherche)
                containerClasses += " w-14 h-14 rounded-full";
                imgClasses += " w-full h-full rounded-full";
            }
            
            // Image avec fallback
            if (char.image) {
                content = `<img src="${char.image}" class="${imgClasses}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">`;
                // Fallback caché
                content += `
                    <div class="hidden w-full h-full flex-col items-center justify-center ${big ? 'skew-child-reverse' : ''} text-center p-1" style="display:none">
                        <span class="${big ? 'text-4xl' : 'text-lg'} font-black text-white/90 drop-shadow-md">${char.name.charAt(0)}</span>
                    </div>
                `;
            } else {
                content = `
                    <div class="flex flex-col items-center justify-center ${big ? 'skew-child-reverse' : ''} text-center w-full h-full p-1">
                        <span class="${big ? 'text-4xl' : 'text-lg'} font-black text-white/90 drop-shadow-md">${char.name.charAt(0)}</span>
                    </div>
                `;
            }

            return `
                <div class="${containerClasses}">
                    ${content}
                    ${(!char.image) ? `<div class="absolute -bottom-4 -right-4 opacity-20 text-white"><i data-lucide="zap" class="${big ? 'w-[60px] h-[60px]' : 'w-0 h-0'}"></i></div>` : ''}
                </div>
            `;
        }

        function createGuessRow(guess) {
            return `
                <div class="flex gap-3 mb-3 min-w-max px-2 animate-slide-up-fade">
                    ${getAvatarHTML(guess, true)} <!-- On passe true pour avoir le style carte -->
                    ${createCell("Sexe", guess.gender, 'gender', 100)}
                    ${createCell("Équipe", guess.team, 'team', 200)}
                    ${createCell("Poste", guess.position, 'position', 300)}
                    ${createCell("Année", guess.year, 'year', 400, true)}
                    ${createCell("Taille", guess.height, 'height', 500, true)}
                    ${createCell("Numéro", "#" + guess.number, 'number', 600, true)}
                </div>
            `;
        }

        function createCell(label, value, key, delay, isNumeric = false) {
            let status = 'incorrect';
            let content = value;
            let bgClass = 'bg-red-600 border-red-400'; // Default Incorrect

            if (isNumeric) {
                // Comparaison numérique
                let guessVal = key === 'number' ? parseInt(value.replace('#','')) : value;
                let targetVal = key === 'number' ? targetCharacter.number : targetCharacter[key];
                
                if (guessVal === targetVal) {
                    status = 'correct';
                    bgClass = 'bg-green-600 border-green-400';
                } else if (guessVal < targetVal) {
                    status = 'higher';
                    content = `<div class="flex flex-col items-center leading-none"><span>${value}</span><i data-lucide="arrow-up" class="w-5 h-5 text-white/80 animate-pulse mt-1"></i></div>`;
                } else {
                    status = 'lower';
                    content = `<div class="flex flex-col items-center leading-none"><span>${value}</span><i data-lucide="arrow-down" class="w-5 h-5 text-white/80 animate-pulse mt-1"></i></div>`;
                }
            } else {
                // Comparaison texte
                if (value === targetCharacter[key]) {
                    status = 'correct';
                    bgClass = 'bg-green-600 border-green-400';
                }
            }

            return `
                <div 
                    class="relative flex flex-col items-center justify-center w-20 h-24 md:w-24 md:h-28 skew-container transition-all duration-700 group animate-flip-in"
                    style="animation-delay: ${delay}ms; animation-fill-mode: backwards;"
                >
                    <div class="absolute -top-2 left-1/2 -translate-x-1/2 bg-black text-white text-[9px] uppercase font-black tracking-widest px-2 py-0.5 z-10 border border-white/20 skew-child-reverse shadow-md">
                        ${label}
                    </div>
                    <div class="w-full h-full flex items-center justify-center border-2 ${bgClass} shadow-lg relative overflow-hidden hover:brightness-110 transition-all">
                        <div class="absolute top-0 left-0 w-full h-1/3 bg-white/10 skew-y-12 transform -translate-y-full group-hover:translate-y-full transition-transform duration-1000"></div>
                        <div class="text-center font-bold text-sm md:text-base leading-tight uppercase skew-child-reverse break-words w-full px-1 text-white">
                            ${content}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- MODAL ---
        window.toggleModal = function(show) {
            const modal = document.getElementById('help-modal');
            if (show) {
                modal.classList.remove('hidden');
                modal.classList.add('flex'); // Important pour centrer
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
            lucide.createIcons();
        };

        // Initialisation
        startNewGame();
        lucide.createIcons();

    </script>
</body>
</html>
